                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          cacheIntrospection:
                            description: Cache the introspection endpoint requests.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          cacheTokenExchange:
                            description: Cache the legacy token exchange endpoint

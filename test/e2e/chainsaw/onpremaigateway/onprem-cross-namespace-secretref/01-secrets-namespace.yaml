# The Secrets live in a different namespace than the configuration entities.
# The WatchNamespaceGrant lets the OnPremAIGateway watch that namespace: the
# instance cache must hold the Secrets and the KongReferenceGrants there.
apiVersion: gateway-operator.konghq.com/v1alpha1
kind: WatchNamespaceGrant
metadata:
  name: allow-onprem-aigateway
  namespace: ($secrets_namespace)
spec:
  from:
    - group: aigateway.konghq.com
      kind: OnPremAIGateway
      namespace: ($namespace)
---
apiVersion: v1
kind: Secret
metadata:
  name: ($provider_credentials_name)
  namespace: ($secrets_namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  apikey: test-ai-gateway-key
---
apiVersion: v1
kind: Secret
metadata:
  name: ($policy_secret_name)
  namespace: ($secrets_namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  config: |
    add:
      headers:
        - "Modified-By-Cross-Namespace-Secret:Kong-Operator-Chainsaw-Test"

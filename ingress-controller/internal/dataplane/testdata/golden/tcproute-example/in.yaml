apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-gateway-class
spec:
  controllerName: konghq.com/kic-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-tcp-gateway
  namespace: tcp-example
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tcp
    protocol: TCP
    port: 1025
status:
  listeners:
  - name: tcp
    supportedKinds:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
    conditions:
    - type: Programmed
      status: "True"
      reason: Programmed
      message: ""
      lastTransitionTime: "2024-01-01T00:00:00Z"
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: echo-plaintext
  namespace: tcp-namespace
spec:
  parentRefs:
  - name: example-tcp-gateway
    namespace: tcp-example
  rules:
  - rule: rule-echo
    backendRefs:
    - name: echo
      port: 1025
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: tcp-namespace
  labels:
    app: echo
spec:
  ports:
    - port: 1025
      name: tcp
      protocol: TCP
      targetPort: 1025
    - port: 1026
      name: udp
      protocol: TCP
      targetPort: 1026
    - port: 1027
      name: http
      protocol: TCP
      targetPort: 1027
  selector:
    app: echo

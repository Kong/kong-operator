                              If multiple values are set, it means the claim is inside a nested object of
                              the token payload.
                            items:
                              type: string
                            type: array
                          authorizationCookieDomain:
                            description: The authorization cookie Domain flag.
                            maxLength: 253
                            type: string
                          authorizationCookieHTTPOnly:

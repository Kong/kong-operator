##
# HTTPRoute with two rules carrying the IDENTICAL URLRewrite filter (path.type
# ReplacePrefixMatch, replacePrefixMatch: "/") but different match paths (/get and /).
#
# Each rule translates to its own request-transformer KongPlugin whose replace.uri is derived
# from that rule's match path (see translatePathReplacePrefixMatch in
# controller/hybridgateway/plugin/converter.go):
#   - rule matching /get (non-root)  -> $(uri_captures[1] == nil and "/" or uri_captures[1])
#   - rule matching / (root)         -> $(uri_captures[1] == nil and "/" or "/" .. uri_captures[1])
#
# Regression test for the shared-plugin name collision: when the generated KongPlugin name was
# derived from the filter contents alone, both rules collided on ONE shared KongPlugin whose
# config.uri flipped between the two translations on every reconcile, even though nothing
# changed in the cluster. With the fix, each rule gets its own KongPlugin with the correct
# config, asserted in the chainsaw-test.yaml steps for this route.
#
# Required bindings:
#   - http_route_name: Name of the HTTPRoute resource
#   - http_route_namespace: Namespace of the HTTPRoute resource
#   - test_name: The test name label to match (used for labels)
#   - route_hosts: List of hostnames for the HTTPRoute
#   - gateway_name: Name of the Gateway parent resource
#   - httpbin_deployment_name: Name of the httpbin backend service
#   - httpbin_deployment_namespace: Namespace of the httpbin backend service

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: ($http_route_name)
  namespace: ($http_route_namespace)
  labels:
    chainsaw/test: ($test_name)
  annotations:
    konghq.com/strip-path: "false"
spec:
  hostnames: ($route_hosts)
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ($gateway_name)
  rules:
    # Rule 1: non-root prefix match. The replacePrefixMatch "/" normalizes to "" and the match
    # path is not root, so the translated uri is the "no leading slash" Lua ternary variant.
    - matches:
        - path:
            type: PathPrefix
            value: /get
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ($httpbin_deployment_name)
          port: 80
          namespace: ($httpbin_deployment_namespace)
    # Rule 2: root prefix match. The replacePrefixMatch "/" normalizes to "" and the match path
    # is root, so the translated uri is the "leading slash" Lua ternary variant.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ($httpbin_deployment_name)
          port: 80
          namespace: ($httpbin_deployment_namespace)

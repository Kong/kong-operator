  id: OGYwYjNjMWUtMmQ0YS00YjZlLTlmN2EtMWMyZDNlNGY1YTZi
  cert: 
---
apiVersion: v1
kind: Service
metadata:
  name: goecho
  namespace: default
spec:
  ports:
    - port: 1028
      protocol: TCP
      targetPort: 1028
  selector:
    app: goecho
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: default
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app: httpbin
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: goecho-tls-policy
  namespace: default
spec:
  options:
    tls-verify-depth: "1"
  targetRefs:
    - group: core
      kind: Service
      name: goecho
  validation:
    caCertificateRefs:
      - group: core
        kind: ConfigMap
        name: ca-configmap
    hostname: goecho.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: httpbin-tls-policy
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: httpbin
  validation:
    caCertificateRefs:
      - group: core
        kind: Secret
        name: ca-secret
    hostname: httpbin.example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-backendtlspolicy
  namespace: default
spec:
  parentRefs:
    - name: kong
  rules:
    - name: goecho
      matches:
        - path:
            type: PathPrefix
            value: /goecho
      backendRefs:
        - name: goecho
          kind: Service
          port: 1028
    - name: httpbin
      matches:
        - path:
            type: PathPrefix
            value: /httpbin
      backendRefs:
        - name: httpbin
          kind: Service
          port: 443

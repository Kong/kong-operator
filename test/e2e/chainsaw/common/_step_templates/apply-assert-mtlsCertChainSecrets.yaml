# Template for generating a fresh self-signed CA and a leaf certificate
# signed by that CA (via generate_mtls_certificate_chain.sh), storing each in
# its own Secret. The mTLS client cert/key the script also produces is
# unused here and discarded.
#
# Required bindings:
#   - ca_common_name: CN for the self-signed CA certificate.
#   - server_common_name: Primary CN/SAN for the leaf certificate.
#   - server_sans: Comma-separated list of additional DNS SANs for the leaf
#       certificate. Pass '' when no additional SANs are needed.
#   - ca_secret_name: Name of the Secret to hold the CA certificate (key 'ca.crt').
#   - ca_secret_namespace: Namespace for the CA Secret.
#   - server_secret_name: Name of the Secret to hold the leaf cert/key
#       (kubernetes.io/tls, keys tls.crt/tls.key).
#   - server_secret_namespace: Namespace for the leaf cert Secret.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-mtls-cert-chain-secrets
spec:
  try:
    - script:
        env:
          - name: CA_COMMON_NAME
            value: ($ca_common_name)
          - name: SERVER_COMMON_NAME
            value: ($server_common_name)
          - name: SERVER_SANS
            value: ($server_sans)
          - name: CLIENT_COMMON_NAME
            value: unused-client
        content: |
          bash ../../common/scripts/generate_mtls_certificate_chain.sh
        outputs:
          - name: ca_cert
            value: (json_parse($stdout).ca_cert)
          - name: server_cert
            value: (json_parse($stdout).server_cert)
          - name: server_key
            value: (json_parse($stdout).server_key)
        check:
          (json_parse($stdout).ca_cert != null): true
          (json_parse($stdout).server_cert != null): true
          (json_parse($stdout).server_key != null): true
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($ca_secret_name)
            namespace: ($ca_secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: Opaque
          stringData:
            ca.crt: ($ca_cert)
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($server_secret_name)
            namespace: ($server_secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: kubernetes.io/tls
          stringData:
            tls.crt: ($server_cert)
            tls.key: ($server_key)
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($ca_secret_name)
            namespace: ($ca_secret_namespace)
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($server_secret_name)
            namespace: ($server_secret_namespace)
          type: kubernetes.io/tls

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-policy
spec:
  description: |
    AIGatewayPolicy behavior against an on-prem control plane and data plane,
    verified on real traffic: a response-transformer policy adds a
    distinctive response header, and the traffic steps assert the header by
    name AND value. Mirrors the Konnect suite's `aigateway-policy` test.

    Covers, in order:
    1. inline config (policy created before the model referencing it);
    2. secretRef config (the model is re-pointed to the new policy, proving
       the re-rendered document is re-pushed);
    3. secret-driven re-render: updating the referenced Secret changes the
       policy's config and the new value reaches the data plane;
    4. the runtime-2.1 `condition` field (kcel syntax), gating the plugin on
       the request path — supported on-prem because the translator's default
       min_runtime_version is 2.1.

    The model's `Programmed` transitions between re-points are deliberately
    not asserted (timing-fragile); the traffic assertions are the observable
    proof that each re-point re-rendered and re-pushed.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: model_name
      value: (join('-', [($test_name), 'model']))
    - name: provider_name
      value: (join('-', [($test_name), 'provider']))
    - name: provider_credentials_name
      value: (join('-', [($provider_name), 'credentials']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-provider
      try:
        - apply:
            file: 01-provider.yaml
    - name: Create-policy-with-inline-config
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-inline']))
      try:
        - apply:
            file: 02-policy-inline.yaml
    - name: Create-model-referencing-the-policy
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-inline']))
      try:
        - apply:
            file: 03-model.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-model-and-policy-pushed
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-inline']))
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayPolicy
              metadata:
                name: ($aigw_policy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Verify-inline-policy-is-applied
      description: |
        The response-transformer adds the policy's header to the response;
        both header name and value are pinned.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /policy/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Policy-Inline"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Create-policy-with-secretref-config
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-secretref']))
        - name: aigw_policy_secretref_name
          value: (join('-', [($test_name), 'policy-secretref-secret']))
      try:
        - apply:
            file: 04-policy-secretref.yaml
    - name: Update-model-to-reference-the-secretref-policy
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-secretref']))
      try:
        - apply:
            file: 03-model.yaml
    - name: Verify-secretref-policy-is-applied
      description: |
        The model was re-pointed to the secretRef policy; the new header
        proves the re-rendered document was re-pushed to the data plane.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /policy/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Policy-Secretref"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Update-the-policy-secret
      description: |
        Updating the Secret referenced by the secretRef policy must re-render
        the policy's config and re-push it: the response header changes.
      bindings:
        - name: aigw_policy_secretref_name
          value: (join('-', [($test_name), 'policy-secretref-secret']))
      try:
        - apply:
            file: 05-policy-secret-updated.yaml
    - name: Verify-secretref-policy-after-secret-update
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /policy/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Policy-Secretref-Updated"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Create-policy-with-condition
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-condition']))
      try:
        - apply:
            file: 06-policy-condition.yaml
    - name: Update-model-to-reference-the-condition-policy
      bindings:
        - name: aigw_policy_name
          value: (join('-', [($test_name), 'policy-condition']))
      try:
        - apply:
            file: 03-model.yaml
    - name: Verify-condition-policy-is-applied
      description: |
        The policy's condition (`http.path.startsWith("/policy/chat")`)
        matches the request path, so the header must be present — the
        condition gated plugin execution and the runtime accepted the 2.1
        feature.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /policy/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Policy-Condition"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Verify-condition-policy-does-not-apply-on-non-matching-path
      description: |
        Negative for the condition: a request routed through the same model
        whose path does NOT match the condition's startsWith expression gets
        a 200 from the model but WITHOUT the policy's header — proving the
        condition gates the plugin rather than it being unconditionally
        applied. Three consecutive header-less responses guard against a
        propagation blip.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /policy/other
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Policy-Condition"
              - name: EXPECTED_SUCCESS
                value: "false"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-policy
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

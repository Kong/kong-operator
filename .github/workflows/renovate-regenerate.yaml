name: regenerate after dependency bump

# The API types, CRDs, documentation and AI Gateway controller code are generated from the
# OpenAPI spec that ships in the SDK module. The operator consumes the internal SDK through a
# replace directive: github.com/Kong/sdk-konnect-go is replaced with
# github.com/Kong/sdk-konnect-go-internal. A bump of the replace version changes the spec, so
# the generated files must change with it. Renovate only rewrites go.mod, so this workflow
# runs the generators on the bump pull request and pushes the result to the pull request
# branch.
on:
  # pull_request_target, not pull_request: a pull_request run reads the workflow file from the
  # pull request's own tree, so this file would not run on release-branch pull requests until
  # it is backported to every branch in renovate.json baseBranchPatterns. pull_request_target
  # reads it from the default branch, so one file covers every branch. The actor check below
  # keeps fork pull requests out, so the write token never runs untrusted code.
  pull_request_target:
    paths:
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  # A newer commit on the branch replaces an older run.
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Renovate names the branch after the package, for example
    # renovate/main-github.com-kong-sdk-konnect-go-internal-0.x. On release branches Renovate
    # groups every update under the release-branch-updates slug, so the package name is only
    # in the pull request body. The actor check keeps the run that the pushed commit starts
    # from regenerating the files a second time.
    if: >-
      github.actor == 'renovate[bot]' &&
      (contains(github.head_ref, 'sdk-konnect-go') ||
       contains(github.event.pull_request.body, 'sdk-konnect-go'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || 30) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Mint the token in the job that uses it: app tokens do not survive being passed
      # between jobs or through reusable-workflow boundaries. A push with this token also
      # starts the pull request workflows on the new commit; a push with GITHUB_TOKEN does not.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
          permission-contents: write

      # No token here: the generation step runs repository scripts and freshly bumped
      # dependencies, so the write token stays out of the workspace and appears only in the
      # push step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-mise
        with:
          install: false

      # Same target chain that `make verify.generators` runs in CI.
      - name: Run make generate
        run: make generate

      - name: Push the regenerated files
        env:
          HEAD_REF: ${{ github.head_ref }}
          # Only reaches this step, never the workspace or a remote URL.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "The generated files are up to date."
            exit 0
          fi

          git config user.name "Kong's Team k8s bot"
          git config user.email "team-k8s+github-bot@konghq.com"
          git add --all
          git commit --message "chore: regenerate files after sdk-konnect-go-internal bump"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64)" \
            push origin "HEAD:${HEAD_REF}"

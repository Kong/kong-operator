##
# Rotated version of the Secret backing the configFrom KongPlugin. Applying it must make the
# operator re-resolve the plugin configuration and push the new value to the control plane.
#
# Required bindings:
#   - test_name: The test name label to match (used for labels)
#   - config_from_secret_name: Name of the Secret holding the plugin configuration
#   - http_route_config_from_namespace: Namespace of the Secret

---
apiVersion: v1
kind: Secret
metadata:
  name: ($config_from_secret_name)
  namespace: ($http_route_config_from_namespace)
  labels:
    chainsaw/test: ($test_name)
    konghq.com/secret: "true"
stringData:
  config: |
    add:
      headers:
      - "X-Config-From:rotated-secret"

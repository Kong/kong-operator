name: ack CRD breaking change

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read

jobs:
  rerun-failed-tests:
    if: ${{ github.event.label.name == 'ack_crd_breaking_change' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # The rerun endpoint needs "Actions: write", which GITHUB_TOKEN is not granted here: the call
      # goes through the App, so the App must hold that permission.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
          permission-actions: write
      - name: Rerun failed CRD breaking-change check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run_ids="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow tests.yaml \
            --limit 50 \
            --json conclusion,createdAt,databaseId,event,headSha,status \
            --jq '[.[] | select(.headSha == env.HEAD_SHA and .event == "pull_request" and .status == "completed" and .conclusion == "failure")] | sort_by(.createdAt) | reverse | .[].databaseId')"

          crd_job_id=""
          for candidate_run_id in ${run_ids}; do
            crd_job_id="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "verify / crd-breaking-changes" and .conclusion == "failure") | .id' | head -n 1)"

            if [[ -n "${crd_job_id}" ]]; then
              break
            fi
          done

          if [[ -z "${crd_job_id}" ]]; then
            echo "No failed CRD breaking-change check found for ${HEAD_SHA}."
            exit 0
          fi

          # Re-running a job also re-runs dependent jobs, so the aggregate required
          # `passed` job is recalculated after crd-breaking-changes succeeds.
          echo "Rerunning failed CRD breaking-change job ${crd_job_id}."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${crd_job_id}/rerun"

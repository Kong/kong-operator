---
apiVersion: konnect.konghq.com/v1alpha1
kind: KonnectAPIAuthConfiguration
metadata:
  name: konnect-api-auth-dev-1
  namespace: default
spec:
  type: token
  token: kpat_XXXXXXXXXXXXXXXXXXX
  serverURL: us.api.konghq.com
---
apiVersion: konnect.konghq.com/v1alpha2
kind: KonnectGatewayControlPlane
metadata:
  name: test1
  namespace: default
spec:
  createControlPlaneRequest:
    name: test1
    labels:
      app: test1
      key1: test1
  konnect:
    authRef:
      name: konnect-api-auth-dev-1
---
# The private key is not stored in Kubernetes: it is a Kong vault reference that
# is passed to Kong as-is and resolved by Kong Gateway at runtime.
# The referenced vault (here: 'certvault') has to exist in the Control Plane,
# e.g. created through a KongVault.
apiVersion: configuration.konghq.com/v1alpha1
kind: KongCertificate
metadata:
  name: cert-with-vault-ref-key
  namespace: default
  annotations:
    konghq.com/tags: "infra,example"
spec:
  controlPlaneRef:
    type: konnectNamespacedRef
    konnectNamespacedRef:
      name: test1
  type: inline

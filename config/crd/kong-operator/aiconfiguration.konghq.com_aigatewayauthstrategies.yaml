                                alg:
                                  maxLength: 253
                                  type: string
                                crv:
                                  maxLength: 253
                                  type: string
                                d:
                                  maxLength: 253
                                  type: string
                                dp:
                                  maxLength: 253
                                  type: string
                                dq:
                                  maxLength: 253
                                  type: string
                                e:
                                  maxLength: 253
                                  type: string
                                issuer:
                                  maxLength: 253
                                  type: string
                                k:
                                  maxLength: 253
                                  type: string
                                keyOps:
                                  items:
                                    type: string
                                  type: array
                                kid:
                                  maxLength: 253
                                  type: string
                                kty:
                                  maxLength: 253
                                  type: string
                                "n":
                                  maxLength: 253
                                  type: string
                                oth:
                                  maxLength: 253
                                  type: string
                                p:
                                  maxLength: 253
                                  type: string
                                q:
                                  maxLength: 253
                                  type: string
                                qi:
                                  maxLength: 253
                                  type: string
                                r:
                                  maxLength: 253
                                  type: string
                                t:
                                  maxLength: 253
                                  type: string
                                use:
                                  maxLength: 253
                                  type: string
                                x:
                                  maxLength: 253
                                  type: string

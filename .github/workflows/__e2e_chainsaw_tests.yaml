name: E2E Chainsaw tests

on:
  workflow_call:
    inputs:
      node_image_version:
        description: "Kind node image version"
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_VERBOSE: 1
  MISE_DEBUG: 1

jobs:
  e2e-tests-chainsaw:
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || 30) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.suite }}${{ matrix.ip_family && format(' {0}', matrix.ip_family) || '' }} - ${{ inputs.node_image_version }}
    env:
      IMG: kong-operator
      TAG: e2e-${{ github.sha }}
      CLUSTER_NAME: e2e-chainsaw
      TEST_ID: ${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: gateway
        - suite: gateway
          ip_family: ipv6
        - suite: hybridgateway
        - suite: hybridgateway
          ip_family: ipv6
        - suite: konnect
        - suite: aigateway
        - suite: eventgateway
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download e2e image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: kong-operator-e2e-image-${{ github.run_id }}

    - name: load docker image
      run: docker load -i kong-operator_e2e.tar

    - uses: ./.github/actions/setup-mise
      with:
        install_args: github:Kong/kubernetes-testing-framework aqua:helm/helm kind

    - uses: Kong/kong-license@ddccb487a0b319cef85f348b16a1ad2b6d9c1df7 # master @ 20260529
      id: license
      with:
        op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    - uses: ./.github/actions/bump-inotify

    - name: Create k8s KinD Cluster with ktf
      env:
        # NOTE: add GITHUB_TOKEN to env to allow ktf to query GitHub API without
        # hitting unauthenticated rate limits.
        # This token is being used e.g. in here:
        # https://github.com/Kong/kubernetes-testing-framework/blob/f233236e89ebcaf79575c5084053e4196c037165/pkg/utils/github/release.go#L46
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_IMAGE_VERSION: ${{ inputs.node_image_version }}
        IP_FAMILY: ${{ matrix.ip_family }}
      run: |
        IPV6_FLAG=()
        if [ "$IP_FAMILY" = "ipv6" ]; then
          IPV6_FLAG=(--ipv6-only)
        fi
        ktf environments create \
          --name "$CLUSTER_NAME" \
          --addon metallb \
          --addon cert-manager \
          --kubernetes-version "$NODE_IMAGE_VERSION" \
          "${IPV6_FLAG[@]}"

    - name: Set up NAT64 + DNS64 for IPv6-only cluster external reachability
      if: ${{ matrix.ip_family == 'ipv6' }}
      uses: ./.github/actions/setup-nat64-dns64

    - name: Load image to kind cluster
      run: kind load docker-image "$IMG:$TAG" --name "$CLUSTER_NAME"

    - name: Deploy operator with Helm
      run: |
        helm install kong-operator charts/kong-operator \
          --namespace kong-system \
          --create-namespace \
          --set image.repository="$IMG" \
          --set image.tag="$TAG" \
          --set env.enable_controller_konnect=true \
          --set env.enable_controller_kegdataplane=true \
          --set env.enable_controller_aigatewaydataplane=true \
          --wait

    - name: Apply chainsaw suite prerequisites
      env:
        SUITE: ${{ matrix.suite }}
        KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}
      run: make test.e2e.chainsaw.prereq DIRNAME="$SUITE"

    - name: run chainsaw e2e tests
      id: chainsaw-tests
      env:
        KONNECT_TOKEN: ${{ secrets.KONG_TEST_KONNECT_ACCESS_TOKEN }}
        KONNECT_SERVER_URL: us.api.konghq.tech
        TEST_ID: ${{ env.TEST_ID }}
        CHAINSAW_TEST_DIR: test/e2e/chainsaw/${{ matrix.suite }}
        CHAINSAW_CONFIG: test/e2e/chainsaw/.chainsaw.yaml
        EXPECTED_DEFAULT_STREAM_LISTEN: ${{ matrix.ip_family == 'ipv6' && '[::]:8899 ssl reuseport' || '0.0.0.0:8899 ssl reuseport' }}
      run: |
        # Use CHAINSAW_TEST_DIR to target the specific test directory
        make test.e2e.chainsaw

    - name: Dump cluster diagnostics on failure or cancellation
      if: always() && steps.chainsaw-tests.outcome != 'success'
      env:
        SUITE: ${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}
      run: |
        # Chainsaw catch blocks never run when the job is cancelled (e.g. by the
        # job timeout), so /tmp/chainsaw stays empty and the upload below is a
        # no-op. Dump cluster state and operator logs at the workflow level too.
        # We don't know which test namespace was active on cancellation, so
        # capture every non-system, non-infra namespace plus the operator
        # namespace. The runner only allows ~5 minutes of post-cancellation
        # steps before killing them, so keep this dump fast: skip the slow
        # resource-counting summary and infra namespaces we don't debug.
        # `timeout 4m` caps the whole dump: the upload step below must start
        # inside the runner's post-cancellation grace window.
        NAMESPACES=$(kubectl get namespaces -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | grep -vE '^(kube-(system|node-lease|public)|cert-manager|metallb-system|local-path-storage)$' | tr '\n' ' ')
        TEST_NAME="${SUITE}" \
        NAMESPACE="$(echo "${NAMESPACES}" | awk '{print $1}')" \
        ADDITIONAL_NAMESPACES="$(echo "${NAMESPACES}" | awk '{$1=""; print}' | tr -s ' ' ',' | sed 's/^,//')" \
        SKIP_RESOURCE_COUNTS=1 \
        timeout 4m bash test/e2e/chainsaw/common/scripts/debug_snapshot.sh || true

    - name: Upload debug snapshots as artifacts
      if: always() && steps.chainsaw-tests.outcome != 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chainsaw-debug-snapshots-${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}-${{ github.run_id }}
        path: /tmp/chainsaw/
        if-no-files-found: ignore
        retention-days: 3

    - name: Clean up debug snapshots
      if: always() && steps.chainsaw-tests.outcome != 'success'
      env:
        SUITE: ${{ matrix.suite }}
      run: rm -rf "/tmp/chainsaw/$SUITE"

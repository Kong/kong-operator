apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-auth-strategy-openid-connect
spec:
  description: |
    Dedicated coverage for the openid-connect AIGatewayAuthStrategy on-prem: stands up an
    OnPremAIGateway, an openid-connect AIGatewayAuthStrategy pointed at a mock OIDC
    provider deployed into this test's own namespace (00-oidc-mock.yaml, not part of the
    shared on-prem fixtures, since the secret-revocation scenario below needs to mutate it
    freely), an AIGatewayConsumer (type oauth, customID mapped from the token's client_id
    claim) and an AIGatewayAgent route (backed by the shared go-echo backend) requiring the
    strategy via access.authStrategies. Verifies the auth strategy actually validates
    Bearer tokens end-to-end against a real in-cluster AIGatewayDataPlane. Mirrors the
    Konnect suite's `auth-strategy-openid-connect` test:

      1. Requests without an Authorization header are rejected (401).
      2. Requests with an invalid Bearer token are rejected (401).
      3. A real access token obtained from the mock OIDC provider's client_credentials
         grant succeeds (200).
      4. After the client secret is revoked at the mock, the same request is rejected
         again (401), observed via the script's inverted retry loop (EXPECTED_SUCCESS
         'false').
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    - name: oidc_auth_strategy_name
      value: (join('-', [($test_name), 'oidc-auth-strategy']))
    - name: oidc_client_secret_name
      value: (join('-', [($test_name), 'oidc-client-secret']))
    - name: oidc_issuer
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/.well-known/openid-configuration']))
    - name: oidc_token_url
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/connect/token']))
    - name: oidc_client_id
      value: aigateway-oidc-client
    - name: oidc_client_secret_value
      value: aigateway-oidc-client-secret
    - name: oidc_scope
      value: aigateway-scope
    - name: consumer_name
      value: (join('-', [($test_name), 'consumer']))
    - name: http_agent_name
      value: (join('-', [($test_name), 'http-agent']))
    - name: http_agent_route_path
      value: /http-agent
    # Defaults for verify-aigw-agent-request-from-cluster optional bindings.
    # Steps below only need to override what differs from these. NOTE:
    # oidc_token_url/oidc_client_id/oidc_scope are NOT defaulted here since
    # they're already bound above (to real values used by the auth strategy
    # setup) and cascade automatically; the reject-* steps below must
    # explicitly override them to '' to disable auto bearer-token fetching.
    - name: request_headers
      value: ''
    - name: request_body
      value: ''
    - name: content_type
      value: application/json
    - name: expected_status
      value: "200"
    - name: expected_status_not
      value: ''
    - name: expected_body
      value: ''
    - name: unexpected_body
      value: ''
    - name: expected_jsonrpc
      value: ''
    - name: expected_json_id
      value: ''
    - name: expected_json_result_text
      value: ''
    - name: oidc_client_secret
      value: ''
    - name: expected_success
      value: 'true'
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-oidc-mock
      try:
        - apply:
            file: 00-oidc-mock.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
    - name: Create-oidc-auth-strategy
      try:
        - apply:
            file: 02-oidc-auth-strategy.yaml
    - name: Create-consumer
      try:
        - apply:
            file: 03-consumer.yaml
    - name: Start-echo-agent-backend
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
    - name: Create-aigateway-agent
      try:
        - apply:
            file: 04-agent.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    # Entities report Programmed=False before the data plane exists (with no
    # Admin API endpoints discovered the push is skipped and the entities are
    # reported as failed), so assert here, after the data plane step.
    - name: Assert-entities-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAuthStrategy
              metadata:
                name: ($oidc_auth_strategy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumer
              metadata:
                name: ($consumer_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAgent
              metadata:
                name: ($http_agent_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Reject-request-without-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_status
              value: "401"
            - name: oidc_token_url
              value: ''
            - name: oidc_client_id
              value: ''
            - name: oidc_scope
              value: ''
    - name: Reject-request-with-invalid-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: "Authorization:Bearer not-a-real-token"
            - name: expected_status
              value: "401"
            - name: oidc_token_url
              value: ''
            - name: oidc_client_id
              value: ''
            - name: oidc_scope
              value: ''
    - name: Accept-request-with-valid-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
    # oidc-mock is deployed into this test's own namespace (00-oidc-mock.yaml), so
    # mutating it here is safely scoped to this test run and doesn't affect other
    # suites/reruns.
    - name: Revoke-client-secret-and-revoke-access
      try:
        - patch:
            file: 01-oidc-mock-secret-revoked.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
                updatedReplicas: 1
    - name: Reject-request-after-secret-revoked
      description: |
        EXPECTED_SUCCESS 'false' inverts the template's retry loop: it keeps retrying while
        the token mint/request still succeeds and only concludes once a rejection is
        observed, so a token minted just before the mock's rollout isn't mistaken for the
        revoked secret still working.
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
            - name: expected_success
              value: 'false'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-auth-strategy-openid-connect
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

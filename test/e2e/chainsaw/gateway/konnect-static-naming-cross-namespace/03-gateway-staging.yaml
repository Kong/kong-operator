# Statically named, and deliberately identical to the Gateway in the "production"
# namespace: the condition that triggers the Konnect 409 of
# https://github.com/Kong/kong-operator/issues/4079.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ($gateway_name)
  namespace: ($staging_namespace)
  annotations:
    gateway-operator.konghq.com/static-naming: "true"
spec:
  gatewayClassName: (join('-', [($test_name), 'staging-gateway-class']))
  listeners:
    - name: http
      protocol: HTTP
      port: ($listener_http_port)

name: E2E Chainsaw tests

on:
  workflow_call:
    inputs:
      node_image_version:
        description: "Kind node image version"
        type: string
        required: true
      aigw-dp-image:
        description: "AIGatewayDataPlane image to test with (repository:tag). Defaults
          to the image defined in test/test_dependencies.yaml."
        type: string
        required: false
        default: ""
      suites:
        description: "JSON array of matrix entries ({suite, dir, selector, ip_family}) to run: suite names the entry, dir is the directory of its tests under test/e2e/chainsaw (default: suite), selector the labels of the tests to run (default: all)."
        type: string
        required: false
        default: >-
          [
            {"suite": "gateway"},
            {"suite": "gateway", "ip_family": "ipv6"},
            {"suite": "hybridgateway"},
            {"suite": "hybridgateway", "ip_family": "ipv6"},
            {"suite": "konnect"},
            {"suite": "konnect-private"},
            {"suite": "aigateway"},
            {"suite": "onpremaigateway"},
            {"suite": "eventgateway"},
            {"suite": "onpremeventgateway"},
            {"suite": "eventgateway-cross-namespace-konnect", "dir": "eventgateway-cross-namespace", "selector": "gateway=konnect"},
            {"suite": "eventgateway-cross-namespace-onprem", "dir": "eventgateway-cross-namespace", "selector": "gateway=onprem"},
            {"suite": "gwadmin"},
            {"suite": "gwadmin", "ip_family": "ipv6"},
            {"suite": "conversion-webhook"}
          ]

permissions:
  contents: read

env:
  MISE_VERBOSE: 1
  MISE_DEBUG: 1

jobs:
  e2e-tests-chainsaw:
    # Listener-chain lifecycle has 19 sequential 75s observation windows (>60s
    # default sync period): at least 23m45s before convergence, setup, and cleanup.
    # The full eventgateway job takes ~32m; allow headroom without shortening
    # drift/retention checks. See test/e2e/chainsaw/eventgateway/README.md.
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || (matrix.suite == 'eventgateway' && '45' || '30')) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.suite }}${{ matrix.ip_family && format(' {0}', matrix.ip_family) || '' }} - ${{ inputs.node_image_version }}
    env:
      IMG: kong-operator
      TAG: e2e-${{ github.sha }}
      CLUSTER_NAME: e2e-chainsaw
      TEST_ID: ${{ github.run_id }}
      GW_ADMIN_LICENSE_REQUIRED: ${{ (matrix.suite == 'gwadmin' || matrix.suite == 'onpremeventgateway' || matrix.suite == 'eventgateway-cross-namespace-onprem') && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suites) }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Calculate GWAdmin license expiration
      id: gwadmin-license-expiration
      if: ${{ vars.GW_ADMIN_LICENSE_SOURCE == 'signing' && (matrix.suite == 'gwadmin' || matrix.suite == 'onpremeventgateway' || matrix.suite == 'eventgateway-cross-namespace-onprem') }}
      run: |
        expiration_date="$(jq -nr 'now + (7 * 24 * 60 * 60) | strftime("%Y-%m-%d")')"
        printf 'date=%s\n' "$expiration_date" >> "$GITHUB_OUTPUT"

    # static is an explicit temporary grace-period mode, never a signing fallback.
    # Current JWS payload expiry: 2026-11-12, with team-confirmed 30-day grace.
    # Replace/switch before the window ends; gw-admin owns its exact boundary.
    # Keep the JWS/customer/key in secrets; this selector contains no license data.
    - name: Acquire the required GWAdmin license
      id: gwadmin-license
      if: ${{ matrix.suite == 'gwadmin' || matrix.suite == 'onpremeventgateway' || matrix.suite == 'eventgateway-cross-namespace-onprem' }}
      uses: ./.github/actions/gwadmin-license
      with:
        source: ${{ vars.GW_ADMIN_LICENSE_SOURCE }}
        static-license: ${{ secrets.GW_ADMIN_LICENSE_JWS }}
        username: ${{ secrets.GW_ADMIN_LICENSE_SIGNING_USERNAME }}
        password: ${{ secrets.GW_ADMIN_LICENSE_SIGNING_PASSWORD }}
        customer: ${{ secrets.GW_ADMIN_LICENSE_CUSTOMER }}
        license-key: ${{ secrets.GW_ADMIN_LICENSE_KEY }}
        expiration-date: ${{ steps.gwadmin-license-expiration.outputs.date }}

    - name: download e2e image artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kong-operator-e2e-image-${{ github.run_id }}

    - name: load docker image
      run: docker load -i kong-operator_e2e.tar

    - uses: ./.github/actions/setup-mise
      with:
        install_args: github:Kong/kubernetes-testing-framework aqua:helm/helm kind

    - uses: ./.github/actions/kong-license
      id: license
      with:
        cached-license: ${{ secrets.KONG_LICENSE_DATA }}
        op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    - uses: ./.github/actions/bump-inotify

    - name: Create k8s KinD Cluster with ktf
      env:
        # NOTE: add GITHUB_TOKEN to env to allow ktf to query GitHub API without
        # hitting unauthenticated rate limits.
        # This token is being used e.g. in here:
        # https://github.com/Kong/kubernetes-testing-framework/blob/f233236e89ebcaf79575c5084053e4196c037165/pkg/utils/github/release.go#L46
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_IMAGE_VERSION: ${{ inputs.node_image_version }}
        IP_FAMILY: ${{ matrix.ip_family }}
      run: |
        IPV6_FLAG=()
        if [ "$IP_FAMILY" = "ipv6" ]; then
          IPV6_FLAG=(--ipv6-only)
        fi
        ktf environments create \
          --name "$CLUSTER_NAME" \
          --addon metallb \
          --addon cert-manager \
          --kubernetes-version "$NODE_IMAGE_VERSION" \
          "${IPV6_FLAG[@]}"

    - name: Set up NAT64 + DNS64 for IPv6-only cluster external reachability
      if: ${{ matrix.ip_family == 'ipv6' }}
      uses: ./.github/actions/setup-nat64-dns64

    - name: Load image to kind cluster
      run: kind load docker-image "$IMG:$TAG" --name "$CLUSTER_NAME"

    - name: Resolve the gw-admin image
      # The operator deploys gw-admin itself (RELATED_IMAGE_GW_ADMIN), so the
      # pinned image must reach the operator, not only the tests (which read
      # GW_ADMIN_IMAGE through the Makefile to assert it).
      if: ${{ matrix.suite == 'gwadmin' || matrix.suite == 'onpremeventgateway' || matrix.suite == 'eventgateway-cross-namespace-onprem' }}
      run: |
        IMAGE="$(yq -r '.chainsaw.gw-admin.image // ""' < test/test_dependencies.yaml)"
        TAG="$(yq -r '.chainsaw.gw-admin.tag // ""' < test/test_dependencies.yaml)"
        if [ -z "${IMAGE}" ] || [ -z "${TAG}" ]; then
          echo "chainsaw.gw-admin.image and .tag must be set in test/test_dependencies.yaml" >&2
          exit 1
        fi
        echo "GW_ADMIN_IMAGE=${IMAGE}:${TAG}" >> "$GITHUB_ENV"

    - name: Deploy operator with Helm
      env:
        SUITE: ${{ matrix.suite }}
      run: |
        # Only the suites that need gw-admin run the GWAdmin controller: a
        # fault in it must not fail the other suites. They push the
        # configuration of OnPremEventGateways to it.
        GWADMIN_FLAGS=()
        case "$SUITE" in
          gwadmin|onpremeventgateway|eventgateway-cross-namespace-onprem)
            GWADMIN_FLAGS=(--set env.enable_controller_gwadmin=true
              --set env.enable_controller_onpremeventgateway=true
              --set-string customEnv.RELATED_IMAGE_GW_ADMIN="$GW_ADMIN_IMAGE") ;;
        esac
        helm install kong-operator charts/kong-operator \
          --namespace kong-system \
          --create-namespace \
          --set image.repository="$IMG" \
          --set image.tag="$TAG" \
          --set env.enable_controller_konnect=true \
          --set env.enable_controller_kegdataplane=true \
          --set env.enable_controller_aigatewaydataplane=true \
          --set env.enable_controller_onpremaigateway=true \
          "${GWADMIN_FLAGS[@]}" \
          --wait

    - name: Apply chainsaw suite prerequisites
      env:
        DIRNAME: ${{ matrix.dir || matrix.suite }}
        KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}
        GW_ADMIN_LICENSE_FILE: ${{ steps.gwadmin-license.outputs.license-file }}
      run: make test.e2e.chainsaw.prereq DIRNAME="$DIRNAME"

    - name: run chainsaw e2e tests
      id: chainsaw-tests
      env:
        KONNECT_TOKEN: ${{ secrets.KONG_TEST_KONNECT_ACCESS_TOKEN }}
        KONNECT_SERVER_URL: us.api.konghq.tech
        TEST_ID: ${{ env.TEST_ID }}
        AIGW_DP_IMAGE: ${{ inputs.aigw-dp-image }}
        CHAINSAW_TEST_DIR: test/e2e/chainsaw/${{ matrix.dir || matrix.suite }}
        CHAINSAW_CONFIG: test/e2e/chainsaw/.chainsaw.yaml
        CHAINSAW_SELECTOR: ${{ matrix.selector }}
        EXPECTED_DEFAULT_STREAM_LISTEN: ${{ matrix.ip_family == 'ipv6' && '[::]:8899 ssl reuseport' || '0.0.0.0:8899 ssl reuseport' }}
        GW_ADMIN_LICENSE_FILE: ${{ steps.gwadmin-license.outputs.license-file }}
      run: |
        # Use CHAINSAW_TEST_DIR to target the specific test directory
        make test.e2e.chainsaw

    - name: Remove GWAdmin license and signing files
      if: ${{ always() && (matrix.suite == 'gwadmin' || matrix.suite == 'onpremeventgateway' || matrix.suite == 'eventgateway-cross-namespace-onprem') }}
      run: bash .github/actions/gwadmin-license/issue-license.sh cleanup

    - name: Dump cluster diagnostics on failure or cancellation
      # Keyed on the job, not on the chainsaw step alone: a failure that comes
      # earlier (cluster setup, operator deploy, suite prerequisites) needs the
      # same dump, and it used to run only because a skipped step is "not
      # success".
      if: ${{ failure() || cancelled() }}
      env:
        # The ipv6 entry of a suite shares matrix.suite with the ipv4 entry.
        # Append the family so the two entries keep separate snapshot
        # directories under /tmp/chainsaw.
        SUITE: ${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}
      run: |
        # Chainsaw catch blocks never run when the job is cancelled (e.g. by the
        # job timeout), so /tmp/chainsaw stays empty and the upload below is a
        # no-op. Dump cluster state and operator logs at the workflow level too.
        # We don't know which test namespace was active on cancellation, so
        # capture every non-system, non-infra namespace plus the operator
        # namespace. The runner only allows ~5 minutes of post-cancellation
        # steps before killing them, so keep this dump fast: skip the slow
        # resource-counting summary and infra namespaces we don't debug.
        # `timeout 4m` caps the whole dump: the upload step below must start
        # inside the runner's post-cancellation grace window.
        NAMESPACES=$(kubectl get namespaces -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | grep -vE '^(kube-(system|node-lease|public)|cert-manager|metallb-system|local-path-storage)$' | tr '\n' ' ')
        TEST_NAME="${SUITE}" \
        NAMESPACE="$(echo "${NAMESPACES}" | awk '{print $1}')" \
        ADDITIONAL_NAMESPACES="$(echo "${NAMESPACES}" | awk '{$1=""; print}' | tr -s ' ' ',' | sed 's/^,//')" \
        SKIP_RESOURCE_COUNTS=1 \
        timeout 4m bash test/e2e/chainsaw/common/scripts/debug_snapshot.sh || true

    - name: Print debug snapshot to the job log
      # Reading the job log takes less time than downloading the artifact, so
      # print the two files that triage starts with. The artifact below keeps
      # the rest.
      if: ${{ failure() || cancelled() }}
      env:
        SUITE: ${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}
      run: |
        for f in summary.txt events.txt; do
          echo "::group::${f}"
          tail -n 150 "/tmp/chainsaw/${SUITE}/${f}" 2>/dev/null || echo "(no ${f})"
          echo "::endgroup::"
        done

    - name: Upload debug snapshots as artifacts
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chainsaw-debug-snapshots-${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}-${{ github.run_id }}
        path: /tmp/chainsaw/
        if-no-files-found: ignore
        retention-days: 3

    - name: Clean up debug snapshots
      if: ${{ failure() || cancelled() }}
      env:
        SUITE: ${{ matrix.suite }}${{ matrix.ip_family && format('-{0}', matrix.ip_family) || '' }}
      run: rm -rf "/tmp/chainsaw/$SUITE"

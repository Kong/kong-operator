# The trust bundle the data planes verify the cp listener of the GWAdmin with
# holds bundle_size certificate authorities.
apiVersion: v1
kind: Secret
metadata:
  name: (join('-', [$gwadmin_name, 'cp-server-ca-bundle']))
data:
  (length(split(base64_decode("ca.crt"), '-----BEGIN CERTIFICATE-----')) - `1`): ($bundle_size)

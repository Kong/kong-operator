# SAME name as the staging Gateway, different namespace, also statically named. Before the fix
# in https://github.com/Kong/kong-operator/issues/4079 both asked Konnect for "edge-gw" and
# this second create failed with HTTP 409.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ($gateway_name)
  namespace: ($production_namespace)
  annotations:
    gateway-operator.konghq.com/static-naming: "true"
spec:
  gatewayClassName: (join('-', [($test_name), 'production-gateway-class']))
  listeners:
    - name: http
      protocol: HTTP
      port: ($listener_http_port)

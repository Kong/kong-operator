name: E2E Chainsaw tests

on:
  workflow_call:
    inputs:
      node_image_version:
        description: "Kind node image version"
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_VERBOSE: 1
  MISE_DEBUG: 1

jobs:
  e2e-tests-chainsaw:
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || 30) }}
    runs-on: ubuntu-latest
    name: ${{ format('{0} {1} - {2}', matrix.suite, matrix.ip_family, inputs.node_image_version) }}
    env:
      IMG: kong-operator
      TAG: e2e-${{ github.sha }}
      CLUSTER_NAME: e2e-chainsaw
      TEST_ID: ${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - suite: gateway
        - suite: gateway
          ip_family: ipv6
        - suite: hybridgateway
        - suite: hybridgateway
          ip_family: ipv6
        - suite: konnect
        - suite: aigateway
        - suite: eventgateway
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download e2e image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: kong-operator-e2e-image-${{ github.run_id }}

    - name: load docker image
      run: docker load -i kong-operator_e2e.tar

    - uses: ./.github/actions/setup-mise
      with:
        install_args: github:Kong/kubernetes-testing-framework aqua:helm/helm kind

    - uses: Kong/kong-license@ddccb487a0b319cef85f348b16a1ad2b6d9c1df7 # master @ 20260529
      id: license
      with:
        op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    - uses: ./.github/actions/bump-inotify

    - name: Create k8s KinD Cluster with ktf
      env:
        # NOTE: add GITHUB_TOKEN to env to allow ktf to query GitHub API without
        # hitting unauthenticated rate limits.
        # This token is being used e.g. in here:
        # https://github.com/Kong/kubernetes-testing-framework/blob/f233236e89ebcaf79575c5084053e4196c037165/pkg/utils/github/release.go#L46
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_IMAGE_VERSION: ${{ inputs.node_image_version }}
        IP_FAMILY: ${{ matrix.ip_family }}
      run: |
        IPV6_FLAG=()
        if [ "$IP_FAMILY" = "ipv6" ]; then
          IPV6_FLAG=(--ipv6-only)
        fi
        ktf environments create \
          --name "$CLUSTER_NAME" \
          --addon metallb \
          --addon cert-manager \
          --kubernetes-version "$NODE_IMAGE_VERSION" \
          "${IPV6_FLAG[@]}"

    # IPv6-only kind clusters have no route to IPv4-only/legacy external
    # services (e.g. Konnect's API): the pod network can't reach the real
    # internet on its own. NAT64 (Jool) translates that egress traffic onto
    # this host's real IPv4 uplink, and DNS64 (unbound) synthesizes AAAA
    # answers for hostnames that only have an A record, so pods route
    # through the NAT64 prefix automatically. Validated in a standalone
    # prototype: see issue-5349 / scratch-nat64-prototype.yaml history.
    - name: Set up NAT64 + DNS64 for IPv6-only cluster external reachability
      if: ${{ matrix.ip_family == 'ipv6' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y jool-dkms jool-tools unbound
        sudo modprobe jool

        sudo sysctl -w net.ipv4.ip_forward=1
        sudo sysctl -w net.ipv6.conf.all.forwarding=1
        sudo sysctl -w net.ipv6.conf.default.forwarding=1

        RUNNER_IP4=$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | head -1)
        sudo jool instance add nat64 --netfilter --pool6 64:ff9b::/96
        sudo jool -i nat64 pool4 add --tcp "${RUNNER_IP4}" 61001-65535
        sudo jool -i nat64 pool4 add --udp "${RUNNER_IP4}" 61001-65535
        sudo jool -i nat64 pool4 add --icmp "${RUNNER_IP4}" 61001-65535

        # This host needs a route for the NAT64 prefix to accept forwarding
        # it at all. It has no real IPv6 default route, so an on-link route
        # (no gateway) makes the kernel try to NDP-resolve the fake NAT64
        # destination itself, which just times out. A permanent, never-
        # verified fake neighbor gives the kernel a resolved next hop
        # without that - Jool intercepts and re-injects as IPv4 long before
        # any real L2 delivery to that (nonexistent) neighbor is attempted.
        PRIMARY_IF=$(ip -6 route show default | awk '{print $5; exit}')
        PRIMARY_IF="${PRIMARY_IF:-eth0}"
        sudo ip -6 neigh add fe80::64 lladdr 00:00:00:00:00:64 dev "${PRIMARY_IF}" nud permanent
        sudo ip -6 route add 64:ff9b::/96 via fe80::64 dev "${PRIMARY_IF}"

        # DNS64 has to run on this host, not as a cluster pod: it needs to
        # be reachable via IPv6 from the pod network AND do real IPv4 DNS
        # lookups itself, which an IPv6-only CoreDNS pod can't do.
        GW=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Subnet | contains(":")) | .Gateway')
        if [ -z "$GW" ] || [ "$GW" = "null" ]; then
          SUBNET=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Subnet | contains(":")) | .Subnet')
          GW=$(python3 -c "import ipaddress; print(ipaddress.ip_interface('$SUBNET').network.network_address + 1)")
        fi
        echo "kind bridge IPv6 gateway (this host): $GW"

        sudo tee /etc/unbound/unbound.conf.d/dns64.conf >/dev/null <<EOF
        server:
          interface: ${GW}
          interface: 127.0.0.1
          access-control: ::0/0 allow
          access-control: 0.0.0.0/0 allow
          do-ip4: yes
          do-ip6: yes
          module-config: "dns64 validator iterator"
          dns64-prefix: 64:ff9b::/96
        EOF
        sudo systemctl restart unbound

        NEW_COREFILE=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' \
          | sed "s#forward \. /etc/resolv.conf#forward . ${GW}#")
        kubectl -n kube-system get configmap coredns -o json \
          | jq --arg cf "$NEW_COREFILE" '.data.Corefile = $cf' \
          | kubectl apply -f -
        kubectl -n kube-system rollout restart deployment coredns
        kubectl -n kube-system rollout status deployment coredns --timeout=60s

    - name: Load image to kind cluster
      run: kind load docker-image "$IMG:$TAG" --name "$CLUSTER_NAME"

    - name: Deploy operator with Helm
      run: |
        helm install kong-operator charts/kong-operator \
          --namespace kong-system \
          --create-namespace \
          --set image.repository="$IMG" \
          --set image.tag="$TAG" \
          --set env.enable_controller_konnect=true \
          --set env.enable_controller_kegdataplane=true \
          --set env.enable_controller_aigatewaydataplane=true \
          --wait

    - name: DNS lookup for us.control-plane.konghq.tech
      run: dig us.control-plane.konghq.tech

    - name: Apply chainsaw suite prerequisites
      env:
        SUITE: ${{ matrix.suite }}
        KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}
      run: make test.e2e.chainsaw.prereq DIRNAME="$SUITE"

    - name: run chainsaw e2e tests
      id: chainsaw-tests
      env:
        KONNECT_TOKEN: ${{ secrets.KONG_TEST_KONNECT_ACCESS_TOKEN }}
        KONNECT_SERVER_URL: us.api.konghq.tech
        TEST_ID: ${{ env.TEST_ID }}
        CHAINSAW_TEST_DIR: test/e2e/chainsaw/${{ matrix.suite }}
        CHAINSAW_CONFIG: test/e2e/chainsaw/.chainsaw.yaml
      run: |
        # Use CHAINSAW_TEST_DIR to target the specific test directory
        make test.e2e.chainsaw

    - name: Upload debug snapshots as artifacts
      if: always() && steps.chainsaw-tests.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chainsaw-debug-snapshots-${{ matrix.suite }}-${{ matrix.ip_family }}-${{ github.run_id }}
        path: /tmp/chainsaw/
        if-no-files-found: ignore
        retention-days: 3

    - name: Clean up debug snapshots
      if: always() && steps.chainsaw-tests.outcome == 'failure'
      env:
        SUITE: ${{ matrix.suite }}
      run: rm -rf "/tmp/chainsaw/$SUITE"

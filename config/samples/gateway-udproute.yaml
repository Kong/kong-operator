# UDPRoute: plain L4 UDP proxying. The UDP listener makes the operator program
# Kong's stream listen and expose the port on the DataPlane's ingress Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udpecho
  labels:
    app: udpecho
spec:
  selector:
    matchLabels:
      app: udpecho
  template:
    metadata:
      labels:
        app: udpecho
    spec:
      containers:
      - name: udpecho
        image: kong/go-echo:0.5.0
        ports:
        - containerPort: 1026
        env:
        - name: POD_NAME
          value: udproute-example-manifest
---
apiVersion: v1
kind: Service
metadata:
  name: udpecho
spec:
  ports:
  - port: 9999
    protocol: UDP
    targetPort: 1026
  selector:
    app: udpecho
  type: ClusterIP
---
apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: example-udproute
  namespace: default
spec:
  dataPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
          - name: proxy
            # renovate: datasource=docker versioning=docker
            image: kong/kong-gateway:3.16
            readinessProbe:
              initialDelaySeconds: 1
              periodSeconds: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-udproute
spec:
  controllerName: konghq.com/gateway-operator
  parametersRef:
    group: gateway-operator.konghq.com
    kind: GatewayConfiguration
    name: example-udproute
    namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-udproute
spec:
  gatewayClassName: example-udproute
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: udp
    protocol: UDP
    port: 9999
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: udpecho
spec:
  parentRefs:
  - name: example-udproute
    sectionName: udp
  rules:
  - backendRefs:
    - name: udpecho
      port: 9999

# Template for verifying the labels of the Konnect entity behind a CR: the
# operator's Kubernetes metadata labels (k8s-uid matching the CR's UID,
# managed-by, k8s-kind, k8s-name, k8s-namespace) and the user's "team" label.
# The CR's spec may also set k8s-uid / managed-by: the operator's values must
# win (Konnect never gets the user's values for those keys).
#
# Required bindings:
#   - cr_resource: Resource type of the CR, e.g. aigatewayconsumers.aiconfiguration.konghq.com.
#   - cr_kind: Kind of the CR, e.g. AIGatewayConsumer.
#   - cr_name: Name of the CR.
#   - collection_path_jq: jq expression, evaluated against the CR, yielding the
#     Konnect API path of the entity collection (see konnect_entity_of_resource.sh).
#   - user_label_value: Expected value of the "team" label set in the CR's spec.
#   - konnect_token: Konnect API token.
#   - konnect_url: Konnect API host, e.g. eu.api.konghq.tech.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: konnect-ownership-assert-labels
spec:
  try:
    - script:
        env:
          - name: RESOURCE_TYPE
            value: ($cr_resource)
          - name: RESOURCE_NAME
            value: ($cr_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: COLLECTION_PATH_JQ
            value: ($collection_path_jq)
        content: |
          bash ../../common/scripts/konnect_entity_of_resource.sh
        outputs:
          - name: entity
            value: (json_parse($stdout))
    - script:
        env:
          - name: KONNECT_TOKEN
            value: ($konnect_token)
          - name: KONNECT_URL
            value: ($konnect_url)
          - name: API_PATH
            value: ($entity.entity_path)
          - name: WANT_ID
            value: ($entity.id)
          - name: WANT_UID
            value: ($entity.uid)
          - name: WANT_KIND
            value: ($cr_kind)
          - name: WANT_NAME
            value: ($cr_name)
          - name: WANT_NAMESPACE
            value: ($namespace)
          - name: WANT_TEAM
            value: ($user_label_value)
          - name: EXPECTED_JQ
            value: >-
              .id == $ENV.WANT_ID
              and .labels["k8s-uid"] == $ENV.WANT_UID
              and .labels["managed-by"] == "kong-operator"
              and .labels["k8s-kind"] == $ENV.WANT_KIND
              and .labels["k8s-name"] == $ENV.WANT_NAME
              and .labels["k8s-namespace"] == $ENV.WANT_NAMESPACE
              and .labels.team == $ENV.WANT_TEAM
        content: |
          bash ../../common/scripts/konnect_api_request.sh

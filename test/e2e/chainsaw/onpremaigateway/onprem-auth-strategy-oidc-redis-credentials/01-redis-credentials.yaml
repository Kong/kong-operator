# Two openid-connect AIGatewayAuthStrategies whose Redis and Sentinel
# passwords come from a Secret (issue #6003). No traffic is driven: the
# assertion is that the operator resolves the secretRefs and that the data
# plane accepts the resulting document, which carries plain strings. An
# unresolved SensitiveDataSource would reach the data plane as an object and
# the config push would leave the entities Programmed=False.
apiVersion: v1
kind: Secret
metadata:
  name: ($redis_credentials_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  redisPassword: ($redis_password_value)
  sentinelPassword: ($sentinel_password_value)
---
# Single-node Redis configuration: covers redis.password and
# redis.sentinelPassword.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayAuthStrategy
metadata:
  name: ($redis_auth_strategy_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: openid-connect
    openid-connect:
      name: ($redis_auth_strategy_name)
      displayName: ($redis_auth_strategy_name)
      config:
        issuer: ($oidc_issuer)
        cacheTokensSalt: (join('-', [($test_name), 'redis-cache-salt']))
        clientID:
          - redis-test-client
        clientSecret:
          - type: inline
            value: redis-test-client-secret
        redis:
          username: default
          password:
            type: secretRef
            secretRef:
              name: ($redis_credentials_name)
              key: redisPassword
          sentinelPassword:
            type: secretRef
            secretRef:
              name: ($redis_credentials_name)
              key: sentinelPassword
          sentinelMaster: mymaster
          sentinelRole: master
          sentinelNodes:
            - host: sentinel.example.com
              port: 26379
---
# Cluster cache configuration: covers clusterCacheRedis.password and
# clusterCacheRedis.sentinelPassword.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayAuthStrategy
metadata:
  name: ($cluster_redis_auth_strategy_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: openid-connect
    openid-connect:
      name: ($cluster_redis_auth_strategy_name)
      displayName: ($cluster_redis_auth_strategy_name)
      config:
        issuer: ($oidc_issuer)
        cacheTokensSalt: (join('-', [($test_name), 'cluster-redis-cache-salt']))
        clientID:
          - cluster-redis-test-client
        clientSecret:
          - type: inline
            value: cluster-redis-test-client-secret
        clusterCacheRedis:
          username: default
          password:
            type: secretRef
            secretRef:
              name: ($redis_credentials_name)
              key: redisPassword
          sentinelPassword:
            type: secretRef
            secretRef:
              name: ($redis_credentials_name)
              key: sentinelPassword
          sentinelMaster: mymaster
          sentinelRole: master
          sentinelNodes:
            - host: sentinel.example.com
              port: 26379

name: CRD validation tests

on:
  workflow_call:
    inputs:
      cluster_versions:
        description: "The Kubernetes cluster versions to use for envtest"
        type: string
        required: true

permissions:
  contents: read

env:
  MISE_VERBOSE: 1
  MISE_DEBUG: 1

jobs:
  crd-validation-tests:
    # NOTE: This job can take longer than the default timeout so we bump it to 15 minutes.
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || 15) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.crd_validation_test.name }} - ${{ matrix.cluster_version }}
    strategy:
      fail-fast: false
      matrix:
        cluster_version: ${{ fromJson(inputs.cluster_versions) }}
        crd_validation_test:
        - name: configuration.konghq.com
          paths:
          - ./test/crdsvalidation/configuration.konghq.com/...
        - name: rest
          paths:
          - ./test/crdsvalidation
          - ./test/crdsvalidation/gateway-operator.konghq.com/...
          - ./test/crdsvalidation/aiconfiguration.konghq.com/...
          - ./test/crdsvalidation/aigateway.konghq.com/...
          - ./test/crdsvalidation/eventgateway.konghq.com/...
          - ./test/crdsvalidation/konnect.konghq.com/...
          - ./test/crdsvalidation/mcp.konghq.com/...
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - run: echo "GO_MOD_CACHE=$(go env GOMODCACHE)" >> $GITHUB_ENV
    - run: echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> $GITHUB_ENV

    - uses: ./.github/actions/setup-mise
      with:
        install: false

    - name: Compute Go build cache key
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        GO_MOD_HASH: ${{ hashFiles('**/go.mod') }}
      run: |
        echo "GO_CACHE_KEY=go-crdsvalidationtests-$RUNNER_OS-$RUNNER_ARCH-go-$GO_MOD_HASH" >> $GITHUB_ENV
        echo "GO_CACHE_KEY_2=go-crdsvalidationtests-$RUNNER_OS-$RUNNER_ARCH-go-" >> $GITHUB_ENV

    - name: Go cache main branch
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ env.GO_MOD_CACHE }}
          ${{ env.GO_BUILD_CACHE }}
        key: ${{ env.GO_CACHE_KEY }}
        restore-keys: |
          ${{ env.GO_CACHE_KEY }}
          ${{ env.GO_CACHE_KEY_2 }}

    - name: Go cache (restore only for non-main branches)
      if: ${{ github.ref != 'refs/heads/main' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ env.GO_MOD_CACHE }}
          ${{ env.GO_BUILD_CACHE }}
        key: ${{ env.GO_CACHE_KEY }}
        restore-keys: |
          ${{ env.GO_CACHE_KEY }}
          ${{ env.GO_CACHE_KEY_2 }}

    - name: Run the crds validation tests
      env:
        GO_TEST_PARALLEL: 2
        CLUSTER_VERSION: ${{ matrix.cluster_version }}
        CRDS_VALIDATION_TEST_PATHS: ${{ join(matrix.crd_validation_test.paths, ' ') }}
      run: |
        VERSION="$CLUSTER_VERSION"
        # Remove leading 'v'
        VERSION="${VERSION#v}"
        # Remove patch number as envtest releases are not provided for every patch version
        VERSION="${VERSION%.*}"
        echo "Cluster version: $VERSION"
        make test.crds-validation \
          CLUSTER_VERSION="${VERSION}" \
          CRDS_VALIDATION_TEST_PATHS="${CRDS_VALIDATION_TEST_PATHS}"

    - name: Run the API tests
      if: ${{ matrix.crd_validation_test.name == 'rest' }}
      run: make test.api

# Entities taking the values of those sent: the name of the backend cluster,
# the DNS label of the virtual cluster, and the name of the consume policy,
# for a listener policy.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayBackendCluster
metadata:
  name: backend-duplicate
spec:
  parentRef:
    group: eventgateway.konghq.com
    kind: OnPremEventGateway
    name: ($gateway_name)
  apiSpec:
    name: backend
    bootstrapServers:
      - kafka-bootstrap.kafka-shared.svc:9092
    authentication:
      type: anonymous
      anonymous: {}
    insecureAllowAnonymousVirtualClusterAuth: Enabled
    tls:
      enabled: Disabled
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualCluster
metadata:
  name: vcluster-duplicate
spec:
  eventGatewayBackendClusterRef:
    type: namespacedRef
    namespacedRef:
      name: backend
  apiSpec:
    name: vcluster-duplicate
    dnsLabel: vcluster
    aclMode: passthrough
    authentication:
      - type: anonymous
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayListenerPolicy
metadata:
  name: forward-duplicate
spec:
  eventGatewayListenerRef:
    type: namespacedRef
    namespacedRef:
      name: listener
  apiSpec:
    type: forwardToVirtualCluster
    forwardToVirtualCluster:
      name: headers
      config:
        type: portMapping
        portMapping:
          advertisedHost: localhost
          destination:
            name: vcluster

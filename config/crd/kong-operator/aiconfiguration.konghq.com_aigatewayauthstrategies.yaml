                      it to aigateway.konghq.com explicitly.
                    enum:
                    - konnect.konghq.com
                    - aigateway.konghq.com
                    type: string
                  kind:
                    default: KonnectAIGateway
                    description: |-
                      Kind is the kind of the referenced AI Gateway (control plane):
                      KonnectAIGateway (default) or OnPremAIGateway.
                    enum:
                    - KonnectAIGateway
                    - OnPremAIGateway
                    type: string
                  namespacedRef:
                    description: |-
                      NamespacedRef references the AI Gateway (control plane) by namespaced
                      name. When Namespace is unset, the namespace of the referencing entity
                      is used.
                    properties:
                      name:
                        description: Name is the name of the referred resource.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:

# Every running gw-admin pod of the revision carries the user's overlay next
# to the TLS material Kong Operator mounts.
apiVersion: v1
kind: Pod
metadata:
  labels:
    gateway-operator.konghq.com/managed-by: gw-admin
    gateway-operator.konghq.com/managed-by-name: ($gwadmin_name)
    e2e.konghq.com/label: kept
  annotations:
    e2e.konghq.com/revision: ($revision)
spec:
  (volumes[?name == 'extra']):
    - emptyDir: {}
  (length(volumes[?name == 'cp-tls'])): 1
  (length(volumes[?name == 'api-tls'])): 1
  (containers[?name == 'gw-admin']):
    - (env[?name == 'E2E_MARK']):
        - value: kept
      (length(env[?name == 'GW_ADMIN_ONPREM_CP_TLS_CLIENT_CA_FILE'])): 1
      (volumeMounts[?name == 'extra']):
        - mountPath: /extra
      (length(volumeMounts[?name == 'cp-tls'])): 1
      (length(volumeMounts[?name == 'api-tls'])): 1
status:
  phase: Running
  (conditions[?type == 'Ready']):
    - status: "True"

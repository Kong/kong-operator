# This job is not intended to be run manually. Instead it assumes that proper
# release commit is pushed to the repository. It will then create a new release
# on GitHub.
name: release-bot

on:
  push:
    branches:
      - "main"
      - "release/*"

permissions:
  contents: read

jobs:
  look_for_release:
    # NOTE: create-release-branch (below) pushes the release branch with the App
    # token, and that push re-enters this workflow on the new branch. Without
    # skipping it, it matches the same release commit again and the run fails in
    # semver ("fail if tag already exists" - the tag was created by publish-release
    # moments before; publish-release is skipped here because it needs semver). The
    # echo is detected in commit_parser against the App's own login, since a ref
    # pushed by an App token reports github.actor as "<app-slug>[bot]". Gated on the
    # actor too (not just `created`) so a manually created release/X.Y.x branch whose
    # tip already carries a real release commit is not silently skipped.
    outputs:
      release_found: ${{ steps.commit_parser.outputs.release_found }}
      release_type: ${{ steps.commit_parser.outputs.release_type }}
      release_latest: ${{ steps.commit_parser.outputs.release_latest }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ github.event.created }}
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: search for release command in commit message
        id: commit_parser
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          script: |
            // Skip the echo push of the release branch that create-release-branch
            // makes below: it carries the same release commit, and matching it again
            // fails the run in semver, where the tag created by publish-release
            // already exists.
            if (context.payload.created && process.env.APP_SLUG
                && context.actor === `${process.env.APP_SLUG}[bot]`) {
              core.setOutput('release_found', 'false')
              return
            }

            const commitMessage = context.payload.head_commit.message
            if (commitMessage.includes('chore(release): [bot]')) {
              core.setOutput('release_found', 'true')
              core.setOutput('release_type', 'release')
              if (commitMessage.includes('[latest]')) {
                core.setOutput('release_latest', 'true')
              }
            } else if (commitMessage.includes('chore(prerelease): [bot]')) {
              core.setOutput('release_found', 'true')
              core.setOutput('release_type', 'prerelease')
              if (commitMessage.includes('[latest]')) {
                core.setOutput('release_latest', 'true')
              }
            } else {
              core.setOutput('release_found', 'false')
            }

  semver:
    needs:
      - look_for_release
    if: ${{ needs.look_for_release.outputs.release_found == 'true' }}
    outputs:
      version: ${{ steps.semver_parser.outputs.fullversion }}
      major: ${{ steps.semver_parser.outputs.major }}
      minor: ${{ steps.semver_parser.outputs.minor }}
      patch: ${{ steps.semver_parser.outputs.patch }}
      prerelease: ${{ steps.semver_parser.outputs.prerelease }}
      release_branch: ${{ steps.release_branch.outputs.release_branch }}
      # NOTE: true for patches of a rapid release (e.g. 2.4.0-rapid.1.1), released
      # from release/N.M.0-rapid.K.x.
      rapid_patch: ${{ steps.release_branch.outputs.rapid_patch }}
      changelog_anchor: ${{ steps.release_branch.outputs.changelog_anchor }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version from VERSION file
        run: |
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@7784200024d6b3fc01253e617ec0168daf603de3 # v1.4.7
        with:
          input_string: ${{ env.VERSION }}
          version_extractor_regex: "(.*)$"

      - name: Determine the release branch, rapid patch flag and changelog anchor
        id: release_branch
        env:
          VERSION: ${{ steps.semver_parser.outputs.fullversion }}
          MAJOR: ${{ steps.semver_parser.outputs.major }}
          MINOR: ${{ steps.semver_parser.outputs.minor }}
          PATCH: ${{ steps.semver_parser.outputs.patch }}
          PRERELEASE: ${{ steps.semver_parser.outputs.prerelease }}
        run: |
          RELEASE_BRANCH=""
          if [[ "$PATCH" == "0" && -z "$PRERELEASE" ]]; then
            RELEASE_BRANCH="release/${MAJOR}.${MINOR}.x"
          elif [[ "$PATCH" == "0" && "$PRERELEASE" =~ ^rapid\.[0-9]+$ ]]; then
            RELEASE_BRANCH="release/${MAJOR}.${MINOR}.0-${PRERELEASE}.x"
          fi
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"

          RAPID_PATCH=false
          if [[ "$PATCH" == "0" && "$PRERELEASE" =~ ^rapid\.[0-9]+\.[0-9]+$ ]]; then
            RAPID_PATCH=true
          fi
          echo "rapid_patch=${RAPID_PATCH}" >> "$GITHUB_OUTPUT"

          # CHANGELOG.md heading anchors drop the dots: 2.4.0-rapid.1.1 -> v240-rapid11.
          echo "changelog_anchor=v${VERSION//./}" >> "$GITHUB_OUTPUT"

      - name: check if tag already exists
        uses: mukunku/tag-exists-action@5c39604fe8aef7e65acb6fbcf96ec580f7680313 # v1.7.0
        id: tag_exists
        with:
          tag: ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: fail if tag already exists
        if: ${{ steps.tag_exists.outputs.exists == 'true' }}
        run: exit 1

  publish-release:
    permissions:
      contents: write
    needs:
      - look_for_release
      - semver
    if: ${{ needs.look_for_release.outputs.release_found == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source SBOM
        # Blocking: the SBOMs are deliverables.
        uses: Kong/public-shared-actions/security-actions/sca@5d8835e25221a4aa16e7a53ab6e97c7fb2528b7e # sca@6.0.3
        with:
          dir: '.'
          asset_prefix: source

      - uses: ./.github/actions/setup-mise
        with:
          # The backend prefix is required: a plain `syft` would not match the pinned entry.
          install_args: github:anchore/syft

      # syft and `imagetools inspect` read ~/.docker/config.json; anonymous Docker Hub pulls are
      # rate limited, and this job is blocking. Pull-scoped on purpose: no push rights here.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_PULL_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN_KO }}

      # Subject is the index digest the tag resolves to, never the tag. Each file is per-platform,
      # selected by `--platform`. Blocking: this job publishes the release, so a missing image
      # SBOM must stop it rather than produce a release with an incomplete artifact set.
      - name: Generate image SBOM
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME_KO }}
          VERSION: ${{ needs.semver.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "docker.io/${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "resolved docker.io/${IMAGE_NAME}:${VERSION} to ${DIGEST}"

          for arch in amd64 arm64; do
            syft "registry:docker.io/${IMAGE_NAME}@${DIGEST}" \
              --platform "linux/${arch}" \
              -o "spdx-json=image-linux-${arch}-sbom.spdx.json" \
              -o "cyclonedx-json=image-linux-${arch}-sbom.cyclonedx.json"
          done

      # The scans above are blocking, so an empty set here means a missing deliverable: refuse to
      # publish a release without SBOMs instead of shipping a partial artifact list.
      - name: Generate SBOM checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *-sbom.*.json )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no SBOM files were produced; refusing to publish the release without SBOMs"
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          body: |
            #### Download Kong Operator ${{ needs.semver.outputs.version }}:

            - [Docker Image](https://hub.docker.com/r/${{ vars.DOCKERHUB_IMAGE_NAME_KO }}/tags?name=${{ needs.semver.outputs.version }})
            - [Get started](https://github.com/kong/kong-operator/blob/main/README.md)

            #### Links:

            - [Changelog](https://github.com/kong/kong-operator/blob/main/CHANGELOG.md#${{ needs.semver.outputs.changelog_anchor }})

          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.semver.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ needs.look_for_release.outputs.release_type == 'prerelease' }}
          # Without this, ncipollo/release-action defaults to makeLatest: legacy, which
          # makes GitHub mark whichever release was *created* most recently as "latest" -
          # regardless of version order. This breaks patch releases from older release
          # branches (e.g. 2.0.11 after 2.2.3). Only mark latest when the release commit
          # was explicitly tagged with [latest].
          makeLatest: ${{ needs.look_for_release.outputs.release_latest == 'true' && needs.look_for_release.outputs.release_type == 'release' }}
          artifacts: |-
            source-sbom.spdx.json
            source-sbom.cyclonedx.json
            image-linux-amd64-sbom.spdx.json
            image-linux-amd64-sbom.cyclonedx.json
            image-linux-arm64-sbom.spdx.json
            image-linux-arm64-sbom.cyclonedx.json
            SHA256SUMS

  create-release-branch:
    permissions:
      contents: read
    needs:
      - look_for_release
      - publish-release
      - semver
    # NOTE: only create a release branch for releases the semver job maps to
    # one: stable N.M.0 -> release/N.M.x, rapid N.M.0-rapid.K ->
    # release/N.M.0-rapid.K.x. Patch releases already have their branch;
    # other prereleases get none.
    if: ${{ needs.look_for_release.outputs.release_found == 'true' && needs.semver.outputs.release_branch != '' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ needs.semver.outputs.release_branch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
      - uses: peterjgrainger/action-create-branch@4b81ce657e255acd677cc6c55c9c763654be3aef # v4.0.0
        env:
          # NOTE: the release-branches ruleset gates refs/heads/release/* with a
          # `creation` rule, and secrets.GITHUB_TOKEN (github-actions[bot]) is not a
          # bypass actor on it, so creating the ref with it is rejected
          # ("Reference update failed"). Use an identity that the ruleset lists as a
          # bypass actor: the Kong k8s App.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # NOTE: using the full ref name because
          # https://github.com/peterjgrainger/action-create-branch?tab=readme-ov-file#branch
          branch: "refs/heads/${{ env.RELEASE_BRANCH }}"
          sha: "${{ github.sha }}"

      # NOTE: charts-sync.yaml tracks a single branch: the most recently created
      # release branch (release/N.M.x or release/N.M.0-rapid.K.x).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          CHARTS_SYNC_WORKFLOW_PATH: .github/workflows/charts-sync.yaml
        run: |
          git config --global user.name "Kong's Team k8s bot"
          git config --global user.email "team-k8s+github-bot@konghq.com"
          yq eval '.on.push.branches = [ strenv(RELEASE_BRANCH) ]' -i "$CHARTS_SYNC_WORKFLOW_PATH"
          git add "$CHARTS_SYNC_WORKFLOW_PATH"
          git commit -m "chore: update charts sync workflow to trigger on $RELEASE_BRANCH branch"
          # e.g. release/2.4.x -> chore/charts-sync-2.4.x
          echo "CHARTS_SYNC_PR_BRANCH=chore/charts-sync-${RELEASE_BRANCH#release/}" >> "$GITHUB_ENV"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # NOTE: use a dedicated head branch, not RELEASE_BRANCH itself - with
          # delete-branch: true, merging this PR would otherwise delete the
          # freshly created release branch. Use the App token, not GITHUB_TOKEN:
          # GITHUB_TOKEN-authored PRs don't trigger pull_request-triggered
          # required checks, so this PR could never merge. The App additionally
          # needs the `workflows` permission, because this PR edits a workflow.
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.CHARTS_SYNC_PR_BRANCH }}
          base: main
          delete-branch: true
          title: "chore: update charts sync workflow to trigger on ${{ env.RELEASE_BRANCH }} branch"
          body: |
            ### Why is this PR needed?

            This PR updates the charts sync workflow to trigger on commit push events to the new release branch `${{ env.RELEASE_BRANCH }}`.

            This allows development to happen on `main` branch while the release branch is used to sync with the charts repository and publish patch releases if needed.

  create-cherry-pick-branch-to-main:
    permissions:
      contents: read
    needs:
      - look_for_release
      - publish-release
      - semver
    # NOTE: patch releases (N.M.P with P != 0) and patches of rapid releases
    # (e.g. 2.4.0-rapid.1.1) are cherry-picked back to main.
    if: ${{ needs.look_for_release.outputs.release_found == 'true' && ((needs.semver.outputs.patch != '0' && needs.semver.outputs.prerelease == '') || needs.semver.outputs.rapid_patch == 'true') && needs.look_for_release.outputs.release_latest == 'true' && github.ref_name != 'main' }}
    env:
      CHERRYPICK_BRANCH: cherry-pick/${{ github.sha }}-to-main
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --global user.name "Kong's Team k8s bot"
          git config --global user.email "team-k8s+github-bot@konghq.com"

      - name: Cherry-pick commit
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.semver.outputs.version }}
        run: |
          git fetch --all
          git checkout -b "$CHERRYPICK_BRANCH" origin/main
          git cherry-pick "$SHA"
          # Amend the commit message to avoid infinite loop of this workflow (it's triggered by the commit message).
          git commit --amend -m "chore: cherry-pick $VERSION commit ($SHA) onto main"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # NOTE: use the App token, not GITHUB_TOKEN - a GITHUB_TOKEN-authored PR
          # doesn't trigger pull_request-triggered required checks, so it could
          # never merge into main.
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.CHERRYPICK_BRANCH }}
          base: main
          delete-branch: true
          title: "[cherry-pick] ${{ needs.semver.outputs.version }} - ${{ github.sha }}"
          body: "Cherry picking ${{ needs.semver.outputs.version }} commit (${{ github.sha }}) onto main"

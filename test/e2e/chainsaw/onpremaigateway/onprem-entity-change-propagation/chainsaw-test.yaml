apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-entity-change-propagation
spec:
  description: |
    Entity change propagation on the on-prem AI Gateway flow: configuration
    entity changes must re-render and re-push to the data planes, and
    deletions must retract the configuration.

    1. OnPremAIGateway (Ready) + provider + model (route /chat) + data plane
       (onpremNamespacedRef, Ready); the model is Programmed.
    2. Baseline traffic on /chat succeeds.
    3. The model's route path is updated to /chat-v2: traffic moves to the
       new path and the old path stops being served — the re-rendered
       configuration replaced the pushed payload wholesale.
    4. The model is deleted: with the provider alone there is nothing
       routable, the control plane pushes an empty configuration, and the
       DB-less data plane reports not-ready (empty configuration).
    5. The model is recreated: it becomes Programmed again, the data plane
       returns to Ready, and traffic works again.

    The update's Programmed transition itself is deliberately not asserted:
    the entity's condition stays True until the re-push completes, making a
    False-window assertion timing-fragile. The traffic and readiness
    assertions are the observable proof of propagation.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: model_name
      value: (join('-', [($test_name), 'model']))
    - name: provider_name
      value: (join('-', [($test_name), 'provider']))
    - name: provider_credentials_name
      value: (join('-', [($provider_name), 'credentials']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-provider-and-model
      use:
        template: ../../common/_step_templates/apply-assert-onpremProviderAndModel.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-model-pushed-to-dataplane
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Drive-baseline-traffic
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Update-model-route-path
      try:
        - patch:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              spec:
                apiSpec:
                  model:
                    config:
                      route:
                        paths:
                          - /chat-v2
    - name: Drive-traffic-on-new-path
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /chat-v2
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Verify-old-path-no-longer-served
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              # The updated configuration replaced the pushed payload
              # wholesale, so the old route is gone: three consecutive
              # non-matches prove it is not a transient blip.
              - name: EXPECTED_SUCCESS
                value: "false"
              - name: REJECT_CONFIRMATIONS
                value: "3"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Delete-model
      try:
        - delete:
            ref:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              name: ($model_name)
              namespace: ($namespace)
    - name: Assert-dataplane-not-ready-on-empty-configuration
      try:
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'False'
    - name: Recreate-model
      try:
        - apply:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              spec:
                aiGatewayRef:
                  group: aigateway.konghq.com
                  kind: OnPremAIGateway
                  namespacedRef:
                    name: ($aigw_cp_name)
                apiSpec:
                  type: model
                  model:
                    name: ($model_name)
                    displayName: On-prem smoke-test model
                    enabled: Enabled
                    capabilities:
                      - generate
                    formats:
                      - type: openai
                    config:
                      model:
                        nameHeader: Enabled
                      route:
                        paths:
                          - /chat
                    targets:
                      - name: qwen2.5:0.5b
                        provider:
                          name: ($provider_name)
                        config:
                          type: openai
                          openai:
                            upstreamURL: http://kong-mock.kong-aigateway-mock.svc.cluster.local:8000/provider-a
    - name: Assert-model-pushed-again
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Assert-dataplane-ready-again
      try:
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (readyReplicas > `0`): true
    - name: Drive-traffic-again
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-entity-change-propagation
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

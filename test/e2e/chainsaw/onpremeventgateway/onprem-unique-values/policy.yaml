# A consume policy named policy_name, to tell a change is pushed.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterConsumePolicy
metadata:
  name: ($policy_name)
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: modifyHeaders
    modifyHeaders:
      name: ($policy_name)
      config:
        actions:
          - op: remove
            remove:
              key: x-removed

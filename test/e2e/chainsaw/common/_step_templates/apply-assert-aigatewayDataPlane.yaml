# Template for creating and asserting an AIGatewayDataPlane.
#
# The operator auto-provisions the mTLS client Secret and the
# AIGatewayDataPlaneCertificate; they are NOT created here.
#
# Required bindings:
#   - aigw_dp_name: Name of the AIGatewayDataPlane to create.
#   - aigw_cp_name: Name of the KonnectAIGateway it attaches to (same namespace).
#   - namespace: Namespace where the AIGatewayDataPlane will be created.
#   - aigw_dp_image: AI Gateway data plane container image. Overrides the operator
#     default. Must be pre-loaded into the cluster.
#
# Optional bindings (override with use.with.bindings; empty by default), each a
# list, e.g. "([{name: 'KONG_LOG_LEVEL', value: 'debug'}])":
#   - aigw_dp_env: Extra environment variables of the aigw container.
#   - aigw_dp_volumes: Pod volumes.
#   - aigw_dp_volume_mounts: Volume mounts of the aigw container.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-aigateway-dataplane
spec:
  bindings:
    - name: aigw_dp_env
      value: (`[]`)
    - name: aigw_dp_volumes
      value: (`[]`)
    - name: aigw_dp_volume_mounts
      value: (`[]`)
  try:
    - apply:
        resource:
          apiVersion: aigateway.konghq.com/v1alpha1
          kind: AIGatewayDataPlane
          metadata:
            name: ($aigw_dp_name)
            namespace: ($namespace)
          spec:
            controlPlaneRef:
              type: konnectNamespacedRef
              konnectNamespacedRef:
                name: ($aigw_cp_name)
            deployment:
              replicas: 1
              podTemplateSpec:
                spec:
                  containers:
                    - name: aigw
                      image: ($aigw_dp_image)
                      env: ($aigw_dp_env)
                      volumeMounts: ($aigw_dp_volume_mounts)
                  volumes: ($aigw_dp_volumes)
            network:
              services:
                ingress:
                  type: LoadBalancer
                  ports:
                    - name: ingress
                      port: 443
                      targetPort: 8443
    - assert:
        resource:
          apiVersion: aigateway.konghq.com/v1alpha1
          kind: AIGatewayDataPlane
          metadata:
            name: ($aigw_dp_name)
            namespace: ($namespace)
          status:
            (conditions[?type == 'ServiceReady']):
              - status: 'True'
            (conditions[?type == 'Ready']):
              - status: 'True'
            (readyReplicas > `0`): true
            (addresses[0].value != null): true
            (addresses[0].value != ''): true

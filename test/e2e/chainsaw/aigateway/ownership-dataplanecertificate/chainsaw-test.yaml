apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-ownership-dataplanecertificate
spec:
  description: |
    Konnect entity ownership - AIGatewayDataPlaneCertificate. Checks, against the real Konnect API, how
    the operator owns the Konnect entity behind the CR (see the
    common/_step_templates/konnect-ownership-*.yaml templates):

    - the entity carries the operator's labels (k8s-uid, managed-by, ...) and
      the user's labels, and the operator's values win over k8s-uid /
      managed-by set in the CR's spec;
    - a lost status.id is recovered through the k8s-uid label, without
      creating a second entity;
    - an entity with the same title created outside the operator, or by a
      second CR, is never taken over;
    - deleting a CR that lost its status.id leaves no orphan entity.

    Data plane certificates are identified by their title. They cannot be
    updated (the operator has no update operation for them), so there is no
    update step.

    Certificates created by releases that did not label them never get a
    k8s-uid label, so the operator also matches unlabeled certificates by
    their certificate, title and description (legacy fallback). The CR
    applied against the entity created outside the operator therefore uses
    another certificate (the conflict is on the title only), and a separate
    step checks the fallback adopts an unlabeled certificate identical to
    its CR.

    No data plane is needed.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    # The entity under test.
    - name: cr_api_version
      value: aiconfiguration.konghq.com/v1alpha1
    - name: cr_kind
      value: AIGatewayDataPlaneCertificate
    - name: cr_resource
      value: aigatewaydataplanecertificates.aiconfiguration.konghq.com
    - name: collection_path_jq
      value: '"/v1/ai-gateways/" + .status.gatewayID.id + "/data-plane-certificates"'
    - name: cr_name
      value: dataplane-certificate
    - name: duplicate_cr_name
      value: dataplane-certificate-duplicate
    - name: foreign_cr_name
      value: dataplane-certificate-foreign
    - name: entity_name
      value: ownership-dataplane-certificate
    - name: foreign_entity_name
      value: ownership-dataplane-certificate-foreign
    - name: cr_spec
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          title: ($entity_name)
          cert:
            type: secretRef
            secretRef:
              name: ownership-tls
              key: tls.crt
          labels: {team: chainsaw, k8s-uid: not-the-real-uid, managed-by: someone-else}
    - name: cr_spec_updated
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          title: ($entity_name)
          cert:
            type: secretRef
            secretRef:
              name: ownership-tls
              key: tls.crt
          labels: {team: chainsaw-updated, k8s-uid: not-the-real-uid, managed-by: someone-else}
    - name: foreign_cr_spec
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          title: ($foreign_entity_name)
          labels: {reconcile: first}
          cert:
            type: secretRef
            secretRef:
              name: ownership-tls
              key: tls.crt
    - name: foreign_cr_spec_bumped
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          title: ($foreign_entity_name)
          labels: {reconcile: second}
          cert:
            type: secretRef
            secretRef:
              name: ownership-tls
              key: tls.crt
    - name: foreign_body
      value: >-
        (join('', ['{title: "', $foreign_entity_name, '", cert: $ENV.SECRET_TLS_CRT}']))
    - name: legacy_cr_name
      value: dataplane-certificate-legacy
    - name: legacy_title
      value: ownership-dataplane-certificate-legacy
    - name: legacy_cr_spec
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          title: ($legacy_title)
          cert:
            type: secretRef
            secretRef:
              name: ownership-tls-foreign
              key: tls.crt
  steps:
    - name: Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: Create-tls-secret-ownership-tls
      bindings:
        - name: sni_hostname
          value: ownership.example.com
        - name: cert_secret_name
          value: ownership-tls
        - name: cert_secret_namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/apply-assert-tlsSecret.yaml
    - name: Create-tls-secret-ownership-tls-foreign
      bindings:
        - name: sni_hostname
          value: ownership-foreign.example.com
        - name: cert_secret_name
          value: ownership-tls-foreign
        - name: cert_secret_namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/apply-assert-tlsSecret.yaml

    - name: Create-entity
      use:
        template: ../../common/_step_templates/konnect-ownership-apply-assert-entity.yaml
    - name: Assert-labels
      bindings:
        - name: user_label_value
          value: chainsaw
      use:
        template: ../../common/_step_templates/konnect-ownership-assert-labels.yaml
    - name: Recover-lost-Konnect-ID
      use:
        template: ../../common/_step_templates/konnect-ownership-recover-lost-id.yaml
    - name: Reject-entity-created-outside-the-operator
      use:
        template: ../../common/_step_templates/konnect-ownership-reject-foreign-entity.yaml
        with:
          bindings:
            - name: foreign_secret_name
              value: ownership-tls-foreign
            - name: foreign_match_field
              value: title
    - name: Reject-duplicate-CR
      bindings:
        - name: cr_spec
          value: ($cr_spec)
        - name: duplicate_cr_spec_bumped
          value: ($cr_spec_updated)
      use:
        template: ../../common/_step_templates/konnect-ownership-reject-duplicate-cr.yaml
    - name: Adopt-legacy-unlabeled-certificate
      description: |
        Certificates created by releases that did not label AI Gateway data
        plane certificates carry no k8s-uid label and cannot be updated to get
        one. Simulate one by creating a certificate directly in Konnect, then
        apply a CR with the same certificate, title and description: its create
        gets a conflict and the legacy fallback must adopt the certificate (the
        CR gets its Konnect ID). Deleting the CR must then delete it.
      try:
        - script:
            env:
              - name: RESOURCE_TYPE
                value: ($cr_resource)
              - name: RESOURCE_NAME
                value: ($cr_name)
              - name: NAMESPACE
                value: ($namespace)
              - name: COLLECTION_PATH_JQ
                value: ($collection_path_jq)
            content: |
              bash ../../common/scripts/konnect_entity_of_resource.sh
            outputs:
              - name: primary
                value: (json_parse($stdout))
        - description: Create the unlabeled certificate directly in Konnect.
          script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
              - name: METHOD
                value: POST
              - name: API_PATH
                value: ($primary.collection_path)
              - name: LEGACY_TITLE
                value: ($legacy_title)
              - name: BODY
                value: '{title: $ENV.LEGACY_TITLE, cert: $ENV.SECRET_TLS_CRT}'
              - name: EXPECTED_STATUS
                value: "200,201"
              - name: SECRET_NAME
                value: ownership-tls-foreign
              - name: NAMESPACE
                value: ($namespace)
            content: |
              bash ../../common/scripts/konnect_api_request_with_secret.sh
            outputs:
              - name: legacy_id
                value: (json_parse($stdout).body.id)
        - apply:
            resource:
              apiVersion: ($cr_api_version)
              kind: ($cr_kind)
              metadata:
                name: ($legacy_cr_name)
                namespace: ($namespace)
              spec: ($legacy_cr_spec)
        - description: The CR adopts the unlabeled certificate.
          assert:
            resource:
              apiVersion: ($cr_api_version)
              kind: ($cr_kind)
              metadata:
                name: ($legacy_cr_name)
                namespace: ($namespace)
              status:
                id: ($legacy_id)
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - delete:
            ref:
              apiVersion: ($cr_api_version)
              kind: ($cr_kind)
              name: ($legacy_cr_name)
              namespace: ($namespace)
        - error:
            resource:
              apiVersion: ($cr_api_version)
              kind: ($cr_kind)
              metadata:
                name: ($legacy_cr_name)
                namespace: ($namespace)
        - description: Deleting the CR deleted the adopted certificate.
          script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
              - name: API_PATH
                value: (join('/', [$primary.collection_path, $legacy_id]))
              - name: EXPECTED_STATUS
                value: "404"
            content: |
              bash ../../common/scripts/konnect_api_request.sh
      finally:
        - script:
            env:
              - name: RESOURCE_TYPE
                value: ($cr_resource)
              - name: RESOURCE_NAME
                value: ($cr_name)
              - name: NAMESPACE
                value: ($namespace)
              - name: COLLECTION_PATH_JQ
                value: ($collection_path_jq)
              - name: REQUIRE_ID
                value: "false"
            content: |
              bash ../../common/scripts/konnect_entity_of_resource.sh
            outputs:
              - name: collection
                value: (json_parse($stdout).collection_path)
        - description: Remove the certificate from Konnect if the test left it behind.
          script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
              - name: API_PATH
                value: ($collection)
              - name: MATCH_FIELD
                value: title
              - name: MATCH_VALUE
                value: ($legacy_title)
            content: |
              bash ../../common/scripts/konnect_delete_unowned_entities.sh
    - name: Delete-leaves-no-orphan-after-lost-Konnect-ID
      use:
        template: ../../common/_step_templates/konnect-ownership-no-orphan-after-lost-id.yaml

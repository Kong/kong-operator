name: validate AIGateway dataplane RC images (scheduled)

# Polls kong/kong-ai-gateway-dev for release candidate images (kaigatewayx.x.x-rc.x) and triggers
# validate_aigateway_dp_image.yaml for each of them.
# Scheduled runs cover the fixed window [previous POLL_ANCHOR_TIME, latest POLL_ANCHOR_TIME)
# so that consecutive runs neither miss nor re-validate images, even if a run is delayed.

on:
  schedule:
    # Must match POLL_ANCHOR_TIME below.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: Override the fixed daily window and validate RC images pushed within
          this many hours before now. Leave empty to use the fixed daily window.
        type: number
        required: false

permissions:
  contents: read

env:
  AIGATEWAY_IMAGE_REPO: kong/kong-ai-gateway-dev
  # Pattern of RC image tags to validate, e.g. 1.2.3-rc.4.
  AIGATEWAY_RC_TAG_REGEX: '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
  # Time of day (UTC) at which the daily poll window starts and ends. Must match the cron schedule.
  POLL_ANCHOR_TIME: "05:00"
  # Interval between triggering subsequent validation workflows. Each matrix leg of
  # trigger-validation sleeps this long after its dispatch, except the last one.
  DISPATCH_INTERVAL_SECONDS: 600

jobs:
  find-images:
    timeout-minutes: ${{ fromJSON(vars.GHA_DEFAULT_TIMEOUT) }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.find.outputs.tags }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find new RC images
        id: find
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback-hours }}
        run: |
          set -euo pipefail
          # Manual runs may override the fixed daily window with a lookback from now.
          if [[ -n "${LOOKBACK_HOURS}" ]]; then
            window=(--lookback-hours "${LOOKBACK_HOURS}")
          else
            window=(--daily-window "${POLL_ANCHOR_TIME}")
          fi

          # Docker Hub only supports substring filtering on tag names, so narrow the results
          # down with "-rc." and let the script apply the exact pattern.
          tags=$(./scripts/list-docker-hub-tags.sh --repository "${AIGATEWAY_IMAGE_REPO}" \
            --regex "${AIGATEWAY_RC_TAG_REGEX}" --name-filter "-rc." "${window[@]}")
          if [[ -z "${tags}" ]]; then
            echo "No new RC images found." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "New RC images found: ${tags//$'\n'/ }" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
          echo "tags=$(jq -Rnc '[inputs | select(length > 0)]' <<< "${tags}")" >> "${GITHUB_OUTPUT}"

  # One matrix leg per tag, so each dispatch mints its own App token: installation
  # tokens expire after 1 hour, which a single token would outlive with enough tags.
  trigger-validation:
    needs: find-images
    if: ${{ needs.find-images.outputs.tags != '[]' }}
    # One dispatch plus at most one DISPATCH_INTERVAL_SECONDS sleep.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # Dispatch one tag at a time, spaced out by the sleep below.
      max-parallel: 1
      # A failed dispatch must not skip the remaining tags.
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.find-images.outputs.tags) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Short-lived App token, minted in the job that uses it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
          permission-actions: write

      - name: Trigger validation workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          REF: ${{ github.ref_name }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          echo "Triggering validation for ${AIGATEWAY_IMAGE_REPO}:${TAG}"
          gh workflow run validate_aigateway_dp_image.yaml --ref "${REF}" \
            -f aigateway-image-repo="${AIGATEWAY_IMAGE_REPO}" \
            -f aigateway-image-tag="${TAG}"

          if (( JOB_INDEX + 1 < JOB_TOTAL )); then
            echo "Waiting ${DISPATCH_INTERVAL_SECONDS}s before triggering the next validation..."
            sleep "${DISPATCH_INTERVAL_SECONDS}"
          fi

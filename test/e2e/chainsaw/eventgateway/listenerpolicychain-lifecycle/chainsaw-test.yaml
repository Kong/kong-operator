apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventgateway-listenerpolicychain-lifecycle
spec:
  description: |
    Exercise Konnect listener policy chains against the real API: exact complete
    ordering, declaration changes, periodic drift repair, reference blocking and
    recovery, policy-set changes, recreation with new IDs, competing ownership,
    handover, and retention after deletion without authentication or valid refs.
    Check every prerequisite condition at the current generation and no chain ID.
    Also exercise an explicitly empty listener scope. No Kafka or data plane is needed.
  timeouts:
    exec: 600s
    cleanup: 300s
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [$test_name, 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [$test_name, 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: keg_cp_name
      value: (join('-', [$test_name, 'keg']))
    - name: backend_cluster_name
      value: chain-backend
    - name: virtual_cluster_name
      value: chain-vc
    - name: dns_label
      value: listenerchainvc
    - name: listener_name
      value: chain-listener
    - name: listener_ports
      value: ['19092-19095']
  steps:
    - name: Register-isolated-cleanup-before-creating-resources
      try:
        - script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
            content: |
              test -n "${KONNECT_TOKEN:?KONNECT_TOKEN must be set}"
      cleanup:
        - description: Remove only this test's CRs and its exact-name, test-labeled gateway.
          script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: GATEWAY_NAME
                value: ($keg_cp_name)
              - name: TEST_NAME
                value: ($test_name)
              - name: AUTH_NAME
                value: ($konnect_auth_name)
              - name: AUTH_SECRET_NAME
                value: ($auth_secret_name)
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
            content: |
              bash scripts/cleanup.sh
    - name: Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: Create-dedicated-gateway
      use:
        template: ../../common/_step_templates/apply-assert-konnectEventGateway.yaml
    - name: Create-backend
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayBackendCluster.yaml
    - name: Create-virtual-cluster
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayVirtualCluster.yaml
    - name: Create-listener
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayListener.yaml
    - name: Create-empty-listener
      bindings:
        - name: listener_name
          value: empty-listener
        - name: listener_ports
          value: ['29092']
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayListener.yaml
    - name: Reverse-creation-order-and-explicitly-empty-scope
      try:
        - script:
            env: &chain_env
              - name: NAMESPACE
                value: ($namespace)
              - name: LISTENER_NAME
                value: ($listener_name)
              - name: VIRTUAL_CLUSTER_NAME
                value: ($virtual_cluster_name)
              - name: AUTH_NAME
                value: ($konnect_auth_name)
              - name: AUTH_SECRET_NAME
                value: ($auth_secret_name)
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
            content: |
              bash scripts/chain.sh bootstrap
    - name: Change-declared-order
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh reorder
    - name: Repair-out-of-band-order-and-hold-beyond-sync-period
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh drift
    - name: Block-absent-reference-without-shortened-write-and-recover
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh missing
    - name: Block-unready-policy-and-recover-on-programming
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh unready
    - name: Delete-and-recreate-policy-with-latest-ID-and-UID
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh recreate
    - name: Block-extra-and-omitted-policies-and-recover-complete-set
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh policy-set
    - name: Reject-competing-chain-and-hand-over-after-owner-deletion
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh handover
    - name: Delete-without-auth-or-valid-refs-and-retain-order-and-identities
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh retained

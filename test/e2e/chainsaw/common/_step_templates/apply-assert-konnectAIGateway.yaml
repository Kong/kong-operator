# Template for creating and asserting a KonnectAIGateway (AI Gateway control plane).
#
# Required bindings:
#   - aigw_cp_name: Name of the KonnectAIGateway to create.
#   - aigw_cp_namespace: Namespace where the KonnectAIGateway will be created.
#   - auth_name: Name of the KonnectAPIAuthConfiguration to reference (same namespace).
#   - test_name: Identifier used for the "test" label so the hack/cleanup script can find and
#     prune this AI Gateway from Konnect if it's left behind by a cancelled/crashed test run.
#
# Optional bindings (override with use.with.bindings; unset by default):
#   - min_runtime_version: Minimum data plane runtime version, e.g. "2.1", for
#     tests using fields or features Konnect rejects below that version.
#   - runtime_auto_upgrade: "Enabled" to keep the minimum runtime version
#     advancing as newer data planes connect, instead of staying pinned once
#     Konnect deprecates that baseline.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-konnect-aigateway
spec:
  bindings:
    - name: min_runtime_version
      value: (`null`)
    - name: runtime_auto_upgrade
      value: (`null`)
  try:
    - apply:
        resource:
          apiVersion: konnect.konghq.com/v1alpha1
          kind: KonnectAIGateway
          metadata:
            name: ($aigw_cp_name)
            namespace: ($aigw_cp_namespace)
          spec:
            apiSpec:
              name: ($aigw_cp_name)
              displayName: ($aigw_cp_name)
              description: AIGateway chainsaw e2e control plane
              labels:
                test: ($test_name)
              minRuntimeVersion: ($min_runtime_version)
              runtimeAutoUpgrade: ($runtime_auto_upgrade)
            konnect:
              authRef:
                name: ($auth_name)
    - assert:
        resource:
          apiVersion: konnect.konghq.com/v1alpha1
          kind: KonnectAIGateway
          metadata:
            name: ($aigw_cp_name)
            namespace: ($aigw_cp_namespace)
          status:
            (conditions[?type == 'Programmed']):
              - status: 'True'
            (id != null): true
            (endpoints.configuration != null): true

# JSON merge patch for oidc-mock: drops the primary client's first secret so it
# can no longer mint new tokens, leaving its second secret and the outsider client
# untouched. Used by the Revoke-first-client-secret step.
#
# NOTE: chainsaw's patch operation is a JSON Merge Patch, which replaces the
# containers array (and therefore the whole env array) wholesale rather than
# strategic-merging by name, so the container object below must repeat ALL
# required fields and ALL other env vars from 00-oidc-mock.yaml, not just the
# image and the one env var being changed, or they're silently dropped.
#
# Required bindings:
#   - namespace: Namespace oidc-mock is deployed into (this test's own namespace).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-mock
  namespace: ($namespace)
spec:
  template:
    spec:
      containers:
        - name: oidc-mock
          image: ghcr.io/soluto/oidc-server-mock:0.8.6
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: SERVER_OPTIONS_INLINE
              value: |
                {
                  "AccessTokenJwtType": "JWT",
                  "Discovery": { "ShowKeySet": true }
                }
            - name: API_SCOPES_INLINE
              value: |
                - Name: aigateway-scope
            - name: API_RESOURCES_INLINE
              value: |
                - Name: aigateway-api
                  Scopes:
                    - aigateway-scope
            - name: CLIENTS_CONFIGURATION_INLINE
              value: |
                [
                  {
                    "ClientId": "aigateway-oidc-client",
                    "ClientSecrets": ["aigateway-oidc-client-secret-2"],
                    "Description": "Client credentials client for AIGatewayIdentityProvider openid-connect e2e coverage",
                    "AllowedGrantTypes": ["client_credentials"],
                    "AllowedScopes": ["aigateway-scope"],
                    "ClientClaimsPrefix": ""
                  },
                  {
                    "ClientId": "aigateway-oidc-client-outsider",
                    "ClientSecrets": ["aigateway-oidc-client-outsider-secret"],
                    "Description": "Second client credentials client for the outsider-consumer ACL scenario",
                    "AllowedGrantTypes": ["client_credentials"],
                    "AllowedScopes": ["aigateway-scope"],
                    "ClientClaimsPrefix": ""
                  }
                ]

                              and `multipart/form-data`.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          keyInHeader:
                            description: |-
                              If enabled (default), the plugin reads the request header and tries to find
                              the key in it.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          keyInQuery:
                            description: |-
                              If enabled (default), the plugin reads the query parameter in the request
                              and tries to find the key in it.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          keyNames:
                            description: |-
                              Describes an array of parameter names where the plugin will look for a key.
                              The key names may only contain [a-z], [A-Z], [0-9], [_] underscore, and [-]
                              hyphen.
                            items:
                              type: string
                            type: array
                          principals:
                            description: AIGWKeyAuthGeneratedConfigPrincipals is a
                              type alias.
                            properties:
                              directory:
                                description: The Kong Identity directory instance
                                  to authenticate against.
                                maxLength: 253
                                type: string
                              enabled:
                                description: When true, authenticate against Kong
                                  Identity instead of local credentials.
                                enum:
                                - Enabled
                                - Disabled
                                type: string
                              errorOnMiss:
                                description: |-
                                  When true (default), return 401 if no matching principal is found in Kong

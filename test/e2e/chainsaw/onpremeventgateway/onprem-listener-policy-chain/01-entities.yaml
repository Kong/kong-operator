# A listener of the OnPremEventGateway gateway_name with two policies, first
# and second, forwarding to a virtual cluster. No data plane uses them: the
# test only checks what gw-admin holds.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayBackendCluster
metadata:
  name: backend
spec:
  parentRef:
    group: eventgateway.konghq.com
    kind: OnPremEventGateway
    name: ($gateway_name)
  apiSpec:
    name: backend
    bootstrapServers:
      - kafka-bootstrap.kafka-shared.svc:9092
    authentication:
      type: anonymous
      anonymous: {}
    insecureAllowAnonymousVirtualClusterAuth: Enabled
    tls:
      enabled: Disabled
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualCluster
metadata:
  name: vcluster
spec:
  eventGatewayBackendClusterRef:
    type: namespacedRef
    namespacedRef:
      name: backend
  apiSpec:
    name: vcluster
    dnsLabel: vcluster
    aclMode: passthrough
    authentication:
      - type: anonymous
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayListener
metadata:
  name: listener
spec:
  parentRef:
    group: eventgateway.konghq.com
    kind: OnPremEventGateway
    name: ($gateway_name)
  apiSpec:
    name: listener
    addresses:
      - "0.0.0.0"
    ports:
      - "19092-19095"
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayListenerPolicy
metadata:
  name: first
spec:
  eventGatewayListenerRef:
    type: namespacedRef
    namespacedRef:
      name: listener
  apiSpec:
    type: forwardToVirtualCluster
    forwardToVirtualCluster:
      name: first
      config:
        type: portMapping
        portMapping:
          bootstrapPort: at_start
          advertisedHost: localhost
          destination:
            name: vcluster
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayListenerPolicy
metadata:
  name: second
spec:
  eventGatewayListenerRef:
    type: namespacedRef
    namespacedRef:
      name: listener
  apiSpec:
    type: forwardToVirtualCluster
    forwardToVirtualCluster:
      name: second
      config:
        type: portMapping
        portMapping:
          bootstrapPort: at_start
          advertisedHost: localhost
          destination:
            name: vcluster

# The gateway watches its own namespace (always included) and the Entities
# namespace, so that it sees the Agent and the Model there.
apiVersion: aigateway.konghq.com/v1alpha1
kind: OnPremAIGateway
metadata:
  name: ($aigw_cp_name)
  namespace: ($namespace)
spec:
  watchNamespaces:
    type: list
    list:
      - ($entities_namespace)
---
# The consumer group is in the gateway's namespace. Only the entities that
# reference it are in the other namespace, so its own aiGatewayRef needs no
# grant.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerGroup
metadata:
  name: ($consumer_group_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($consumer_group_name)
    displayName: Cross-namespace ACL consumer group

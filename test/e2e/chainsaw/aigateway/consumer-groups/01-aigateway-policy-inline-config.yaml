# An AIGatewayPolicy resource with inline config that adds a custom response header.
# Required bindings:
#   - namespace: The namespace where the AIGatewayPolicy resource will be created.
#   - aigw_cp_name: The name of the AIGateway control plane resource to which this policy will be applied.
#   - aigw_policy_name: The name of the AIGatewayPolicy resource to be created.
#   - response_header: The "Name:value" response header this policy adds.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata:
  name: ($aigw_policy_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    type: namespacedRef
    namespacedRef:
      name: ($aigw_cp_name)
      namespace: ($namespace)
  apiSpec:
    type: response-transformer
    displayName: ($aigw_policy_name)
    enabled: "Enabled"
    global: "Disabled"
    name: ($aigw_policy_name)
    config:
      type: inline
      value:
        add:
          headers:
            - ($response_header)

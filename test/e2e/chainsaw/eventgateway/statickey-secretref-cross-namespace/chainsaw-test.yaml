apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventgateway-statickey-secretref-cross-namespace
spec:
  description: |
    EventGatewayStaticKey whose value comes from a Secret in another namespace,
    against the real Konnect API. Access to the Secret needs a
    KongReferenceGrant in the Secret's namespace:

    - without a grant, the static key reports ResolvedRefs False
      (RefNotPermitted) and isn't created in Konnect;
    - once a grant allows it, the static key is created and Programmed;
    - revoking the grant blocks the static key again (the grant is checked
      even once the key exists in Konnect, although the Secret is then only
      needed to recreate it);
    - a static key deleted from Konnect out of band isn't recreated from the
      Secret while the grant is revoked (waiting past the operator's Konnect
      sync period, one minute by default);
    - the static key can still be deleted while the grant is revoked.

    No data plane is needed.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: keg_cp_name
      value: (join('-', [($test_name), 'keg']))
    - name: secret_namespace
      value: (join('-', [$namespace, 'secret']))
    - name: static_key_name
      value: encryption-key
    - name: konnect_static_key_name
      value: (join('-', [($test_name), 'encryption-key']))
    - name: grant_name
      value: statickey-to-secret
  steps:
    - name: Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: Create-konnect-eventgateway
      use:
        template: ../../common/_step_templates/apply-assert-konnectEventGateway.yaml
    - name: Create-secret-namespace
      bindings:
        - name: namespace_name
          value: ($secret_namespace)
      use:
        template: ../../common/_step_templates/apply-assert-namespace.yaml

    - name: Static-key-without-grant-is-not-created
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: encryption-key
                namespace: ($secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                key: Y2hhaW5zYXctc3RhdGljLWtleS0zMi1ieXRlcy1vayE=
        - apply:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              metadata:
                name: ($static_key_name)
                namespace: ($namespace)
              spec:
                gatewayRef:
                  type: namespacedRef
                  namespacedRef:
                    name: ($keg_cp_name)
                apiSpec:
                  name: ($konnect_static_key_name)
                  value:
                    type: secretRef
                    secretRef:
                      name: encryption-key
                      namespace: ($secret_namespace)
                      key: key
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              metadata:
                name: ($static_key_name)
                namespace: ($namespace)
              status:
                (id == null): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
                (conditions[?type == 'Programmed']):
                  - status: 'False'

    - name: Static-key-with-grant-is-programmed
      bindings:
        - name: kong_reference_grant_name
          value: ($grant_name)
        - name: kong_reference_grant_namespace
          value: ($secret_namespace)
        - name: from
          value:
            - group: configuration.konghq.com
              kind: EventGatewayStaticKey
              namespace: ($namespace)
        - name: to
          value:
            - group: core
              kind: Secret
      use:
        template: ../../common/_step_templates/apply-assert-kongreferencegrant.yaml
    - name: Assert-static-key-programmed
      try:
        - assert:
            timeout: 90s
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              metadata:
                name: ($static_key_name)
                namespace: ($namespace)
              status:
                (id != null): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'True'
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: Revoking-the-grant-blocks-the-static-key
      try:
        - delete:
            ref:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongReferenceGrant
              name: ($grant_name)
              namespace: ($secret_namespace)
        - assert:
            timeout: 90s
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              metadata:
                name: ($static_key_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
                (conditions[?type == 'Programmed']):
                  - status: 'False'

    - name: Static-key-deleted-out-of-band-is-not-recreated-without-grant
      try:
        - script:
            env:
              - name: RESOURCE_TYPE
                value: eventgatewaystatickeys.configuration.konghq.com
              - name: RESOURCE_NAME
                value: ($static_key_name)
              - name: NAMESPACE
                value: ($namespace)
              - name: COLLECTION_PATH_JQ
                value: '"/v1/event-gateways/" + .status.gatewayID.id + "/static-keys"'
            content: |
              bash ../../common/scripts/konnect_entity_of_resource.sh
            outputs:
              - name: static_key
                value: (json_parse($stdout))
        - description: Delete the static key in Konnect, behind the operator's back.
          script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
              - name: API_PATH
                value: ($static_key.entity_path)
              - name: METHOD
                value: DELETE
              - name: EXPECTED_STATUS
                value: "204"
            content: |
              bash ../../common/scripts/konnect_api_request.sh
        # Longer than the one-minute default Konnect sync period, after which
        # a static key deleted out of band would be recreated.
        - sleep:
            duration: 80s
        - description: No static key was recreated in Konnect from the Secret.
          script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
              - name: API_PATH
                value: ($static_key.collection_path)
              - name: NAME
                value: ($konnect_static_key_name)
              - name: RETRY_COUNT
                value: "1"
              - name: EXPECTED_JQ
                value: '[.data[] | select(.name == $ENV.NAME)] | length == 0'
            content: |
              bash ../../common/scripts/konnect_api_request.sh

    - name: Static-key-can-be-deleted-without-grant
      try:
        - delete:
            ref:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              name: ($static_key_name)
              namespace: ($namespace)
        - error:
            timeout: 60s
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: EventGatewayStaticKey
              metadata:
                name: ($static_key_name)
                namespace: ($namespace)

# Template for asserting a KegDataPlane has a client certificate Secret the
# operator issued: Automatic, and controlled by the data plane.
#
# Required bindings:
#   - object_name, object_namespace: The KegDataPlane.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: assert-dataplane-certificate-secret
spec:
  try:
    - assert:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            namespace: ($object_namespace)
            labels:
              konghq.com/keg-dp-cert: "true"
              gateway.konghq.com/secret-provisioning: automatic
            (ownerReferences[?kind == 'KegDataPlane' && name == $object_name && controller]):
              - kind: KegDataPlane

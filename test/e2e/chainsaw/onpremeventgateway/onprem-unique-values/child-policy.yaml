# A consume policy named child, without a parent policy.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterConsumePolicy
metadata:
  name: child
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: modifyHeaders
    modifyHeaders:
      name: child
      config:
        actions:
          - op: remove
            remove:
              key: x-child

# TCPRoute: plain L4 TCP proxying. The TCP listener makes the operator program
# Kong's stream listen and expose the port on the DataPlane's ingress Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcpecho
  labels:
    app: tcpecho
spec:
  selector:
    matchLabels:
      app: tcpecho
  template:
    metadata:
      labels:
        app: tcpecho
    spec:
      containers:
      - name: tcpecho
        image: kong/go-echo:0.5.0
        ports:
        - containerPort: 1025
        env:
        - name: POD_NAME
          value: tcproute-example-manifest
---
apiVersion: v1
kind: Service
metadata:
  name: tcpecho
spec:
  ports:
  - port: 8888
    protocol: TCP
    targetPort: 1025
  selector:
    app: tcpecho
  type: ClusterIP
---
apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: example-tcproute
  namespace: default
spec:
  dataPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
          - name: proxy
            # renovate: datasource=docker versioning=docker
            image: kong/kong-gateway:3.16
            readinessProbe:
              initialDelaySeconds: 1
              periodSeconds: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-tcproute
spec:
  controllerName: konghq.com/gateway-operator
  parametersRef:
    group: gateway-operator.konghq.com
    kind: GatewayConfiguration
    name: example-tcproute
    namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-tcproute
spec:
  gatewayClassName: example-tcproute
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: tcp
    protocol: TCP
    port: 8888
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcpecho
spec:
  parentRefs:
  - name: example-tcproute
    sectionName: tcp
  rules:
  - backendRefs:
    - name: tcpecho
      port: 8888

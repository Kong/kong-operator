# An HTTP AIGatewayAgent routing /http-agent to the go-echo backend, guarded by
# the openid-connect auth strategy AND an allow-type ACL listing the consumer
# group: only tokens mapping to a consumer enrolled in the group may pass, and
# unauthenticated requests fall through openid-connect as an anonymous consumer
# which the ACL denies with 403.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayAgent
metadata:
  name: ($http_agent_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($http_agent_name)
    displayName: ($http_agent_name)
    type: http
    enabled: Enabled
    config:
      url: (join('', ['http://', ($echo_deployment_name), '.', ($namespace), '.svc.cluster.local:1027']))
      route:
        paths:
          - ($http_agent_route_path)
        methods:
          - GET
          - POST
        protocols:
          - http
          - https
        stripPath: Enabled
    access:
      authStrategies:
        - name: ($oidc_auth_strategy_name)
      acls:
        type: allow
        allow:
          allow:
            - kind: AIGatewayConsumerGroup
              name: ($consumer_group_name)

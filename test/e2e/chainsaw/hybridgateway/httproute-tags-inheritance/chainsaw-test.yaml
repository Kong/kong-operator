# Test: konghq.com/tags inherited from the parent Gateway and its GatewayClass.
# Verifies that every Kong entity translated from an HTTPRoute picks up the
# konghq.com/tags annotation of the Gateway it is attached to and of that
# Gateway's GatewayClass, and that changing either annotation re-reconciles the
# generated entities.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: httproute-tags-inheritance
spec:
  description: |
    This test validates konghq.com/tags inheritance in the hybrid gateway
    translation. Unit tests already cover the merge order and the tag cap, so
    what this test adds is the parts only a live cluster exercises:
    - the Gateway -> route and GatewayClass -> route watches actually
      re-reconcile the generated entities when only an annotation changes,
    - the GatewayClass -> Gateway watch re-reconciles the listener
      KongCertificate and KongSNI, which are owned by the Gateway rather than
      by a route,
    - the merged spec.tags is accepted by the real CRD schema, whose
      commonv1alpha1.Tags type caps tags at 20 entries of 1-128 characters.

    The GatewayClass and Gateway are created by the shared step templates
    without tags, then annotated one at a time so each watch is checked on its
    own. Assertions use `contains` rather than an exact list so they do not
    depend on the merge order, which the unit tests pin precisely.

  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_api_auth_namespace
      value: ($namespace)
    - name: sni_hostname
      value: (join('.', ['*', ($namespace), 'example.com']))
    - name: fqdn
      value: (join('.', ['echo', ($namespace), 'example.com']))
    - name: cert_secret_name
      value: test-tls-secret
    - name: cert_secret_namespace
      value: ($namespace)
    - name: listener_https_port
      value: 443
    - name: listener_http_port
      value: 80
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($namespace), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($namespace), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: gateway_image
      value: (env('GATEWAY_IMAGE'))
    - name: gateway_name
      value: (join('-', [($namespace), 'gateway']))
    - name: gateway_namespace
      value: ($namespace)
    - name: gateway_class_name
      value: (join('-', [($namespace), 'gateway-class']))
    - name: http_route_name
      value: (join('-', [($namespace), 'echo-route']))
    - name: http_route_namespace
      value: ($namespace)
    - name: echo_deployment_name
      value: (join('-', [($namespace), 'echo']))
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1

  steps:
    # Step 1: Create TLS secret for Gateway TLS listener.
    - name: Create-tls-secret
      description: Create TLS Secret for the Gateway TLS listener.
      use:
        template: ../../common/_step_templates/apply-assert-tlsSecret.yaml

    # Step 2: Create secret for Konnect authentication.
    - name: Create-auth-secret
      description: Create Secret with Konnect token.
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml

    # Step 3: Create KonnectAPIAuthConfiguration.
    - name: Create-konnect-api-auth
      description: Create KonnectAPIAuthConfiguration.
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml

    # Step 4: Create GatewayConfiguration.
    - name: Create-gateway-configuration
      description: Create GatewayConfiguration for hybrid gateway.
      use:
        template: ../../common/_step_templates/apply-assert-gatewayConfiguration.yaml

    # Step 5: Create GatewayClass.
    - name: Create-gateway-class
      description: Create GatewayClass.
      use:
        template: ../../common/_step_templates/apply-assert-gatewayClass.yaml

    # Step 6: Create Gateway with TLS listener.
    - name: Create-gateway
      description: Create Gateway.
      use:
        template: ../../common/_step_templates/apply-assert-gateway.yaml

    # Step 7: Assert KonnectGatewayControlPlane is created.
    - name: Assert-konnect-gateway-control-plane
      description: Assert KonnectGatewayControlPlane.
      use:
        template: ../../common/_step_templates/assert-konnectGatewayControlPlane.yaml

    # Step 8: Create echo service for the route's backend.
    - name: Create-echo-service
      description: Create echo service for backend.
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
      bindings:
        - name: echo_deployment_replicas
          value: ($echo_deployment_replicas)

    # -------------------------------------------------------------------------
    # Phase 1: neither the Gateway nor the GatewayClass carries tags, so the
    # generated entities only have what their own source gives them: the route
    # tags the HTTPRoute declares, and nothing at all for the service-like
    # entities, whose backend Service has no tags annotation.
    # -------------------------------------------------------------------------
    - name: Create-httproute
      description: Create HTTPRoute carrying konghq.com/tags.
      try:
        - apply:
            file: 01-httpRoute.yaml
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongRoute
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'route-tag')): true
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    reason: Programmed
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongService
              metadata:
                namespace: ($namespace)
              spec:
                (tags == null): true

    # -------------------------------------------------------------------------
    # Phase 2: annotate the Gateway only. This checks the Gateway -> route
    # watch: the HTTPRoute itself never changes, so the generated entities can
    # only pick the tag up by being re-reconciled on the Gateway event.
    # -------------------------------------------------------------------------
    - name: Annotate-gateway
      description: Add konghq.com/tags to the Gateway.
      try:
        - patch:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: ($gateway_name)
                namespace: ($namespace)
                annotations:
                  konghq.com/tags: gw-tag
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: ($gateway_name)
                namespace: ($namespace)
                annotations:
                  konghq.com/tags: gw-tag

    - name: Assert-gateway-tag-on-every-entity
      description: Assert the Gateway's tag reached every entity translated from the route.
      try:
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongRoute
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'route-tag')): true
                (contains(tags, 'gw-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongService
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongUpstream
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongTarget
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true

    - name: Assert-gateway-tag-on-listener-certificate
      description: |
        Assert the listener KongCertificate and KongSNI, which are owned by the
        Gateway rather than by a route, also picked the tag up.
      try:
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongCertificate
              metadata:
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by"): 'Gateway'
              spec:
                (contains(tags, 'gw-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongSNI
              metadata:
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by"): 'Gateway'
              spec:
                (contains(tags, 'gw-tag')): true

    # -------------------------------------------------------------------------
    # Phase 3: annotate the GatewayClass. This checks two separate watches: the
    # GatewayClass -> route watch for the route-derived entities, and the
    # GatewayClass -> Gateway watch for the listener certificate and SNI.
    # -------------------------------------------------------------------------
    - name: Annotate-gateway-class
      description: Add konghq.com/tags to the GatewayClass.
      try:
        - patch:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GatewayClass
              metadata:
                # Cluster-scoped, so no namespace here.
                name: ($gateway_class_name)
                annotations:
                  konghq.com/tags: class-tag
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: GatewayClass
              metadata:
                name: ($gateway_class_name)
                annotations:
                  konghq.com/tags: class-tag

    - name: Assert-gateway-class-tag-on-every-entity
      description: Assert both inherited tags are present on every generated entity.
      try:
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongRoute
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'route-tag')): true
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongService
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongUpstream
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongTarget
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongCertificate
              metadata:
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by"): 'Gateway'
              spec:
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongSNI
              metadata:
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by"): 'Gateway'
              spec:
                (contains(tags, 'gw-tag')): true
                (contains(tags, 'class-tag')): true

    # -------------------------------------------------------------------------
    # Phase 4: remove the Gateway's annotation. Inherited tags have to shrink,
    # not just grow, or a mistagged Gateway could never be corrected.
    # -------------------------------------------------------------------------
    - name: Remove-gateway-annotation
      description: Strip konghq.com/tags from the Gateway via kubectl annotate -.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: GATEWAY_NAME
                value: ($gateway_name)
            content: |
              kubectl annotate -n "$NAMESPACE" gateway "$GATEWAY_NAME" \
                konghq.com/tags- \
                --overwrite
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: ($gateway_name)
                namespace: ($namespace)
                (annotations."konghq.com/tags" == null): true

    - name: Assert-gateway-tag-removed
      description: Assert the Gateway's tag is gone while the GatewayClass's remains.
      try:
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongRoute
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'route-tag')): true
                (contains(tags, 'gw-tag')): false
                (contains(tags, 'class-tag')): true
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongService
              metadata:
                namespace: ($namespace)
              spec:
                (contains(tags, 'gw-tag')): false
                (contains(tags, 'class-tag')): true

  catch:
    # Capture debug snapshot on test failure.
    - description: Capture debug snapshot
      script:
        env:
          - name: TEST_NAME
            value: hybridgateway-httproute-tags-inheritance
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

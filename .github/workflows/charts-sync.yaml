name: Sync charts to charts repo
concurrency:
  # Run only for most recent commit in PRs but for all tags and commits on main
  # Ref: https://docs.github.com/en/actions/using-jobs/using-concurrency
  group: ${{ github.workflow }}-${{ github.head_ref || ( github.ref_type == 'tag' && github.ref_name || github.sha ) }}
  cancel-in-progress: true
on:
  push:
    paths:
      - charts/**
      - .github/charts-sync.yaml
      - .github/workflows/charts-sync.yaml
    branches:
      - release/2.4.0-rapid.1.x
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            charts
      - uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          # NOTE: use GH_INSTALLATION_TOKEN, not GH_PAT: only this input makes the
          # action take the App installation path (API commits, instead of a force push).
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_EMAIL: team-k8s+github-bot@konghq.com
          CONFIG_PATH: .github/charts-sync.yaml
          OVERWRITE_EXISTING_PR: true
          PR_BODY: |
            ### Sync charts from ${{ github.repository }}

            This PR was automatically generated by the `sync-charts` workflow.
            It syncs the charts/ directory from the ${{ github.repository }} repository.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onpremaigateway-lifecycle
spec:
  description: |
    Smoke test for the on-prem AI Gateway flow. Creates an OnPremAIGateway
    control plane and waits for it to become Ready, then creates an
    AIGatewayDataPlane attached via controlPlaneRef.onpremNamespacedRef and
    waits for it to become Ready with a service address, and finally creates
    one AIGatewayModelProvider + AIGatewayModel and asserts the model is
    Programmed (its rendered configuration was pushed to the data plane).

    The data plane is created before any configuration entity on purpose: a
    Kong DB-less data plane does not report ready while its applied
    configuration is empty, so this step is what proves that an empty
    configuration still leaves the data plane ready. No traffic is driven
    here — the routable end-to-end flow is covered by the config-push test.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: model_name
      value: (join('-', [($test_name), 'model']))
    - name: provider_name
      value: (join('-', [($test_name), 'provider']))
    - name: provider_credentials_name
      value: (join('-', [($provider_name), 'credentials']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Create-provider-and-model
      use:
        template: ../../common/_step_templates/apply-assert-onpremProviderAndModel.yaml
    - name: Assert-model-pushed-to-dataplane
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onpremaigateway-lifecycle
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh
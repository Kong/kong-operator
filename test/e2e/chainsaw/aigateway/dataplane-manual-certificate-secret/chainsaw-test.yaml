apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-dataplane-manual-certificate-secret
spec:
  description: |
    Exercises spec.certificateSecret (Manual provisioning) on AIGatewayDataPlane: the
    operator references an existing, user-owned TLS Secret instead of generating its own
    mTLS client certificate.
    0. An empty secretRef name is rejected at admission.
    1. Referenced Secret doesn't exist yet -> CertificateProvisioned=False/SecretRefNotFound,
       Ready=False/DependenciesNotReady, no KonnectCertificateRegistered condition at all
       (the operator never attempts Konnect registration without a usable certificate).
    2. Referenced Secret exists but has no tls.key, a tls.key that doesn't match tls.crt,
       an expired certificate, or one not valid yet -> CertificateProvisioned=False/InvalidSecret.
    3. Referenced Secret is fixed to a valid TLS keypair -> AIGatewayDataPlane reaches Ready=True,
       and the Deployment mounts that exact Secret (never one the operator generated itself).
    4. The Secret's content is rotated in place (same name, new keypair, e.g. simulating a
       cert-manager renewal) -> the Deployment's pod-template checksum annotation changes,
       proving the in-place edit triggers a rollout even though the Secret's name never changes.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: cert_secret_name
      value: (join('-', [($test_name), 'manual-cert']))
    - name: cert_secret_namespace
      value: ($namespace)
    - name: sni_hostname
      value: (join('', [($test_name), '.example.com']))
  steps:
    - name: 1-Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: 2-Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: 3-Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: 3b-Reject-empty-secretref-name
      description: An empty secretRef name is rejected at admission (MinLength=1).
      try:
        - apply:
            expect:
              - check:
                  (contains($error, 'spec.certificateSecret.secretRef.name')): true
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                controlPlaneRef:
                  type: konnectNamespacedRef
                  konnectNamespacedRef:
                    name: ($aigw_cp_name)
                certificateSecret:
                  provisioning: Manual
                  secretRef:
                    name: ""
    - name: 4-Create-aigatewaydataplane-referencing-missing-secret
      try:
        - apply:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                controlPlaneRef:
                  type: konnectNamespacedRef
                  konnectNamespacedRef:
                    name: ($aigw_cp_name)
                certificateSecret:
                  provisioning: Manual
                  secretRef:
                    name: ($cert_secret_name)
                deployment:
                  replicas: 1
                  podTemplateSpec:
                    spec:
                      containers:
                        - name: aigw
                          image: ($aigw_dp_image)
                network:
                  services:
                    ingress:
                      type: LoadBalancer
                      ports:
                        - name: ingress
                          port: 443
                          targetPort: 8443
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'KonnectAIGatewayResolved']):
                  - status: 'True'
                    reason: Resolved
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'False'
                    reason: SecretRefNotFound
                (length(conditions[?type == 'KonnectCertificateRegistered'])): 0
                (conditions[?type == 'Ready']):
                  - status: 'False'
                    reason: DependenciesNotReady
    - name: 5-Create-invalid-secret
      description: |
        Type is deliberately Opaque, not kubernetes.io/tls: the apiserver enforces
        tls.crt+tls.key on kubernetes.io/tls Secrets itself, which would reject this
        apply before the operator ever saw it. Opaque lets the operator's own
        validation (which only inspects .data, not .type) be the one under test.
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: not-a-real-certificate
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'False'
                    reason: InvalidSecret
                    (contains(message, 'tls.crt and tls.key must both be present')): true
                (length(conditions[?type == 'KonnectCertificateRegistered'])): 0
                (conditions[?type == 'Ready']):
                  - status: 'False'
                    reason: DependenciesNotReady
    - name: 5b-Create-secret-with-mismatched-key
      description: |
        tls.crt and tls.key are both valid PEM but come from two different keypairs:
        they decode fine but don't form a key pair, so the Secret must still be rejected.
      try:
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: mismatched_cert
                value: (json_parse($stdout).cert)
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: mismatched_key
                value: (json_parse($stdout).key)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: ($mismatched_cert)
                tls.key: ($mismatched_key)
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'False'
                    reason: InvalidSecret
                    (contains(message, 'do not form a valid key pair')): true
                (length(conditions[?type == 'KonnectCertificateRegistered'])): 0
    - name: 5c-Create-secret-with-expired-certificate
      description: |
        A matching keypair whose certificate expired (valid 2020-01-01 to 2020-01-02):
        it can never authenticate to Konnect, so the Secret must be rejected.
      try:
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
              - name: EXPIRED
                value: "true"
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: expired_cert
                value: (json_parse($stdout).cert)
              - name: expired_key
                value: (json_parse($stdout).key)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: ($expired_cert)
                tls.key: ($expired_key)
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'False'
                    reason: InvalidSecret
                    (contains(message, 'certificate expired at')): true
                (length(conditions[?type == 'KonnectCertificateRegistered'])): 0
    - name: 5d-Create-secret-with-not-yet-valid-certificate
      description: |
        A matching keypair whose certificate is not valid yet (valid from 2099-01-01):
        it can't authenticate to Konnect until then, so the Secret must be rejected.
      try:
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
              - name: NOT_YET_VALID
                value: "true"
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: not_yet_valid_cert
                value: (json_parse($stdout).cert)
              - name: not_yet_valid_key
                value: (json_parse($stdout).key)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: ($not_yet_valid_cert)
                tls.key: ($not_yet_valid_key)
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'False'
                    reason: InvalidSecret
                    (contains(message, 'certificate not valid before')): true
                (length(conditions[?type == 'KonnectCertificateRegistered'])): 0
    - name: 6-Fix-secret-with-valid-certificate
      try:
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: cert_data
                value: (json_parse($stdout).cert)
              - name: key_data
                value: (json_parse($stdout).key)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: ($cert_data)
                tls.key: ($key_data)
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'KonnectAIGatewayResolved']):
                  - status: 'True'
                    reason: Resolved
                (conditions[?type == 'CertificateProvisioned']):
                  - status: 'True'
                    reason: CertificateProvisioned
                (conditions[?type == 'KonnectCertificateRegistered']):
                  - status: 'True'
                    reason: KonnectCertificateRegistered
                (conditions[?type == 'ServiceReady']):
                  - status: 'True'
                    reason: ServiceReady
                (conditions[?type == 'Ready']):
                  - status: 'True'
                    reason: Ready
                (readyReplicas > `0`): true
                (addresses[0].value != null): true
                (addresses[0].value != ''): true
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                template:
                  spec:
                    (volumes[?name == 'konnect-cert']):
                      - secret:
                          secretName: ($cert_secret_name)
    - name: 7-Rotate-secret-in-place-and-assert-rollout
      description: |
        Same Secret name, brand new keypair -- the "cert-manager renewed it" scenario:
        nothing about the AIGatewayDataPlane spec or the Secret's name changes.
        Capturing the checksum, rotating, and asserting it changed must all happen within
        this one step: Chainsaw scopes a script's `outputs` to the step's own try: list,
        they are not visible from a separately-named step.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: DEPLOYMENT_NAME
                value: ($aigw_dp_name)
              - name: ANNOTATION_KEY
                value: konghq.com/aigw-dp-cert-checksum
            content: |
              bash ../../common/scripts/get_deployment_pod_annotation.sh
            outputs:
              - name: checksum_before
                value: (json_parse($stdout).value)
        - script:
            env:
              - name: HOSTNAME
                value: ($sni_hostname)
            content: |
              bash ../../common/scripts/generate_tls_certificate.sh
            outputs:
              - name: cert_data_v2
                value: (json_parse($stdout).cert)
              - name: key_data_v2
                value: (json_parse($stdout).key)
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: ($cert_secret_name)
                namespace: ($cert_secret_namespace)
                labels:
                  konghq.com/secret: "true"
              type: Opaque
              stringData:
                tls.crt: ($cert_data_v2)
                tls.key: ($key_data_v2)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: DEPLOYMENT_NAME
                value: ($aigw_dp_name)
              - name: ANNOTATION_KEY
                value: konghq.com/aigw-dp-cert-checksum
              - name: BEFORE_VALUE
                value: ($checksum_before)
            content: |
              bash ../../common/scripts/wait_for_deployment_pod_annotation_change.sh
        # Wait for the rollout to complete, so the Ready assertion below can't be
        # satisfied by the status from before the rollout started.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              (status.observedGeneration == metadata.generation): true
              (status.updatedReplicas == spec.replicas): true
              (status.readyReplicas == spec.replicas): true
              (status.replicas == spec.replicas): true
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                    reason: Ready
                (readyReplicas > `0`): true
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: aigateway-dataplane-manual-certificate-secret
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

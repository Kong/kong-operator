apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: gateway-certificate
  namespace: ($certificate_namespace)
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ($namespace)
  to:
    - group: configuration.konghq.com
      kind: KongCertificate
      name: serving

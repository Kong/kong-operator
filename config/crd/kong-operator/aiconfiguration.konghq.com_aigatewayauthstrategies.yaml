                            maxLength: 253
                            type: string
                          authorizationCookiePath:
                            description: The authorization cookie Path flag.
                            maxLength: 253
                            type: string
                          authorizationCookieSameSite:
                            description: |-
                              Controls whether a cookie is sent with cross-origin requests, providing some

                                  When false, allow the request to continue unauthenticated instead.
                                enum:
                                - Enabled
                                - Disabled
                                type: string
                            type: object
                          realm:
                            description: |-
                              When authentication fails the plugin sends `WWW-Authenticate` header with
                              `realm` attribute value.
                            maxLength: 253
                            type: string
                          runOnPreflight:
                            description: |-
                              A boolean value that indicates whether the plugin should run (and try to
                              authenticate) on `OPTIONS` preflight requests.
                              If set to `false`, then `OPTIONS` requests are always allowed.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                        type: object
                      displayName:
                        description: The display name for this auth strategy instance.
                        maxLength: 256
                        minLength: 1
                        type: string
                      labels:
                        additionalProperties:
                          description: PublicLabelsValue is the value type for PublicLabels.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$
                          type: string
                        description: |-
                          Public labels store information about an entity that can be used for

apiVersion: configuration.konghq.com/v1alpha1
kind: KongLicense
metadata:
  name: kong-license
enabled: true
rawLicenseString: |
  <paste your Kong license payload here>
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: OnPremAIGateway
metadata:
  name: ai-gw-cp-onprem-1
  namespace: default
spec: {}
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: AIGatewayDataPlane
metadata:
  name: ai-gw-dp-onprem-1
  namespace: default
spec:
  controlPlaneRef:
    type: onpremNamespacedRef
    onpremNamespacedRef:
      name: ai-gw-cp-onprem-1
---
kind: AIGatewayConsumer
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: ai-gw-consumer-1
  namespace: default
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ai-gw-cp-onprem-1
  apiSpec:
    name: dev-consumer
    displayName: Dev Team Consumer
    type: api-key
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-gw-consumer-1-credential-apikey
  namespace: default
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  api-key: sk-dev-consumer-xxxxxxxxxxxxxxxxxxxx
---
kind: AIGatewayConsumerCredential
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: ai-gw-consumer-credential-1
  namespace: default
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ai-gw-consumer-1
  apiSpec:
    name: dev-consumer-key
    displayName: Dev Consumer API Key
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ai-gw-consumer-1-credential-apikey
        key: api-key

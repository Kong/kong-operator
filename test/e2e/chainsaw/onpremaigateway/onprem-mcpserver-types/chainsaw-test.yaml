apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-mcpserver-types
spec:
  description: |
    Stands up an OnPremAIGateway and creates one AIGatewayMCPServer per supported
    apiSpec.type variant (conversion-only, upstream-server, passthrough-listener,
    listener, conversion-listener). Between them, the 5 variants' route matchers
    cover every field the route type used to be unable to express (paths and hosts
    and methods as multi-value lists, headers as a map of header name to list of
    values), with the conversion-listener variant combining all four at once - the
    exact shape from the original bug report. Mirrors the Konnect suite's
    `mcpserver-types` test.

    On-prem the Programmed assertions exercise the real on-prem render+push
    pipeline.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: mcp_conversion_only_name
      value: (join('-', [($test_name), 'mcp-conversion-only']))
    - name: mcp_upstream_server_name
      value: (join('-', [($test_name), 'mcp-upstream-server']))
    - name: mcp_passthrough_listener_name
      value: (join('-', [($test_name), 'mcp-passthrough-listener']))
    - name: mcp_listener_name
      value: (join('-', [($test_name), 'mcp-listener']))
    - name: mcp_conversion_listener_name
      value: (join('-', [($test_name), 'mcp-conversion-listener']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-aigateway-mcpservers
      description: |
        Apply all 5 apiSpec.type variants in one go. A route.paths/hosts/methods
        value that the operator can't marshal into the dbless document's route
        shape (the bug this test guards against) would leave every one of these
        stuck at Programmed=False.
      try:
        - apply:
            file: 01-aigatewaymcpservers.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-mcpservers-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_conversion_only_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_upstream_server_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_passthrough_listener_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_listener_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_conversion_listener_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-mcpserver-types
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

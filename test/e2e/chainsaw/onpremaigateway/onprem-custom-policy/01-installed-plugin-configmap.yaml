# Code of the plugin backing the "installed" AIGatewayCustomPolicy. An
# installed custom policy only carries the plugin schema in the payload; the
# data plane must load the plugin itself, so the AIGatewayDataPlane mounts
# this ConfigMap as kong/plugins/<name>/ on its Lua package path and enables
# it via KONG_PLUGINS (see the DP creation step).
# Required bindings:
#   - namespace: Namespace of the ConfigMap.
#   - installed_plugin_name: Plugin name; also the installed custom policy's
#     name (apiSpec.installed.name).
#   - plugin_schema_prefix / plugin_schema_suffix: The plugin schema around
#     its name, shared with the installed custom policy so the two always
#     match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ($installed_plugin_configmap)
  namespace: ($namespace)
data:
  handler.lua: |
    local InstalledPolicy = {
      PRIORITY = 1000,
      VERSION = "1.0.0",
    }

    function InstalledPolicy:header_filter(conf)
      kong.response.set_header(conf.header_name, conf.header_value)
    end

    return InstalledPolicy
  schema.lua: (join('', [$plugin_schema_prefix, $installed_plugin_name, $plugin_schema_suffix]))

apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayListener
metadata:
  name: listener
status:
  (conditions[?type == 'Programmed']):
    - status: "False"
      reason: GatewayNotFound
      message: (join('', ['The OnPremEventGateway ', $namespace, '/', $gateway_name, ' does not exist']))

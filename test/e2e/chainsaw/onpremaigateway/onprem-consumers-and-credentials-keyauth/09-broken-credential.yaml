# A third credential for the main consumer, whose apiKey Secret does NOT exist
# yet (10-broken-credential-secret.yaml creates it later).
#
# The credential cannot be translated, so it is left out of the consumer's
# rendered document. The translation reports the failure on THIS credential
# (Programmed=False, reason Invalid) instead of failing the consumer: the
# consumer keeps its healthy credentials, which the steps around this file
# assert (the healthy sibling stays Programmed, and its key still authenticates).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerCredential
metadata:
  name: ($broken_credential_name)
  namespace: ($namespace)
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ($consumer_name)
  apiSpec:
    name: ($broken_credential_name)
    displayName: ($broken_credential_name)
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ($broken_credential_secret_name)
        key: key

# Sample attaching an Event Gateway entity to an OnPremEventGateway.
#
# The Konnect controllers leave the listener alone. The OnPremEventGateway
# reconciler (--enable-controller-onpremeventgateway) pushes it to the gw-admin
# pods of the GWAdmin gw-admin: see onprem_eventgateway.yaml for one. Until
# that GWAdmin exists, the gateway reports GWAdminResolved False with reason
# NotFound, and the listener Programmed False with reason GatewayNotProgrammed.
apiVersion: eventgateway.konghq.com/v1alpha1
kind: OnPremEventGateway
metadata:
  name: event-gateway-onprem-1
  namespace: default
spec:
  gwAdminRef:
    name: gw-admin
---
kind: EventGatewayListener
apiVersion: configuration.konghq.com/v1alpha1
metadata:
  name: event-gateway-onprem-1-listener-1
  namespace: default
spec:
  apiSpec:
    name: event-gateway-onprem-1-listener-1
    addresses:
      - "0.0.0.0"
    ports:
      - 9092
  parentRef:
    group: eventgateway.konghq.com
    kind: OnPremEventGateway
    name: event-gateway-onprem-1

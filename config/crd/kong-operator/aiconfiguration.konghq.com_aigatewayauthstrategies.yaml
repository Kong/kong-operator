                                  maxLength: 253
                                  type: string
                                x5u:
                                  maxLength: 253
                                  type: string
                                "y":
                                  maxLength: 253
                                  type: string
                              type: object
                            type: array
                          clientSecret:
                            description: The client secret.
                            items:
                              description: |-
                                SensitiveDataSource holds a sensitive string value that can be provided

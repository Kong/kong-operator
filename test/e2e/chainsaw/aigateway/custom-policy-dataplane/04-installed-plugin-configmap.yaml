# Code of the plugin backing the "installed" AIGatewayCustomPolicy. An
# installed custom policy only registers the plugin schema in Konnect; the data
# plane must load the plugin itself, so the AIGatewayDataPlane mounts this
# ConfigMap as kong/plugins/<name>/ on its Lua package path and enables it via
# KONG_PLUGINS.
# Required bindings:
#   - namespace: Namespace of the ConfigMap (and the AIGatewayDataPlane).
#   - installed_plugin_configmap: Name of the ConfigMap.
#   - installed_konnect_name: Plugin name; also the installed custom policy's
#     Konnect name.
#   - plugin_schema_prefix, plugin_schema_suffix: The plugin schema around its
#     name, shared with the installed custom policy so the two always match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ($installed_plugin_configmap)
  namespace: ($namespace)
data:
  handler.lua: |
    local InstalledPolicy = {
      PRIORITY = 1000,
      VERSION = "1.0.0",
    }

    function InstalledPolicy:header_filter(conf)
      kong.response.set_header(conf.header_name, conf.header_value)
    end

    return InstalledPolicy
  schema.lua: (join('', [$plugin_schema_prefix, $installed_konnect_name, $plugin_schema_suffix]))

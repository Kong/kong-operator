# An AIGatewayConsumer (api-key, no group enrollment) and its
# AIGatewayConsumerCredential (api-key, key sourced from a Secret).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumer
metadata:
  name: ($consumer_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($consumer_name)
    displayName: ($consumer_name)
    type: api-key
---
apiVersion: v1
kind: Secret
metadata:
  name: ($credential_secret_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: ($api_key_value)
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerCredential
metadata:
  name: ($credential_name)
  namespace: ($namespace)
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ($consumer_name)
  apiSpec:
    name: ($credential_name)
    displayName: ($credential_name)
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ($credential_secret_name)
        key: key

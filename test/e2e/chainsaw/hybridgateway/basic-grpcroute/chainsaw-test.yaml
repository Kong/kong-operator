# Basic GRPCRoute test scenario.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: basic-grpcroute
spec:
  description: |
    This test validates that the hybrid gateway controller processes a GRPCRoute
    with a grpcbin backend. It covers:
    - GRPCRoute Accepted/ResolvedRefs/Programmed status on HTTP/HTTPS Gateway listeners.
    - Generated KongRoute protocols are grpc/grpcs rather than http/https.
    - Backend Service annotation validation applies to GRPCRoute.
    - End-to-end gRPC traffic works through the generated Gateway data plane.

  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_api_auth_namespace
      value: ($namespace)
    - name: sni_hostname
      value: (join('.', ['*', ($test_name), 'example.com']))
    - name: grpc_host
      value: (join('.', ['grpc', ($test_name), 'example.com']))
    - name: cert_secret_name
      value: test-tls-secret
    - name: cert_secret_namespace
      value: ($namespace)
    - name: listener_https_port
      value: 443
    - name: listener_http_port
      value: 80
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: gateway_image
      value: (env('GATEWAY_IMAGE'))
    - name: gateway_name
      value: (join('-', [($test_name), 'gateway']))
    - name: gateway_namespace
      value: ($namespace)
    - name: grpc_route_name
      value: (join('-', [($test_name), 'grpc-route']))
    - name: grpc_route_namespace
      value: ($namespace)
    - name: grpcbin_name
      value: (join('-', [($test_name), 'grpcbin']))
    - name: grpcbin_namespace
      value: ($namespace)
    - name: grpcbin_image
      value: 'kong/grpcbin:latest'
    - name: request_message
      value: kong
    - name: insecure_tls
      value: 'true'

  steps:
    - name: Create-tls-secret
      description: Create TLS Secret for the Gateway HTTPS listener.
      use:
        template: ../../common/_step_templates/apply-assert-tlsSecret.yaml

    - name: Create-auth-secret
      description: Create Secret with Konnect token for KonnectAPIAuthConfiguration.
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml

    - name: Create-konnect-api-auth
      description: Create KonnectAPIAuthConfiguration for the test.
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml

    - name: Create-gateway-configuration
      description: Create GatewayConfiguration for hybrid gateway.
      use:
        template: ../../common/_step_templates/apply-assert-gatewayConfiguration.yaml

    - name: Create-gateway-class
      description: Create GatewayClass.
      use:
        template: ../../common/_step_templates/apply-assert-gatewayClass.yaml

    - name: Create-gateway
      description: Create Gateway with HTTP and HTTPS listeners.
      use:
        template: ../../common/_step_templates/apply-assert-gateway.yaml

    - name: Assert-konnect-gateway-control-plane
      description: Assert that the KonnectGatewayControlPlane resource is synchronized.
      use:
        template: ../../common/_step_templates/assert-konnectGatewayControlPlane.yaml

    - name: Assert-kong-certificate
      description: Assert that the KongCertificate resource is created for the TLS secret.
      use:
        template: ../../common/_step_templates/assert-kongCertificate.yaml

    - name: Assert-kong-sni
      description: Assert that the KongSNI resource is created for the SNI hostname.
      use:
        template: ../../common/_step_templates/assert-kongSNI.yaml
      bindings:
        - name: resource_type
          value: "kongcertificates.configuration.konghq.com"

    - name: Create-grpcbin-backend
      description: Create grpcbin Deployment and Service.
      use:
        template: ../../common/_step_templates/apply-assert-grpcbinService.yaml

    - name: Create-grpcroute
      description: Create GRPCRoute to route traffic to grpcbin.
      try:
        - apply:
            file: 01-grpcRoute-grpcbin.yaml
        - assert:
            file: 02-grpcRoute-grpcbin-assert.yaml

    - name: Assert-kong-upstream
      description: Assert the generated KongUpstream is managed by the GRPCRoute.
      try:
        - script:
            env:
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
            content: |
              bash ../../common/scripts/konnectGatewayControlplane_name.sh
            outputs:
              - name: konnectgatewaycontrolplane_name
                value: (json_parse($stdout).cp_name)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE_TYPE
                value: kongupstreams.configuration.konghq.com
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
              - name: ROUTE_ANNOTATION_KEY
                value: gateway-operator.konghq.com/hybrid-routes-GRPCRoute
              - name: REQUIRED_CONDITION_TYPE
                value: Programmed
              - name: REQUIRED_CONDITION_STATUS
                value: "True"
            content: |
              bash ../../common/scripts/kongResource_name.sh
            outputs:
              - name: kong_upstream_name
                value: (json_parse($stdout).name)
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongUpstream
              metadata:
                name: ($kong_upstream_name)
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by" == 'GRPCRoute'): true
                (contains(annotations."gateway-operator.konghq.com/hybrid-routes-GRPCRoute" || '', join('/', [($grpc_route_namespace), ($grpc_route_name)]))): true
                (annotations."gateway-operator.konghq.com/hybrid-gateways" == join('/', [($gateway_namespace), ($gateway_name)])): true
              spec:
                controlPlaneRef:
                  type: konnectNamespacedRef
                  konnectNamespacedRef:
                    name: ($konnectgatewaycontrolplane_name)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    reason: Programmed
                (conditions[?type == 'ControlPlaneRefValid']):
                  - status: 'True'
                    reason: Valid
                (conditions[?type == 'APIAuthResolvedRef']):
                  - status: 'True'
                    reason: ResolvedRef
                (conditions[?type == 'APIAuthValid']):
                  - status: 'True'
                    reason: Valid

    - name: Assert-kong-target
      description: Assert the generated KongTarget is managed by the GRPCRoute.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE_TYPE
                value: kongupstreams.configuration.konghq.com
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
              - name: ROUTE_ANNOTATION_KEY
                value: gateway-operator.konghq.com/hybrid-routes-GRPCRoute
              - name: REQUIRED_CONDITION_TYPE
                value: Programmed
              - name: REQUIRED_CONDITION_STATUS
                value: "True"
            content: |
              bash ../../common/scripts/kongResource_name.sh
            outputs:
              - name: kong_upstream_name
                value: (json_parse($stdout).name)
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongTarget
              metadata:
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by" == 'GRPCRoute'): true
                (contains(annotations."gateway-operator.konghq.com/hybrid-routes-GRPCRoute" || '', join('/', [($grpc_route_namespace), ($grpc_route_name)]))): true
                (annotations."gateway-operator.konghq.com/hybrid-gateways" == join('/', [($gateway_namespace), ($gateway_name)])): true
              spec:
                weight: 1
                upstreamRef:
                  name: ($kong_upstream_name)
                (target != null): true
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    reason: Programmed
                (conditions[?type == 'KongUpstreamRefValid']):
                  - status: 'True'
                    reason: Valid
                (conditions[?type == 'ControlPlaneRefValid']):
                  - status: 'True'
                    reason: Valid
                (conditions[?type == 'APIAuthResolvedRef']):
                  - status: 'True'
                    reason: ResolvedRef
                (conditions[?type == 'APIAuthValid']):
                  - status: 'True'
                    reason: Valid

    - name: Assert-kong-service
      description: Assert the generated KongService is managed by the GRPCRoute.
      try:
        - script:
            env:
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
            content: |
              bash ../../common/scripts/konnectGatewayControlplane_name.sh
            outputs:
              - name: konnectgatewaycontrolplane_name
                value: (json_parse($stdout).cp_name)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE_TYPE
                value: kongservices.configuration.konghq.com
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
              - name: ROUTE_ANNOTATION_KEY
                value: gateway-operator.konghq.com/hybrid-routes-GRPCRoute
              - name: REQUIRED_CONDITION_TYPE
                value: Programmed
              - name: REQUIRED_CONDITION_STATUS
                value: "True"
            content: |
              bash ../../common/scripts/kongResource_name.sh
            outputs:
              - name: kong_service_name
                value: (json_parse($stdout).name)
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongService
              metadata:
                name: ($kong_service_name)
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by" == 'GRPCRoute'): true
                (contains(annotations."gateway-operator.konghq.com/hybrid-routes-GRPCRoute" || '', join('/', [($grpc_route_namespace), ($grpc_route_name)]))): true
                (annotations."gateway-operator.konghq.com/hybrid-gateways" == join('/', [($gateway_namespace), ($gateway_name)])): true
              spec:
                protocol: grpc
                controlPlaneRef:
                  type: konnectNamespacedRef
                  konnectNamespacedRef:
                    name: ($konnectgatewaycontrolplane_name)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    reason: Programmed
                (conditions[?type == 'ControlPlaneRefValid']):
                  - status: 'True'
                    reason: Valid
                (conditions[?type == 'APIAuthResolvedRef']):
                  - status: 'True'
                    reason: ResolvedRef
                (conditions[?type == 'APIAuthValid']):
                  - status: 'True'
                    reason: Valid

    - name: Assert-kong-route-grpc-protocols
      description: Assert the generated KongRoute uses grpc/grpcs protocols.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE_TYPE
                value: kongservices.configuration.konghq.com
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
              - name: ROUTE_ANNOTATION_KEY
                value: gateway-operator.konghq.com/hybrid-routes-GRPCRoute
              - name: REQUIRED_CONDITION_TYPE
                value: Programmed
              - name: REQUIRED_CONDITION_STATUS
                value: "True"
            content: |
              bash ../../common/scripts/kongResource_name.sh
            outputs:
              - name: kong_service_name
                value: (json_parse($stdout).name)
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: RESOURCE_TYPE
                value: kongroutes.configuration.konghq.com
              - name: GATEWAY_NAME
                value: ($gateway_name)
              - name: GATEWAY_NAMESPACE
                value: ($gateway_namespace)
              - name: HTTP_ROUTE_NAME
                value: ($grpc_route_name)
              - name: HTTP_ROUTE_NAMESPACE
                value: ($grpc_route_namespace)
              - name: ROUTE_ANNOTATION_KEY
                value: gateway-operator.konghq.com/hybrid-routes-GRPCRoute
              - name: EXPECTED_SERVICE_NAME
                value: ($kong_service_name)
              - name: REQUIRED_CONDITION_TYPE
                value: Programmed
              - name: REQUIRED_CONDITION_STATUS
                value: "True"
            content: |
              bash ../../common/scripts/kongResource_name.sh
            outputs:
              - name: kong_route_name
                value: (json_parse($stdout).name)
        - assert:
            resource:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongRoute
              metadata:
                name: ($kong_route_name)
                namespace: ($namespace)
                (labels."gateway-operator.konghq.com/managed-by" == 'GRPCRoute'): true
                (contains(annotations."gateway-operator.konghq.com/hybrid-routes-GRPCRoute" || '', join('/', [($grpc_route_namespace), ($grpc_route_name)]))): true
                (annotations."gateway-operator.konghq.com/hybrid-gateways" == join('/', [($gateway_namespace), ($gateway_name)])): true
              spec:
                hosts:
                  - ($grpc_host)
                paths:
                  - "~/grpcbin\\.GRPCBin/DummyUnary$"
                protocols:
                  - grpc
                  - grpcs
                serviceRef:
                  namespacedRef:
                    name: ($kong_service_name)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                    reason: Programmed
                (conditions[?type == 'KongServiceRefValid']):
                  - status: 'True'
                    reason: Valid

    - name: Verify-grpc-traffic
      description: Verify end-to-end gRPC traffic through the hybrid Gateway.
      use:
        template: ../../common/_step_templates/verify-grpc-traffic-from-host.yaml
      bindings:
        - name: grpc_host
          value: ($grpc_host)
        - name: request_message
          value: ($request_message)
        - name: insecure_tls
          value: ($insecure_tls)

  catch:
    - description: Capture debug snapshot
      script:
        env:
          - name: TEST_NAME
            value: hybridgateway-basic-grpcroute
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

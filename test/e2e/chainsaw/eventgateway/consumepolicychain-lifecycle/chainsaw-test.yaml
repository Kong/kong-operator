apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: eventgateway-consumepolicychain-lifecycle
spec:
  description: |
    Verify complete nested Consume ordering with two schemaValidation groups,
    sibling modifyHeaders, decryptFields and skipRecord children, and roots.
    Cover group movement, drift, invalid grouping, missing/unready refs, real
    recreation, full-set blocking, independent cluster/Produce/Consume claims,
    handover, empty scope and unauthenticated retained deletion.
    Management-plane only: no Kafka, on-prem, deeper nesting or atomic GET/PUT.
  timeouts:
    exec: 900s
    cleanup: 300s
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [$test_name, 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [$test_name, 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: keg_cp_name
      value: (join('-', [$test_name, 'keg']))
    - name: backend_cluster_name
      value: chain-backend
    - name: virtual_cluster_name
      value: chain-vc
    - name: dns_label
      value: consumechainvc
  steps:
    - name: Register-scoped-cleanup-before-creation
      try:
        - script:
            env:
              - name: KONNECT_TOKEN
                value: ($konnect_token)
            content: |
              test -n "${KONNECT_TOKEN:?KONNECT_TOKEN must be set}"
      cleanup:
        - script:
            env: &chain_env
              - name: NAMESPACE
                value: ($namespace)
              - name: GATEWAY_NAME
                value: ($keg_cp_name)
              - name: TEST_NAME
                value: ($test_name)
              - name: AUTH_NAME
                value: ($konnect_auth_name)
              - name: AUTH_SECRET_NAME
                value: ($auth_secret_name)
              - name: VIRTUAL_CLUSTER_NAME
                value: ($virtual_cluster_name)
              - name: KONNECT_TOKEN
                value: ($konnect_token)
              - name: KONNECT_URL
                value: ($konnect_url)
            content: |
              bash scripts/cleanup.sh
    - name: Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: Create-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: Create-dedicated-gateway
      use:
        template: ../../common/_step_templates/apply-assert-konnectEventGateway.yaml
    - name: Create-backend
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayBackendCluster.yaml
    - name: Create-virtual-cluster
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayVirtualCluster.yaml
    - name: Create-empty-virtual-cluster
      bindings:
        - name: virtual_cluster_name
          value: empty-vc
        - name: dns_label
          value: emptyconsumevc
      use:
        template: ../../common/_step_templates/apply-assert-eventGatewayVirtualCluster.yaml
    - name: Complete-nested-Consume-lifecycle
      try:
        - script:
            env: *chain_env
            content: |
              bash scripts/chain.sh

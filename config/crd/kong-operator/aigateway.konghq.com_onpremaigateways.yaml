---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    kubernetes-configuration.konghq.com/channels: kong-operator
    kubernetes-configuration.konghq.com/version: v2.4.0-rapid.2.0
  name: onpremaigateways.aigateway.konghq.com
spec:
  group: aigateway.konghq.com
  names:
    categories:
    - kong
    kind: OnPremAIGateway
    listKind: OnPremAIGatewayList
    plural: onpremaigateways
    shortNames:
    - onpremaigw
    singular: onpremaigateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The Resource is ready
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OnPremAIGateway is the Schema for the on-prem AI Gateway control planes API.
          It acts as the non-Konnect control plane for AIGatewayDataPlane: it does not
          own any Deployment or Pod itself, it aggregates configuration targeting it
          and pushes it to the data planes that reference it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of OnPremAIGateway.
            properties:
              dataplaneSync:
                description: |-
                  DataPlaneSync defines the configuration for syncing configuration
                  to the data planes referencing this OnPremAIGateway.
                properties:
                  intervalSeconds:
                    description: |-
                      IntervalSeconds is the interval between two rounds of syncing configuration
                      with data planes, in seconds.
                      If not specified, the default interval as defined by the operator will be used.
                    format: int32
                    minimum: 0
                    type: integer
                  timeoutSeconds:
                    description: |-
                      TimeoutSeconds is the timeout of a single run of syncing configuration with
                      data planes, in seconds.
                      If not specified, no timeout is applied to a sync run.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              objectFilters:
                description: ObjectFilters defines the filters to limit watched objects
                  by the controllers.
                properties:
                  secrets:
                    description: Secrets defines the filters for watched secrets.
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          MatchLabels defines the labels that the object must match to get reconciled by the controller for the OnPremAIGateway.
                          For example, if `secrets.matchLabels` is `{"label1":"val1","label2":"val2"}`,
                          only secrets with labels `label1=val1` and `label2=val2` are reconciled.
                        maxProperties: 8
                        type: object
                        x-kubernetes-validations:
                        - message: Minimum length of key in matchLabels is 1
                          rule: self.all(key,key.size() >= 1)
                        - message: Maximum length of value in matchLabels is 63
                          rule: self.all(key,self[key].size() <= 63)
                    type: object
                type: object
              watchNamespaces:
                default:
                  type: own
                description: |-
                  WatchNamespaces defines the namespaces the controllers watch for the
                  configuration entities pushed to this gateway's data planes, and for the
                  Secrets they reference.

                  When unset, only the OnPremAIGateway's own namespace is watched.
                  When set to `list`, every listed namespace plus the OnPremAIGateway's own
                  namespace is watched. A WatchNamespaceGrant is required in every listed
                  namespace that is not the OnPremAIGateway's own.
                  When set to `all`, every namespace is watched. This requires the operator
                  to run with an empty `--watch-namespaces`, that is, cluster-wide.

                  Changing this field restarts the control plane instance: its caches are
                  built at start.
                properties:
                  list:
                    description: |-
                      List is a list of namespaces to watch for resources.
                      Only used when Type is set to List.
                    items:
                      maxLength: 64
                      type: string
                    maxItems: 64
                    type: array
                  type:
                    description: Type indicates the type of namespace watching to
                      be done.
                    enum:
                    - all
                    - list
                    - own
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: list is required when type is 'list'
                  rule: 'self.type == ''list'' ? has(self.list) : true'
                - message: list must not be specified when type is not 'list'
                  rule: 'self.type != ''list'' ? !has(self.list) : true'
            type: object
          status:
            description: Status defines the observed state of OnPremAIGateway.
            properties:
              conditions:
                default:
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: Ready
                description: Conditions describe the status of the OnPremAIGateway.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configHash:
                description: |-
                  ConfigHash is the hash of the configuration that was last pushed to the
                  data planes referencing this OnPremAIGateway.
                maxLength: 64
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

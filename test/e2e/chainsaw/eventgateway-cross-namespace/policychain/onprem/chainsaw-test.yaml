      description: "[N, its name] Another chain of the virtual cluster can't claim it: it names the owner with its namespace."
      use:
        template: ../../_step_templates/assert-condition-message.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayVirtualClusterPolicyChain
        - name: object_name
          value: chain-vc-n
        - name: object_namespace
          value: ($namespace)
        - name: condition_type
          value: PolicyChainOwnerValid
        - name: condition_status
          value: "False"
        - name: condition_reason
          value: ConflictingChain
        - name: message_part
          value: (join('/', [$referrer_namespace, 'chain-vc-n']))
    - name: 122-create-witness-5
      description: "[N, its name] Create witness-5, a backend cluster of the gateway used as a witness: it is programmed only once a push including it succeeds."
      use:
        template: ../../_step_templates/apply-eventGatewayBackendCluster.yaml
      bindings:
        - name: backend_cluster_name
          value: witness-5
        - name: backend_cluster_namespace
          value: ($namespace)
        - name: gateway_ref_namespace
          value: (`null`)
    - name: 123-assert-vc-n-gateway-not-held-back
      description: "[N, its name] The conflicting EventGatewayVirtualClusterPolicyChain is only left out. witness-5, created after it, is pushed."
      use:
        template: ../../_step_templates/assert-condition.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayBackendCluster
        - name: object_name
          value: witness-5
        - name: object_namespace
          value: ($namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "True"
        - name: condition_reason
          value: Programmed
    - name: 124-delete-witness-5
      description: "[N, its name] Delete witness-5."
      use:
        template: ../../_step_templates/delete-and-wait.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayBackendCluster
        - name: object_name
          value: witness-5
        - name: object_namespace
          value: ($namespace)
    - name: 125-assert-vc-n-first-kept
      description: "[N, its name] The first EventGatewayVirtualClusterPolicyChain keeps its name."
      use:
        template: ../../_step_templates/assert-condition.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayVirtualClusterPolicyChain
        - name: object_name
          value: chain-vc-n
        - name: object_namespace
          value: ($referrer_namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "True"
        - name: condition_reason
          value: Programmed
    - name: 126-delete-vc-n-conflicting
      description: "[N, its name] Delete the conflicting EventGatewayVirtualClusterPolicyChain."
      use:
        template: ../../_step_templates/delete-and-wait.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayVirtualClusterPolicyChain
        - name: object_name
          value: chain-vc-n
        - name: object_namespace
          value: ($namespace)

  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: ($test.metadata.name)
          - name: NAMESPACE
            value: ($namespace)
          - name: ADDITIONAL_NAMESPACES
            value: (join(',', [$referrer_namespace, $target_namespace, $third_namespace]))
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../../common/scripts/debug_snapshot.sh

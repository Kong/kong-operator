name: verify

on:
  workflow_call: {}

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  MISE_VERBOSE: 1
  MISE_DEBUG: 1

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.GHA_EXTENDED_TIMEOUT_MINUTES || 20) }}
    env:
      ACK_CRD_BREAKING_CHANGE_LABEL: ack_crd_breaking_change
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go-fix
            make-target: verify.go-fix
            fetch_depth: 1
          - name: manifests
            make-target: verify.manifests
            fetch_depth: 1
          - name: generators
            make-target: verify.generators
            fetch_depth: 1
          - name: crd-breaking-changes
            make-target: verify.crd-breaking-changes
            fetch_depth: 0
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ matrix.fetch_depth }}

    - name: Setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - uses: ./.github/actions/setup-mise
      with:
        install: false

    - run: |
        {
          echo "GO_MOD_CACHE=$(go env GOMODCACHE)"
          echo "GO_BUILD_CACHE=$(go env GOCACHE)"
        } >> $GITHUB_ENV

    # Restore-only, reusing the shared `go-build-*` cache written by the `build` job in
    # tests.yaml. We never save here to avoid creating additional caches.
    - name: Restore go build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.GO_MOD_CACHE }}
          ${{ env.GO_BUILD_CACHE }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-go-

    - name: Check CRD breaking-change acknowledgement
      if: ${{ matrix.name == 'crd-breaking-changes' && github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      run: |
        set -euo pipefail

        # A CRD breaking change is acknowledged by adding the label to the PR. This check
        # only runs for pull_request events, so there is always a single PR to inspect.
        ack="false"
        if [[ -n "${PULL_REQUEST_NUMBER}" ]]; then
          ack="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/labels" \
            --jq 'any(.[].name; . == env.ACK_CRD_BREAKING_CHANGE_LABEL)')"
        fi

        echo "ACK_CRD_BREAKING_CHANGE=${ack}" >> "${GITHUB_ENV}"

    # Minted before the check runs: a failing check must still post its comment. Mint the
    # token in the job that uses it, because app tokens do not survive being passed between
    # jobs or through reusable-workflow boundaries.
    - name: Mint token to comment on the pull request
      if: ${{ matrix.name == 'crd-breaking-changes' && github.event_name == 'pull_request' }}
      id: app-token
      # Fork pull requests get no secrets, and a missing App permission must not block the
      # check itself.
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
        private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: |
          kong-operator
        permission-pull-requests: write

    # The CRD breaking-change check compares against a PR base and is acknowledged via a PR
    # label, so it can only run in a pull_request context. There is no way to acknowledge a
    # breaking change on a bare commit (push/merge_group), so skip it outside of PRs.
    - if: ${{ matrix.name != 'crd-breaking-changes' || github.event_name == 'pull_request' }}
      id: verify
      env:
        MAKE_TARGET: ${{ matrix.make-target }}
        CRD_BREAKING_CHANGES_REPORT: ${{ runner.temp }}/crd-breaking-changes.md
      run: make "$MAKE_TARGET"

    # Keeps at most one comment: the existing one is edited when it is already there, so a
    # fixed breaking change does not leave a stale comment behind. The body comes from a
    # script, so it can be reviewed locally before the workflow runs.
    - name: Comment CRD breaking changes
      if: ${{ !cancelled() && matrix.name == 'crd-breaking-changes' && github.event_name == 'pull_request' && steps.app-token.outputs.token != '' }}
      # The comment is a convenience, so it must never change the result of the check.
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        REPORT_FILE: ${{ runner.temp }}/crd-breaking-changes.md
        CRD_BREAKING_CHANGES_BASE_REF: ${{ github.base_ref }}
        CRD_BREAKING_CHANGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        # Without a report, a failed check comes from something other than a breaking change
        # (a missing tool, a bad base revision), and the old comment must stay as it is.
        if [[ ! -s "${REPORT_FILE}" && "${VERIFY_OUTCOME}" != "success" ]]; then
          echo "The CRD check did not complete. Leaving any existing comment as it is."
          exit 0
        fi

        body_file="${RUNNER_TEMP}/crd-breaking-changes-comment.md"
        ./scripts/crd-breaking-changes-comment.sh "${REPORT_FILE}" > "${body_file}"

        # The first line of the body is a marker, used to find the comment that this job owns.
        marker="$(head -n 1 "${body_file}")"
        comment_id="$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100" \
          | jq -s --arg marker "${marker}" '[.[][] | select(.body | contains($marker))][0].id // empty')"

        if [[ -n "${comment_id}" ]]; then
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -f body="$(cat "${body_file}")"
        elif [[ -s "${REPORT_FILE}" ]]; then
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" \
            -f body="$(cat "${body_file}")"
        fi

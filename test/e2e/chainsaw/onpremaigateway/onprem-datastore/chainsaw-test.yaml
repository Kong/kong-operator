apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-datastore
spec:
  description: |
    A datastore (a shared Redis connection) is rendered into the on-prem document
    as a top-level entity, and the Model and Policy that reference it resolve the
    reference to the datastore's entity name.

    The operator pushes the gateway's whole configuration in one POST /config, so a
    shape the data plane rejects leaves every entity on the gateway with
    Programmed=False, not just this one: the assertions on the datastore, the
    policy and the model together prove the rendered `datastores` collection and
    the references to it are accepted.

    No traffic is driven: serving a rate-limited request needs a reachable Redis,
    which is out of scope for a config push test.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: datastore_name
      value: (join('-', [($test_name), 'redis']))
    - name: datastore_credentials_name
      value: (join('-', [($datastore_name), 'credentials']))
    - name: model_name
      value: (join('-', [($test_name), 'model']))
    - name: policy_name
      value: (join('-', [($test_name), 'policy']))
    - name: provider_name
      value: (join('-', [($test_name), 'provider']))
    - name: provider_credentials_name
      value: (join('-', [($provider_name), 'credentials']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-datastore-and-referrers
      try:
        - apply:
            file: 01-datastore-and-referrers.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-datastore-and-referrers-pushed-to-dataplane
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayDatastore
              metadata:
                name: ($datastore_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayPolicy
              metadata:
                name: ($policy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-datastore
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

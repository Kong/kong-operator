# The Secrets only Kong Operator uses live in the operator namespace, named
# after the UID of the GWAdmin: no owner reference can cross namespaces, so
# they are labeled with it instead. The published cp client CA is one of
# them: its key never lands in the GWAdmin namespace.
apiVersion: v1
kind: Secret
metadata:
  name: (join('-', ['gwadmin', $uid, 'api-ca']))
  namespace: kong-system
  labels:
    gateway.konghq.com/secret-provisioning: automatic
    gateway-operator.konghq.com/gwadmin-uid: ($uid)
    gateway-operator.konghq.com/managed-by-name: ($gwadmin_name)
    gateway-operator.konghq.com/managed-by-namespace: ($namespace)
  (length(ownerReferences || `[]`)): 0
type: kubernetes.io/tls
---
apiVersion: v1
kind: Secret
metadata:
  name: (join('-', ['gwadmin', $uid, 'cp-server-ca']))
  namespace: kong-system
  labels:
    gateway.konghq.com/secret-provisioning: automatic
    gateway-operator.konghq.com/gwadmin-uid: ($uid)
    gateway-operator.konghq.com/managed-by-name: ($gwadmin_name)
    gateway-operator.konghq.com/managed-by-namespace: ($namespace)
  (length(ownerReferences || `[]`)): 0
type: kubernetes.io/tls
---
apiVersion: v1
kind: Secret
metadata:
  name: (join('-', ['gwadmin', $uid, 'operator-client-tls']))
  namespace: kong-system
  labels:
    gateway.konghq.com/secret-provisioning: automatic
    gateway-operator.konghq.com/gwadmin-uid: ($uid)
    gateway-operator.konghq.com/managed-by-name: ($gwadmin_name)
    gateway-operator.konghq.com/managed-by-namespace: ($namespace)

# Changing the cross-namespace Secret must render and push the policy again.
apiVersion: v1
kind: Secret
metadata:
  name: ($policy_secret_name)
  namespace: ($secrets_namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  config: |
    add:
      headers:
        - "Modified-By-Cross-Namespace-Secret-Updated:Kong-Operator-Chainsaw-Test"

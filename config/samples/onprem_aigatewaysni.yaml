kind: AIGatewayCertificate
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: ai-gw-serving-cert
  namespace: default
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ai-gw-cp-onprem-1
  apiSpec:
    # Name of the certificate. The name must be unique within the AI Gateway.
    name: ai-gw-serving-cert
    cert:
      type: secretRef
      secretRef:
        name: ai-gw-serving-cert
        key: tls.crt
    key:
      type: secretRef
      secretRef:
        name: ai-gw-serving-cert
        key: tls.key
---
kind: AIGatewaySNI
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: ai-gw-sni-1
  namespace: default
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ai-gw-cp-onprem-1
  apiSpec:
    # Name of the SNI. The name must be unique within the AI Gateway.
    name: ai-gw-sni-1
    displayName: AI Gateway SNI
    hostname: api.example.com
    certificate:
      name: ai-gw-serving-cert

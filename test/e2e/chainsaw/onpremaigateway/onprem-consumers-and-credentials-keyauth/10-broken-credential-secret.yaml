# The Secret 09-broken-credential.yaml references. Creating it repairs that
# credential: the credential's own Secret watch re-renders the consumer, the
# credential is embedded again and reports Programmed=True, and its api key
# authenticates.
apiVersion: v1
kind: Secret
metadata:
  name: ($broken_credential_secret_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: ($broken_api_key_value)

---
name: KSAI

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

jobs:
  ksai:
    name: run
    uses: Kong/ksai-public/.github/workflows/ksai.yml@d9e32d87b8127f8088bcaf015ecf55f35e877f6e # v5.0.5
    permissions:
      contents: read   # checked out by every command; a push uses the token CP mints
      id-token: write  # mint the GitHub OIDC token for the Kong gateway

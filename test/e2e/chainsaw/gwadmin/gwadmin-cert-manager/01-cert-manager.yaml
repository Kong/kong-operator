# The CA of the GWAdmin. Changing its subject makes cert-manager reissue it
# with a new key (rotationPolicy: Always).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gw-cm-user-ca
spec:
  isCA: true
  commonName: gw-cm-user-ca
  subject:
    organizations:
      - ($ca_organization)
  secretName: gw-cm-user-ca
  secretTemplate:
    labels:
      konghq.com/secret: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: public
spec:
  ca:
    secretName: public-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cp-cert
spec:
  secretName: cp-cert
  secretTemplate:
    labels:
      konghq.com/secret: "true"
  dnsNames:
    - (join('', [($gwadmin_name), '-cp.', ($namespace), '.svc']))
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: Issuer
    name: public

# It sets up an `/echo` HTTPRoute secured with an ACL plugin, allowing only consumers belonging to the `acl-group-1` ACL group (`consumer1`) to access it.
# Group membership comes from an `acl` credential on the KongConsumer. See
# gateway-acl-key-auth-consumer-groups.yaml for the same result with a KongConsumerGroup.
#
# Verify with:
#   ADDR=$(kubectl get gateway example-acl-credentials -o jsonpath='{.status.addresses[0].value}')
#   curl -H 'apikey: password1' http://$ADDR/echo     # 200, consumer1 is in acl-group-1
#   curl -H 'apikey: password2' http://$ADDR/echo     # 403, consumer2 is not
#   curl -H 'apikey: password2' http://$ADDR/httpbin  # 200, no ACL on this route
---
apiVersion: gateway-operator.konghq.com/v2beta1
kind: GatewayConfiguration
metadata:
  name: example-acl-credentials
  namespace: default
spec:
  dataPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
          - name: proxy
            # renovate: datasource=docker versioning=docker
            image: kong/kong-gateway:3.16
            readinessProbe:
              initialDelaySeconds: 1
              periodSeconds: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example-acl-credentials
spec:
  controllerName: konghq.com/gateway-operator
  parametersRef:
    group: gateway-operator.konghq.com
    kind: GatewayConfiguration
    name: example-acl-credentials
    namespace: default
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-acl-credentials
spec:
  gatewayClassName: example-acl-credentials
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acl-credentials-echo
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: acl-credentials-key-auth,acl-credentials-group-1
spec:
  parentRefs:
  - name: example-acl-credentials
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /echo
    backendRefs:
    - name: acl-credentials-echo
      kind: Service
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acl-credentials-httpbin
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: acl-credentials-key-auth
spec:
  parentRefs:
  - name: example-acl-credentials
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /httpbin
    backendRefs:
    - name: acl-credentials-httpbin
      kind: Service
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acl-credentials-echo
  labels:
    app: acl-credentials-echo
spec:
  selector:
    matchLabels:
      app: acl-credentials-echo
  template:
    metadata:
      labels:
        app: acl-credentials-echo
    spec:
      containers:
      - name: echo
        image: kong/go-echo:0.5.0
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
        - containerPort: 1027
        resources:
          limits:
            memory: "64Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: acl-credentials-echo
  name: acl-credentials-echo
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 1027
  selector:
    app: acl-credentials-echo
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acl-credentials-httpbin
  labels:
    app: acl-credentials-httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acl-credentials-httpbin
  template:
    metadata:
      labels:
        app: acl-credentials-httpbin
    spec:
      containers:
      - name: httpbin
        image: kong/httpbin:0.2.1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: acl-credentials-httpbin
  name: acl-credentials-httpbin
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: acl-credentials-httpbin
  type: ClusterIP
---
# The `konghq.com/secret` label is required on credential Secrets: the operator
# runs the ControlPlane with `--secret-label-selector=konghq.com/secret`, so
# unlabelled Secrets are never ingested.
apiVersion: v1
kind: Secret
metadata:
  name: acl-credentials-consumer1-acl
  labels:
    konghq.com/credential: acl
    konghq.com/secret: "true"
stringData:
  group: acl-group-1
---
apiVersion: v1
kind: Secret
metadata:
  name: acl-credentials-consumer1-key
  labels:
    konghq.com/credential: key-auth
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: password1
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: acl-credentials-consumer1
  annotations:
    kubernetes.io/ingress.class: kong
username: acl-credentials-consumer1
credentials:
- acl-credentials-consumer1-key
- acl-credentials-consumer1-acl
---
apiVersion: v1
kind: Secret
metadata:
  name: acl-credentials-consumer2-key
  labels:
    konghq.com/credential: key-auth
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: password2
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: acl-credentials-consumer2
  annotations:
    kubernetes.io/ingress.class: kong
username: acl-credentials-consumer2
credentials:
- acl-credentials-consumer2-key
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acl-credentials-key-auth
plugin: key-auth
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acl-credentials-group-1
plugin: acl
config:
  allow:
  - acl-group-1

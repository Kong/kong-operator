apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-auth-strategy-openid-connect
spec:
  description: |
    Dedicated coverage for the openid-connect AIGatewayAuthStrategy: stands up a Konnect
    AIGateway control plane, an openid-connect AIGatewayAuthStrategy pointed at a mock
    OIDC provider deployed into this test's own namespace (00-oidc-mock.yaml, not part of the
    shared aigateway fixtures, since the secret-revocation scenario below needs to mutate it
    freely), an AIGatewayConsumer + a real access token obtained from the mock's
    client_credentials grant (no consumer group/ACL involved), and an AIGatewayAgent route
    (backed by the shared go-echo backend) with unrestricted access. Verifies the auth
    strategy actually validates Bearer tokens end-to-end against a real in-cluster
    AIGatewayDataPlane. See consumers-and-credentials-openid-connect for the exhaustive
    AIGatewayConsumer/ACL-by-group/secret-rotation coverage built on top of this:
      1. Requests without an Authorization header are rejected (401).
      2. Requests with an invalid Bearer token are rejected (401).
      3. A real access token obtained from the mock OIDC provider's client_credentials
         grant succeeds (200).
      4. After the client secret is revoked, the same request is rejected again (401).
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    - name: oidc_auth_strategy_name
      value: (join('-', [($test_name), 'oidc-auth-strategy']))
    - name: oidc_client_secret_name
      value: (join('-', [($test_name), 'oidc-client-secret']))
    - name: oidc_issuer
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/.well-known/openid-configuration']))
    - name: oidc_token_url
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/connect/token']))
    - name: oidc_client_id
      value: aigateway-oidc-client
    - name: oidc_client_secret_value
      value: aigateway-oidc-client-secret
    - name: oidc_scope
      value: aigateway-scope
    - name: consumer_name
      value: (join('-', [($test_name), 'consumer']))
    - name: consumer_type
      value: oauth
    - name: custom_id
      value: ($oidc_client_id)
    - name: http_agent_name
      value: (join('-', [($test_name), 'http-agent']))
    - name: http_agent_route_path
      value: /http-agent
    # Defaults for verify-aigw-agent-request-from-{cluster,host} optional bindings.
    # Steps below only need to override what differs from these.
    # NOTE: oidc_token_url/oidc_client_id/oidc_scope are NOT defaulted here since
    # they're already bound above (to real values used by the auth strategy
    # setup step) and cascade automatically; the reject-* steps below must
    # explicitly override them to '' to disable auto bearer-token fetching.
    - name: request_headers
      value: ''
    - name: request_body
      value: ''
    - name: content_type
      value: application/json
    - name: expected_status
      value: "200"
    - name: expected_status_not
      value: ''
    - name: expected_body
      value: ''
    - name: unexpected_body
      value: ''
    - name: expected_jsonrpc
      value: ''
    - name: expected_json_id
      value: ''
    - name: expected_json_result_text
      value: ''
    - name: oidc_client_secret
      value: ''
    - name: expected_success
      value: 'true'
  steps:
    - name: 1-Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: 2-Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: 3-Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: 4-Create-oidc-mock
      try:
        - apply:
            file: 00-oidc-mock.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
    - name: 5-Create-oidc-auth-strategy
      bindings:
        - name: auth_strategy_name
          value: ($oidc_auth_strategy_name)
        - name: namespace
          value: ($namespace)
        - name: issuer
          value: ($oidc_issuer)
        - name: client_id
          value: ($oidc_client_id)
        - name: client_secret_name
          value: ($oidc_client_secret_name)
        - name: client_secret_value
          value: ($oidc_client_secret_value)
        - name: cache_tokens_salt
          value: (join('-', [($test_name), 'cache-salt']))
        - name: auth_methods
          value: []
        - name: scopes
          value:
            - ($oidc_scope)
        - name: consumer_optional
          value: Disabled
        - name: consumer_claims
          value:
            - - client_id
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayAuthStrategy-openid-connect.yaml
    - name: 6-Create-consumer
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayConsumer.yaml
      bindings:
        - name: consumer_groups
          value: []
    - name: 7-Start-echo-agent-backend
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
    - name: 8-Create-aigateway-agent
      bindings:
        - name: agent_access
          value:
            authStrategies:
              - name: ($oidc_auth_strategy_name)
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayAgent-http.yaml
    - name: 9-Create-aigateway-dataplane
      bindings:
        - name: namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
    - name: 10-Reject-request-without-bearer-token-from-cluster
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_status
          value: "401"
        - name: oidc_token_url
          value: ''
        - name: oidc_client_id
          value: ''
        - name: oidc_scope
          value: ''
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    - name: 11-Reject-request-without-bearer-token-from-host
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_status
          value: "401"
        - name: oidc_token_url
          value: ''
        - name: oidc_client_id
          value: ''
        - name: oidc_scope
          value: ''
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-host.yaml
    - name: 12-Reject-request-with-invalid-bearer-token-from-cluster
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: request_headers
          value: "Authorization:Bearer not-a-real-token"
        - name: expected_status
          value: "401"
        - name: oidc_token_url
          value: ''
        - name: oidc_client_id
          value: ''
        - name: oidc_scope
          value: ''
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    - name: 13-Reject-request-with-invalid-bearer-token-from-host
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: request_headers
          value: "Authorization:Bearer not-a-real-token"
        - name: expected_status
          value: "401"
        - name: oidc_token_url
          value: ''
        - name: oidc_client_id
          value: ''
        - name: oidc_scope
          value: ''
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-host.yaml
    # NOTE: no from-host companion for the request below. oidc_token_url points
    # at oidc-mock's cluster-internal Service DNS name
    # (*.svc.cluster.local), which isn't reachable from the chainsaw
    # test-runner host, so this scenario can only be verified from-cluster.
    - name: 14-Accept-request-with-valid-bearer-token-from-cluster
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_body
          value: Running on Pod
        - name: oidc_client_secret
          value: ($oidc_client_secret_value)
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    # oidc-mock is deployed into this test's own namespace (00-oidc-mock.yaml), so
    # mutating it here is safely scoped to this test run and doesn't affect other
    # suites/reruns.
    - name: 15-Revoke-client-secret-and-revoke-access
      try:
        - patch:
            file: 01-oidc-mock-secret-revoked.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
                updatedReplicas: 1
    - name: 16-Reject-request-after-secret-revoked-from-cluster
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: oidc_client_secret
          value: ($oidc_client_secret_value)
        - name: expected_success
          value: 'false'
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: aigateway-auth-strategy-openid-connect
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

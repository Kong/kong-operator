# The KongReferenceGrant letting the KegDataPlanes of the namespace
# dp_namespace reference the OnPremEventGateway gateway_name.
apiVersion: configuration.konghq.com/v1alpha1
kind: KongReferenceGrant
metadata:
  name: dataplanes
spec:
  from:
    - group: eventgateway.konghq.com
      kind: KegDataPlane
      namespace: ($dp_namespace)
  to:
    - group: eventgateway.konghq.com
      kind: OnPremEventGateway
      name: ($gateway_name)

apiVersion: configuration.konghq.com/v1alpha1
kind: KongLicense
metadata:
  name: kong-license
enabled: true
rawLicenseString: |
  <paste your Kong license payload here>
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: OnPremAIGateway
metadata:
  name: ai-gw-cp-onprem-1
  namespace: default
spec: {}
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: AIGatewayDataPlane
metadata:
  name: ai-gw-dp-onprem-1
  namespace: default
spec:
  controlPlaneRef:
    type: onpremNamespacedRef
    onpremNamespacedRef:
      name: ai-gw-cp-onprem-1
---
kind: AIGatewayPolicy
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: aigw-consumer-policy-prompt-decorator
  namespace: default
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ai-gw-cp-onprem-1
  apiSpec:
    name: aigw-consumer-policy-prompt-decorator
    displayName: AI Gateway Policy Prompt Decorator
    type: ai-prompt-decorator
    enabled: Enabled
    global: Disabled
    config:
      type: "inline"
      value:
        llm_format: openai
        max_request_body_size: 8388608
        prompts:
          append: null
          prepend:
            - content: "In short words"
              role: user
---
kind: AIGatewayConsumer
apiVersion: aiconfiguration.konghq.com/v1alpha1
metadata:
  name: sample-ai-gw-consumer
  namespace: default
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ai-gw-cp-onprem-1
  apiSpec:
    name: sample-dev-consumer
    displayName: Dev Team Consumer
    # References to AIGatewayPolicy CRs (by metadata.name) applied to this
    # consumer.
    policies:
      - name: aigw-consumer-policy-prompt-decorator
    type: api-key
    labels:
      team: platform-dev

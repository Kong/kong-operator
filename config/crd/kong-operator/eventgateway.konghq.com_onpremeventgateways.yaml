---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    kubernetes-configuration.konghq.com/channels: kong-operator
    kubernetes-configuration.konghq.com/version: v2.4.0-rapid.2.0
  name: onpremeventgateways.eventgateway.konghq.com
spec:
  group: eventgateway.konghq.com
  names:
    categories:
    - kong
    kind: OnPremEventGateway
    listKind: OnPremEventGatewayList
    plural: onpremeventgateways
    shortNames:
    - onpremegw
    singular: onpremeventgateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The Resource is Programmed
      jsonPath: .status.conditions[?(@.type=='Programmed')].status
      name: Programmed
      type: string
    - description: The GWAdmin serving the gateway
      jsonPath: .spec.gwAdminRef.name
      name: GWAdmin
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OnPremEventGateway is the Schema for the on-prem Event Gateway control planes API.
          It stands for one Event Gateway whose control plane is gw-admin, running in
          the cluster, instead of Konnect: Kong Operator pushes the configuration of
          the entities that reference it to gw-admin, and the data planes pull it
          from there.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of OnPremEventGateway.
            properties:
              gwAdminRef:
                description: |-
                  GWAdminRef references the GWAdmin that serves this gateway. Kong
                  Operator pushes the configuration of the gateway to every gw-admin pod of
                  it, and the data planes of the gateway pull it from there. A GWAdmin in
                  another namespace is used only when a KongReferenceGrant in its
                  namespace allows OnPremEventGateways of the namespace of the gateway to
                  reference it. It can't be changed.
                properties:
                  name:
                    description: Name is the name of the GWAdmin.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the GWAdmin. It defaults to the namespace
                      of the referencing object.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: gwAdminRef is immutable
                  rule: self == oldSelf
            required:
            - gwAdminRef
            type: object
          status:
            description: Status defines the observed state of OnPremEventGateway.
            properties:
              conditions:
                description: Conditions describe the status of the OnPremEventGateway.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                minimum: 0
                type: integer
              serverURL:
                description: |-
                  ServerURL is the address the data planes of this gateway use to reach
                  gw-admin: the cp endpoint of its GWAdmin.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: serverURL must be an https URL with a host
                  rule: isURL(self) && url(self).getScheme() == 'https' && url(self).getHostname()
                    != ''
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

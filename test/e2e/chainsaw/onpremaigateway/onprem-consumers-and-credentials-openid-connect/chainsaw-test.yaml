apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-consumers-and-credentials-openid-connect
spec:
  description: |
    Exhaustive coverage of AIGatewayConsumer / AIGatewayConsumerGroup / ACL-by-group
    enforcement for an openid-connect-protected AIGatewayAgent route on-prem, against a
    mock OIDC provider deployed into this test's own namespace (01-oidc-mock.yaml, not
    part of the shared on-prem fixtures, since the secret-rotation scenario below needs to
    mutate it freely). Mirrors the Konnect suite's
    `consumers-and-credentials-openid-connect` scenario-for-scenario (from-cluster steps
    only: the oidc-mock's cluster-internal Service DNS isn't reachable from the
    test-runner host), but for OAuth-mapped (not key-auth) consumers:
    config.consumerClaims maps the token's client_id claim to an AIGatewayConsumer's
    apiSpec.customID. See aigateway/auth-strategy-openid-connect for a minimal, bare (no
    ACL/consumer group) counterpart. Requests with no bearer token, or an invalid one,
    fall through openid-connect as an anonymous consumer, which the ACL then denies with
    403 (rather than openid-connect itself rejecting with 401). Scenarios covered:

      1. Requests without an Authorization header are rejected (403).
      2. Requests with an invalid Bearer token are rejected (403).
      3. A real access token obtained from the mock OIDC provider's client_credentials
         grant, for a consumer in the allowed AIGatewayConsumerGroup, succeeds (200).
      4. Removing/restoring a consumer's group membership at runtime immediately flips it
         between denied (403) and allowed (200).
      5. A second OIDC client, mapped to a consumer outside the allowed group, is denied
         (403) even though its token is otherwise perfectly valid.
      6. A `deny`-type ACL on a second route blocks the group it lists while a consumer
         outside that group passes through.
      7. The primary client has two valid secrets; either one mints a token that
         authenticates the same consumer. Revoking one secret (so it can no longer mint
         new tokens) doesn't affect the other, and the mock is restored to its original
         two-secret configuration afterwards, proving the restored secret works again.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    - name: oidc_auth_strategy_name
      value: (join('-', [($test_name), 'oidc-auth-strategy']))
    - name: oidc_client_secret_name
      value: (join('-', [($test_name), 'oidc-client-secret']))
    - name: oidc_issuer
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/.well-known/openid-configuration']))
    - name: oidc_token_url
      value: (join('', ['http://oidc-mock.', ($namespace), '.svc.cluster.local/connect/token']))
    - name: oidc_client_id
      value: aigateway-oidc-client
    - name: oidc_client_secret_value
      value: aigateway-oidc-client-secret
    - name: oidc_client_secret_value_2
      value: aigateway-oidc-client-secret-2
    - name: oidc_outsider_client_id
      value: aigateway-oidc-client-outsider
    - name: oidc_outsider_client_secret_value
      value: aigateway-oidc-client-outsider-secret
    - name: oidc_scope
      value: aigateway-scope
    - name: consumer_group_name
      value: (join('-', [($test_name), 'consumer-group']))
    - name: consumer_name
      value: (join('-', [($test_name), 'consumer']))
    - name: outsider_consumer_name
      value: (join('-', [($test_name), 'outsider-consumer']))
    - name: http_agent_name
      value: (join('-', [($test_name), 'http-agent']))
    - name: http_agent_route_path
      value: /http-agent
    - name: http_agent_deny_name
      value: (join('-', [($test_name), 'http-agent-deny']))
    - name: http_agent_deny_route_path
      value: /http-agent-deny
    # Defaults for verify-aigw-agent-request-from-cluster optional bindings.
    # Steps below only need to override what differs from these. NOTE:
    # oidc_token_url/oidc_client_id/oidc_scope are NOT defaulted here since
    # they're already bound above (to real values used by the auth strategy
    # setup) and cascade automatically; the reject-* steps below must
    # explicitly override them to '' to disable auto bearer-token fetching.
    - name: request_headers
      value: ''
    - name: request_body
      value: ''
    - name: content_type
      value: application/json
    - name: expected_status
      value: "200"
    - name: expected_status_not
      value: ''
    - name: expected_body
      value: ''
    - name: unexpected_body
      value: ''
    - name: expected_jsonrpc
      value: ''
    - name: expected_json_id
      value: ''
    - name: expected_json_result_text
      value: ''
    - name: oidc_client_secret
      value: ''
    - name: expected_success
      value: 'true'
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-oidc-mock
      try:
        - apply:
            file: 01-oidc-mock.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
    - name: Create-oidc-auth-strategy
      try:
        - apply:
            file: 04-oidc-auth-strategy.yaml
    - name: Create-consumer-group
      try:
        - apply:
            file: 05-consumer-group.yaml
    - name: Create-consumer
      try:
        - apply:
            file: 06-consumer.yaml
    - name: Start-echo-agent-backend
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
    - name: Create-aigateway-agent
      try:
        - apply:
            file: 07-agent-allow.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    # Entities report Programmed=False before the data plane exists (with no
    # Admin API endpoints discovered the push is skipped and the entities are
    # reported as failed), so assert here, after the data plane step.
    - name: Assert-entities-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAuthStrategy
              metadata:
                name: ($oidc_auth_strategy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerGroup
              metadata:
                name: ($consumer_group_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumer
              metadata:
                name: ($consumer_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAgent
              metadata:
                name: ($http_agent_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    # No bearer token / an invalid one falls through openid-connect as an anonymous
    # consumer, which the ACL then denies with 403 (not openid-connect's own 401).
    - name: Reject-request-without-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_status
              value: "403"
            - name: oidc_token_url
              value: ''
            - name: oidc_client_id
              value: ''
            - name: oidc_scope
              value: ''
    - name: Reject-request-with-invalid-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: "Authorization:Bearer not-a-real-token"
            - name: expected_status
              value: "403"
            - name: oidc_token_url
              value: ''
            - name: oidc_client_id
              value: ''
            - name: oidc_scope
              value: ''
    - name: Accept-request-with-valid-bearer-token
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
    # --- Dynamic group membership: revoking/restoring group membership flips access
    # even though the token/client credentials never change.
    - name: Remove-consumer-from-group
      try:
        - apply:
            file: 09-consumer-group-removed.yaml
    - name: Reject-request-after-group-membership-removed
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_status
              value: "403"
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
    - name: Restore-consumer-group-membership
      try:
        - apply:
            file: 06-consumer.yaml
    - name: Accept-request-after-group-membership-restored
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
    # --- Outsider consumer: a second OIDC client, mapped to a consumer that's never
    # enrolled in the allowed group. Its token is otherwise perfectly valid.
    - name: Create-outsider-consumer
      try:
        - apply:
            file: 10-outsider-consumer.yaml
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumer
              metadata:
                name: ($outsider_consumer_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Reject-request-outsider-consumer-not-in-allowed-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_status
              value: "403"
            - name: oidc_client_id
              value: ($oidc_outsider_client_id)
            - name: oidc_client_secret
              value: ($oidc_outsider_client_secret_value)
    # --- deny-type ACL on a second route: blocks the listed group, lets others through.
    - name: Create-aigateway-agent-deny
      try:
        - apply:
            file: 08-agent-deny.yaml
    - name: Reject-request-consumer-in-denied-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_deny_route_path)
            - name: expected_status
              value: "403"
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
    - name: Accept-request-consumer-not-in-denied-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_deny_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_id
              value: ($oidc_outsider_client_id)
            - name: oidc_client_secret
              value: ($oidc_outsider_client_secret_value)
    # --- Secret rotation: the primary client has two valid secrets. Either mints a
    # token that authenticates the same consumer; revoking one (so it can no longer
    # mint new tokens) doesn't affect the other. oidc-mock is deployed into this
    # test's own namespace (01-oidc-mock.yaml), so mutating it here is safely scoped
    # to this test run and doesn't affect other suites/reruns.
    - name: Accept-request-with-second-client-secret
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_secret
              value: ($oidc_client_secret_value_2)
    - name: Revoke-first-client-secret
      try:
        - patch:
            file: 02-oidc-mock-secret-revoked.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
                updatedReplicas: 1
    - name: Reject-request-with-revoked-first-secret
      description: |
        EXPECTED_SUCCESS 'false' inverts the template's retry loop: it keeps retrying while
        the token mint/request still succeeds and only concludes once a rejection is
        observed, so a token minted just before the mock's rollout isn't mistaken for the
        revoked secret still working.
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
            - name: expected_success
              value: 'false'
    - name: Restore-first-client-secret
      try:
        - patch:
            file: 03-oidc-mock-secret-restored.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oidc-mock
                namespace: ($namespace)
              status:
                replicas: 1
                readyReplicas: 1
                updatedReplicas: 1
    - name: Accept-request-with-first-client-secret-after-restore
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_body
              value: Running on Pod
            - name: oidc_client_secret
              value: ($oidc_client_secret_value)
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-consumers-and-credentials-openid-connect
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

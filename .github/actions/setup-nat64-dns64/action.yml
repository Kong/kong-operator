name: Set up NAT64 + DNS64
description: >-
  Give an IPv6-only kind cluster on an IPv4-only GitHub runner external
  reachability: NAT64 (tayga, userspace) translates pod egress onto the host's
  real IPv4 uplink, and DNS64 (unbound) synthesizes AAAA answers for hostnames
  that only have an A record, so pods route through the NAT64 prefix
  automatically.
runs:
  using: composite
  steps:
    - name: Set up NAT64 + DNS64 for IPv6-only cluster external reachability
      shell: bash
      run: |
        set -o pipefail

        # tayga is a userspace NAT64 (TUN-based): unlike jool's kernel module
        # it has no DKMS build, so it keeps working when GitHub rolls out new
        # runner kernels.
        sudo apt-get update -qq
        sudo apt-get install -y tayga unbound bind9-dnsutils

        sudo sysctl -w net.ipv4.ip_forward=1
        sudo sysctl -w net.ipv6.conf.all.forwarding=1
        sudo sysctl -w net.ipv6.conf.default.forwarding=1

        # 100.64.0.0/24 (CGNAT space) can't collide with the runner LAN or
        # docker's default address pools. tayga is 1:1, not NAPT: each IPv6
        # source (kind node) gets one dynamic-pool address, and the MASQUERADE
        # below then translates those onto the real uplink address.
        sudo tee /etc/tayga.conf >/dev/null <<EOF
        tun-device nat64
        ipv4-addr 100.64.0.1
        prefix 64:ff9b::/96
        dynamic-pool 100.64.0.0/24
        # Reserve the /24's broadcast address: tayga's allocator would
        # otherwise hand it out to some sources (chosen by a hash of the
        # source address), and flows via it never complete.
        map 100.64.0.255 fd00:64ff:ffff:ffff::
        EOF

        # --mktun creates the persistent TUN without addresses; wire it up
        # explicitly. The v4 /24 doubles as the return route for MASQUERADE'd
        # reply traffic, and the v6 address is the one tayga derives for
        # itself (prefix + ipv4-addr) - never source traffic from a different
        # in-prefix address, those bypass the dynamic pool.
        sudo tayga --mktun
        sudo ip addr add 100.64.0.1/24 dev nat64
        sudo ip addr add 64:ff9b::6440:1/128 dev nat64
        sudo ip link set nat64 up
        sudo ip route replace 100.64.0.0/24 dev nat64
        sudo ip -6 route replace 64:ff9b::/96 dev nat64

        sudo bash -c 'nohup tayga >/var/log/tayga.log 2>&1 &'
        sleep 2
        if ! pgrep -x tayga >/dev/null; then
          echo "tayga failed to start:" >&2
          cat /var/log/tayga.log >&2 || true
          exit 1
        fi

        # All four legs of a translation flow traverse netfilter's FORWARD
        # chain (tayga injects translated packets back through the TUN), and
        # docker sets the FORWARD policy to DROP with rules that only know
        # about its own bridges - accept the translation subnets explicitly.
        sudo iptables -I FORWARD 1 -s 100.64.0.0/24 -j ACCEPT
        sudo iptables -I FORWARD 1 -d 100.64.0.0/24 -j ACCEPT
        sudo ip6tables -I FORWARD 1 -s 64:ff9b::/96 -j ACCEPT
        sudo ip6tables -I FORWARD 1 -d 64:ff9b::/96 -j ACCEPT

        UPLINK_IF=$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1); exit}')
        sudo iptables -t nat -I POSTROUTING 1 -s 100.64.0.0/24 -o "${UPLINK_IF}" -j MASQUERADE

        # Docker also adds, per IPv6 network, an ip6 masquerade rule for the
        # network's subnet and raw-prerouting isolation drops for each
        # container address. Both would break this path: the node's
        # NAT64-bound traffic gets its source rewritten to the tun's
        # in-prefix address (which tayga rejects) and the replies, entering
        # via the tun, get dropped. Accept the NAT64 prefix in both places,
        # before docker's rules.
        sudo ip6tables -t nat -I POSTROUTING 1 -d 64:ff9b::/96 -j ACCEPT
        sudo ip6tables -t raw -I PREROUTING 1 -s 64:ff9b::/96 -j ACCEPT

        # DNS64 has to run on this host, not as a cluster pod: it needs to be
        # reachable via IPv6 from the pod network AND do real IPv4 DNS lookups
        # itself, which an IPv6-only CoreDNS pod can't do.
        GW=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Subnet | contains(":")) | .Gateway')
        if [ -z "$GW" ] || [ "$GW" = "null" ]; then
          SUBNET=$(docker network inspect kind | jq -r '.[0].IPAM.Config[] | select(.Subnet | contains(":")) | .Subnet')
          GW=$(python3 -c "import ipaddress; print(ipaddress.ip_interface('$SUBNET').network.network_address + 1)")
        fi
        echo "kind bridge IPv6 gateway (this host): $GW"

        sudo tee /etc/unbound/unbound.conf.d/dns64.conf >/dev/null <<EOF
        server:
          interface: ${GW}
          interface: 127.0.0.1
          access-control: ::0/0 allow
          access-control: 0.0.0.0/0 allow
          do-ip4: yes
          do-ip6: yes
          module-config: "dns64 validator iterator"
          dns64-prefix: 64:ff9b::/96
          # Synthesize unconditionally, ignoring any real AAAA record: the
          # runner has no real IPv6 route, so every external destination must
          # go through the NAT64 path.
          dns64-synthall: yes
        EOF
        # The resolvconf integration unit fails on runners (no resolvconf
        # binary); we manage resolv.conf ourselves here.
        sudo systemctl disable --now unbound-resolvconf.service 2>/dev/null || true
        sudo rm -f /etc/systemd/system/unbound.service.wants/unbound-resolvconf.service

        sudo unbound-checkconf
        for i in 1 2 3 4 5; do
          if sudo systemctl restart unbound; then
            break
          fi
          echo "unbound restart attempt ${i} failed:" >&2
          sudo journalctl -u unbound --no-pager -n 30 || true
          if [ "$i" = 5 ]; then
            exit 1
          fi
          sleep 5
        done

        # Prove DNS64 works before pointing CoreDNS at it, and resolve the
        # TCP probe target below.
        TARGET_V6=""
        for i in $(seq 1 30); do
          TARGET_V6=$(dig +time=2 +tries=1 @"${GW}" example.com AAAA +short | grep '^64:ff9b::' | head -1) || true
          if [ -n "$TARGET_V6" ]; then
            echo "DNS64 synthesis OK"
            break
          fi
          if [ "$i" = 30 ]; then
            echo "DNS64 never synthesized an AAAA via unbound at ${GW}" >&2
            exit 1
          fi
          sleep 2
        done

        # Prove the NAT64 path end-to-end with a TCP connection to the
        # DNS64-resolved target - the same path the tests use. Bind the probe
        # source: without it, curl uses the route's default source (the tun's
        # in-prefix address), which tayga rejects. (Do not probe 1.1.1.1:
        # runners black-hole it, native IPv4 included.)
        PROBE_ADDR=fd00:64ff::1
        sudo ip addr add "${PROBE_ADDR}/128" dev lo || true
        for i in $(seq 1 5); do
          rc=0
          curl --connect-timeout 8 --interface "${PROBE_ADDR}" -sS -o /dev/null "https://[${TARGET_V6}]/" 2>/dev/null || rc=$?
          # Any exit other than connection-level failure (7 refused,
          # 28 timeout) proves the flow traversed NAT64 in both directions;
          # TLS/app-layer errors are still successful connections.
          if [ "$rc" != 7 ] && [ "$rc" != 28 ]; then
            echo "NAT64 path OK (tcp)"
            break
          fi
          if [ "$i" = 5 ]; then
            echo "NAT64 path never came up (tcp via ${PROBE_ADDR} to ${TARGET_V6})" >&2
            exit 1
          fi
          sleep 2
        done

        NEW_COREFILE=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' \
          | sed "s#forward \. /etc/resolv.conf#forward . ${GW}#")
        case "$NEW_COREFILE" in
          *"forward . ${GW}"*) ;;
          *) echo "Corefile rewrite did not apply" >&2; exit 1 ;;
        esac
        kubectl -n kube-system get configmap coredns -o json \
          | jq --arg cf "$NEW_COREFILE" '.data.Corefile = $cf' \
          | kubectl apply -f -
        kubectl -n kube-system rollout restart deployment coredns
        kubectl -n kube-system rollout status deployment coredns --timeout=60s

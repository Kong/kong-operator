    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/ha: "true"
    features.operators.openshift.io/iam-provider: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/single-node: "true"
    features.operators.openshift.io/tls-capable: "true"
    repository: https://github.com/kong/kong-operator
    support: Kong, Inc.
spec:
  displayName: Kong Operator
  description: |
    Kong Operator manages Kong Gateway deployments, in-process Kong ingress
    controller instances and Konnect cloud resources, providing a
    Kubernetes-native way to deploy and configure Kong.

    On OpenShift it runs under the restricted-v2 security context constraint
    and is installed through OperatorHub. Note that the Kong Gateway image it
    deploys by default is the certified Enterprise build, which requires a
    licence.
  icon:
    - base64data: 
      mediatype: image/png
  keywords:
    - kong
    - gateway
    - api gateway
    - ai gateway
    - konnect
    - ingress
  links:
    - name: Documentation
      url: https://developer.konghq.com/operator/
    - name: Repository
      url: https://github.com/kong/kong-operator
  maintainers:
    - email: operator@konghq.com
      name: Kong, Inc.
  provider:
    name: Kong, Inc.
  maturity: stable
  minKubeVersion: 1.32.0
  version: 0.1.0
  replaces: ""
  install:
    strategy: deployment
    spec:
      deployments: null
      permissions: null
      clusterPermissions: null
  installModes:
    - type: OwnNamespace
      supported: false
    - type: SingleNamespace
      supported: false
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: true
  webhookdefinitions:
    - admissionReviewVersions:
        - v1
      conversionCRDs:
        - controlplanes.gateway-operator.konghq.com
        - gatewayconfigurations.gateway-operator.konghq.com
        - konnectgatewaycontrolplanes.konnect.konghq.com
      deploymentName: controller-manager
      type: ConversionWebhook
      webhookPath: /convert
      webhookService:
        name: gateway-operator-webhook-service
        namespace: placeholder
        port: 443
    - admissionReviewVersions:
        - v1
      deploymentName: controller-manager
      failurePolicy: Fail
      matchPolicy: Equivalent
      rules:
        - apiGroups:
            - gateway.networking.k8s.io
          apiVersions:
            - v1alpha2
            - v1beta1
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - gateways
            - httproutes
        - apiGroups:
            - configuration.konghq.com
          apiVersions:
            - '*'
          operations:
            - CREATE
            - UPDATE
          resources:
            - kongconsumers
            - kongconsumergroups
            - kongplugins
            - kongclusterplugins
            - kongvaults
            - kongcustomentities
        - apiGroups:
            - networking.k8s.io
          apiVersions:
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - ingresses
        - apiGroups:
            - ""
          apiVersions:
            - v1
          operations:
            - CREATE
            - UPDATE
          resources:
            - secrets
      sideEffects: None
      timeoutSeconds: 10
      type: ValidatingAdmissionWebhook
      webhookPath: /
      webhookService:
        name: gateway-operator-webhook-service
        namespace: placeholder
        port: 5443
  relatedImages:
    # The operator entry is appended by make bundle from OPERATOR_IMAGE. Its
    # tag follows the release version and its digest changes per release, so
    # the value must not be pinned here.
    # TODO(certification): replace with the Red Hat-certified digest agreed with
    # team-gateway (#6420). This is the current Enterprise -rhel build as an
    # interim stand-in.

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-consumers-and-credentials-keyauth
spec:
  description: |
    Exhaustive coverage of AIGatewayConsumer / AIGatewayConsumerCredential /
    AIGatewayConsumerGroup / ACL enforcement for a key-auth-protected
    AIGatewayAgent route on-prem, mirroring the Konnect suite's
    `consumers-and-credentials-keyauth` test. Builds on the bare key-auth
    coverage by adding an AIGatewayConsumerGroup and `access.acls` gating, and
    exercises the consumer/credential lifecycle end-to-end against a real
    in-cluster AIGatewayDataPlane. The AIGatewayAgent here is a plain
    `type: http` route to the shared go-echo backend (no model routing:
    consumer/credential/ACL enforcement happens in front of the route
    regardless of what backs it). Requests with no credential, or with a
    credential key-auth can't validate (garbage/deleted), fall through key-auth
    as an anonymous consumer, which the ACL then denies with 403 (rather than
    key-auth itself rejecting with 401). Scenarios covered:

      1. Requests without a credential, or with a garbage credential, are
         rejected (403).
      2. A valid credential for a consumer enrolled in the allowed group
         succeeds (200).
      3. Removing/restoring the consumer's group membership at runtime flips
         access between denied (403) and allowed (200) — the credential itself
         never changes.
      4. A consumer outside the allowed group is denied (403) even with a valid
         credential of its own, proving the ACL checks group membership, not
         just authentication.
      5. A `deny`-type ACL on a second route blocks the group it lists while a
         consumer outside that group passes through.
      6. A consumer with two credentials keeps working on whichever key is
         still valid (rotation), and only loses access once both are revoked.
      7. A credential whose Secret is missing reports Programmed=False on the
         credential itself while its consumer and its healthy sibling stay
         Programmed=True and authenticating; creating the Secret repairs it
         (Programmed=True, key accepted).
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: keyauth_auth_strategy_name
      value: (join('-', [($test_name), 'key-auth-strategy']))
    - name: consumer_group_name
      value: (join('-', [($test_name), 'consumer-group']))
    - name: consumer_name
      value: (join('-', [($test_name), 'consumer']))
    - name: credential_name
      value: (join('-', [($test_name), 'credential']))
    - name: credential_secret_name
      value: (join('-', [($test_name), 'credential-secret']))
    - name: api_key_value
      value: e2e-test-api-key-value
    - name: invalid_api_key_value
      value: never-registered-api-key-value
    - name: credential_name_2
      value: (join('-', [($test_name), 'credential-2']))
    - name: credential_secret_name_2
      value: (join('-', [($test_name), 'credential-2-secret']))
    - name: api_key_value_2
      value: e2e-test-api-key-value-2
    - name: outsider_consumer_name
      value: (join('-', [($test_name), 'outsider-consumer']))
    - name: outsider_credential_name
      value: (join('-', [($test_name), 'outsider-credential']))
    - name: outsider_credential_secret_name
      value: (join('-', [($test_name), 'outsider-credential-secret']))
    - name: outsider_api_key_value
      value: e2e-test-outsider-api-key-value
    - name: broken_credential_name
      value: (join('-', [($test_name), 'broken-credential']))
    - name: broken_credential_secret_name
      value: (join('-', [($test_name), 'broken-credential-secret']))
    - name: broken_api_key_value
      value: e2e-test-broken-api-key-value
    - name: http_agent_name
      value: (join('-', [($test_name), 'http-agent']))
    - name: http_agent_route_path
      value: /http-agent
    - name: http_agent_deny_name
      value: (join('-', [($test_name), 'http-agent-deny']))
    - name: http_agent_deny_route_path
      value: /http-agent-deny
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    # Defaults for verify-aigw-agent-request-from-cluster optional bindings.
    # Steps below only need to override what differs from these.
    - name: request_headers
      value: ''
    - name: request_body
      value: ''
    - name: content_type
      value: application/json
    - name: expected_status
      value: "200"
    - name: expected_status_not
      value: ''
    - name: expected_body
      value: ''
    - name: unexpected_body
      value: ''
    - name: expected_jsonrpc
      value: ''
    - name: expected_json_id
      value: ''
    - name: expected_json_result_text
      value: ''
    - name: oidc_token_url
      value: ''
    - name: oidc_client_id
      value: ''
    - name: oidc_client_secret
      value: ''
    - name: oidc_scope
      value: ''
    - name: expected_success
      value: 'true'
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-keyauth-auth-strategy
      try:
        - apply:
            file: 01-keyauth-strategy.yaml
    - name: Create-consumer-group
      try:
        - apply:
            file: 02-consumer-group.yaml
    - name: Create-consumer-and-credential
      try:
        - apply:
            file: 03-consumer-and-credential.yaml
    - name: Start-echo-agent-backend
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
    - name: Create-aigateway-agent
      try:
        - apply:
            file: 04-agent-allow.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    # Entities report Programmed=False before the data plane exists (with no
    # Admin API endpoints discovered the push is skipped and the entities are
    # reported as failed), so assert here, after the data plane step. The
    # credentials are asserted too: each one reports its own outcome, the
    # consumer's Programmed condition no longer standing for them.
    - name: Assert-entities-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAuthStrategy
              metadata:
                name: ($keyauth_auth_strategy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerGroup
              metadata:
                name: ($consumer_group_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumer
              metadata:
                name: ($consumer_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAgent
              metadata:
                name: ($http_agent_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($credential_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Reject-request-without-credential
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: expected_status
              value: "403"
    - name: Reject-request-with-invalid-credential
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($invalid_api_key_value)]))
            - name: expected_status
              value: "403"
    - name: Accept-request-with-valid-credential
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value)]))
            - name: expected_body
              value: Running on Pod
    # --- Dynamic group membership: revoking/restoring group membership flips
    # access even though the credential itself never changes.
    - name: Remove-consumer-from-group
      try:
        - apply:
            file: 08-consumer-group-removed.yaml
    - name: Reject-request-after-group-membership-removed
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value)]))
            - name: expected_status
              value: "403"
    - name: Restore-consumer-group-membership
      try:
        - apply:
            file: 03-consumer-and-credential.yaml
    - name: Accept-request-after-group-membership-restored
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value)]))
            - name: expected_body
              value: Running on Pod
    # --- Outsider consumer: valid credential, but never enrolled in the
    # allowed group.
    - name: Create-outsider-consumer-and-credential
      try:
        - apply:
            file: 05-outsider-consumer-and-credential.yaml
    - name: Reject-request-outsider-consumer-not-in-allowed-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($outsider_api_key_value)]))
            - name: expected_status
              value: "403"
    # --- deny-type ACL on a second route: blocks the listed group, lets
    # others through.
    - name: Create-aigateway-agent-deny
      try:
        - apply:
            file: 06-agent-deny.yaml
    - name: Reject-request-consumer-in-denied-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_deny_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value)]))
            - name: expected_status
              value: "403"
    - name: Accept-request-consumer-not-in-denied-group
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_deny_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($outsider_api_key_value)]))
            - name: expected_body
              value: Running on Pod
    # --- Credential rotation: a second credential keeps working after the
    # first is revoked.
    - name: Create-second-credential-for-consumer
      try:
        - apply:
            file: 07-credential-2.yaml
    - name: Accept-request-with-second-credential
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value_2)]))
            - name: expected_body
              value: Running on Pod
    - name: Delete-first-credential-and-revoke-access
      try:
        - delete:
            ref:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              name: ($credential_name)
              namespace: ($namespace)
        - error:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($credential_name)
                namespace: ($namespace)
    - name: Accept-request-with-second-credential-after-first-revoked
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value_2)]))
            - name: expected_body
              value: Running on Pod
    # --- Per-credential status: a credential whose Secret does not exist is
    # reported on the credential itself, and it does not take its consumer or
    # the consumer's healthy credentials down with it.
    - name: Create-credential-with-missing-secret
      try:
        - apply:
            file: 09-broken-credential.yaml
    - name: Assert-broken-credential-unprogrammed-and-consumer-unaffected
      description: |
        The broken credential reports Programmed=False/Invalid while the
        consumer and its other credential stay Programmed=True: the failure is
        attributed to the credential that carries it, not to the consumer.
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($broken_credential_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    reason: Invalid
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($credential_name_2)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumer
              metadata:
                name: ($consumer_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Accept-request-with-healthy-credential-while-sibling-broken
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value_2)]))
            - name: expected_body
              value: Running on Pod
    # --- Repairing the credential: creating the missing Secret re-renders the
    # consumer (the credential's own Secret watch) and the credential reports
    # Programmed=True, with its key authenticating.
    - name: Create-the-missing-credential-secret
      try:
        - apply:
            file: 10-broken-credential-secret.yaml
    - name: Assert-repaired-credential-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($broken_credential_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Accept-request-with-repaired-credential
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($broken_api_key_value)]))
            - name: expected_body
              value: Running on Pod
    - name: Delete-second-credential-and-revoke-all-access
      try:
        - delete:
            ref:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              name: ($credential_name_2)
              namespace: ($namespace)
        - error:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayConsumerCredential
              metadata:
                name: ($credential_name_2)
                namespace: ($namespace)
    - name: Reject-request-after-credential-revoked
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
        with:
          bindings:
            - name: method
              value: GET
            - name: route_path
              value: ($http_agent_route_path)
            - name: request_headers
              value: (join('', ['apikey:', ($api_key_value)]))
            - name: expected_status
              value: "403"
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-consumers-and-credentials-keyauth
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

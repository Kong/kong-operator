# Template for creating and asserting an OnPremAIGateway control plane.
#
# Required bindings:
#   - aigw_cp_name: Name of the OnPremAIGateway to create.
#   - namespace: Namespace where the OnPremAIGateway will be created.
#
# The OnPremAIGateway spec is empty: the controller reports readiness of the
# embedded control-plane instance. LicenseValid is informational and never
# gates Ready: without a KongLicense it reports False (LicenseMissing), and
# with one it reports True (LicenseProvided). This template asserts Ready only.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-onprem-aigateway
spec:
  try:
    - apply:
        resource:
          apiVersion: aigateway.konghq.com/v1alpha1
          kind: OnPremAIGateway
          metadata:
            name: ($aigw_cp_name)
            namespace: ($namespace)
          spec: {}
    - assert:
        resource:
          apiVersion: aigateway.konghq.com/v1alpha1
          kind: OnPremAIGateway
          metadata:
            name: ($aigw_cp_name)
            namespace: ($namespace)
          status:
            (conditions[?type == 'Ready']):
              - status: 'True'

# Minimal sample for the on-prem AIGateway control plane CRD.
#
# The reconciler for OnPremAIGateway is opt in via --enable-controller-onpremaigateway.
apiVersion: aigateway.konghq.com/v1alpha1
kind: OnPremAIGateway
metadata:
  name: ai-gw-cp-onprem-1
  namespace: default
spec:
  dataplaneSync:
    intervalSeconds: 5
    timeoutSeconds: 3
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: AIGatewayDataPlane
metadata:
  name: ai-gw-dp-onprem-1
  namespace: default
spec:
  controlPlaneRef:
    type: onpremNamespacedRef
    onpremNamespacedRef:
      name: ai-gw-cp-onprem-1

kind: KonnectAPIAuthConfiguration
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: konnect-api-auth-dev-1
  namespace: default
spec:
  type: token
  token: kpat_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  serverURL: us.api.konghq.com
---
kind: KonnectGatewayControlPlane
apiVersion: konnect.konghq.com/v1alpha2
metadata:
  name: test1
  namespace: default
spec:
  createControlPlaneRequest:
    name: test1
  konnect:
    authRef:
      name: konnect-api-auth-dev-1
---
# The Config Store that backs the Konnect vault. Its Konnect ID is generated by
# Konnect and reported in status.id; the KongVault below picks it up from there.
apiVersion: konnect.konghq.com/v1alpha1
kind: KonnectConfigStore
metadata:
  name: tls-cert-keys
  namespace: default
spec:
  controlPlaneRef:
    type: namespacedRef
    namespacedRef:
      name: test1
      namespace: default
  apiSpec:
    name: tls-cert-keys
---
# KongReferenceGrant that allows a cluster-scoped KongVault to reference the
# KonnectGatewayControlPlane and the KonnectConfigStore in the "default"
# namespace. Both references cross a namespace boundary because KongVault is
# cluster-scoped, so both need to be granted by the referenced namespace.
apiVersion: configuration.konghq.com/v1alpha1
kind: KongReferenceGrant
metadata:
  name: allow-kongvault-to-konnect-resources
  namespace: default
spec:
  from:
    - group: configuration.konghq.com
      kind: KongVault
      # KongVault is cluster scoped, so this must be empty.
      namespace: ""
  to:
    - group: konnect.konghq.com
      kind: KonnectGatewayControlPlane
    - group: konnect.konghq.com
      kind: KonnectConfigStore
      # Optional: without it, the grant covers every KonnectConfigStore in this
      # namespace.
      name: tls-cert-keys
---
kind: KongVault
apiVersion: configuration.konghq.com/v1alpha1
metadata:
  name: konnect-vault-1
spec:
  backend: konnect
  prefix: certvault
  # Instead of copying the Konnect-generated Config Store ID into
  # spec.config.config_store_id, reference the KonnectConfigStore by name. The
  # operator resolves it to that store's Konnect ID once it is programmed.
  configStoreRef:
    name: tls-cert-keys
    # KongVault is cluster scoped, so the namespace of the referenced
    # KonnectConfigStore has to be specified, and that namespace has to allow the
    # reference with the KongReferenceGrant above.
    namespace: default
  controlPlaneRef:
    type: konnectNamespacedRef
    konnectNamespacedRef:
      name: test1
      namespace: default

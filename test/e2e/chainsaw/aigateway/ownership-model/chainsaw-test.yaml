apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-ownership-model
spec:
  description: |
    Konnect entity ownership - AIGatewayModel. Checks, against the real Konnect API, how
    the operator owns the Konnect entity behind the CR (see the
    common/_step_templates/konnect-ownership-*.yaml templates):

    - the entity carries the operator's labels (k8s-uid, managed-by, ...) and
      the user's labels, and the operator's values win over k8s-uid /
      managed-by set in the CR's spec; labels follow spec updates;
    - a lost status.id is recovered through the k8s-uid label, without
      creating a second entity;
    - an entity with the same name created outside the operator, or by a
      second CR, is never taken over;
    - deleting a CR that lost its status.id leaves no orphan entity.

    The entity created outside the operator uses another route path, so the
    conflict is on the name only.

    No data plane is needed.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    # The entity under test.
    - name: cr_api_version
      value: aiconfiguration.konghq.com/v1alpha1
    - name: cr_kind
      value: AIGatewayModel
    - name: cr_resource
      value: aigatewaymodels.aiconfiguration.konghq.com
    - name: collection_path_jq
      value: '"/v1/ai-gateways/" + .status.gatewayID.id + "/models"'
    - name: cr_name
      value: model
    - name: duplicate_cr_name
      value: model-duplicate
    - name: foreign_cr_name
      value: model-foreign
    - name: entity_name
      value: ownership-model
    - name: foreign_entity_name
      value: ownership-model-foreign
    - name: cr_spec
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          type: model
          model:
            name: ($entity_name)
            displayName: ($entity_name)
            enabled: Enabled
            formats:
              - type: openai
            capabilities:
              - generate
            config:
              route:
                paths:
                  - /ownership-model
            targets:
              - name: ownership-target
                provider:
                  name: ownership-provider
                config:
                  type: openai
                  openai:
                    upstreamURL: http://model.example.invalid
            labels: {team: chainsaw, k8s-uid: not-the-real-uid, managed-by: someone-else}
    - name: cr_spec_updated
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          type: model
          model:
            name: ($entity_name)
            displayName: ($entity_name)
            enabled: Enabled
            formats:
              - type: openai
            capabilities:
              - generate
            config:
              route:
                paths:
                  - /ownership-model
            targets:
              - name: ownership-target
                provider:
                  name: ownership-provider
                config:
                  type: openai
                  openai:
                    upstreamURL: http://model.example.invalid
            labels: {team: chainsaw-updated, k8s-uid: not-the-real-uid, managed-by: someone-else}
    - name: foreign_cr_spec
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          type: model
          model:
            name: ($foreign_entity_name)
            labels: {reconcile: first}
            displayName: ($foreign_entity_name)
            enabled: Enabled
            formats:
              - type: openai
            capabilities:
              - generate
            config:
              route:
                paths:
                  - /ownership-model-foreign-cr
            targets:
              - name: ownership-target
                provider:
                  name: ownership-provider
                config:
                  type: openai
                  openai:
                    upstreamURL: http://model.example.invalid
    - name: foreign_cr_spec_bumped
      value:
        aiGatewayRef:
          namespacedRef:
            name: ($aigw_cp_name)
        apiSpec:
          type: model
          model:
            name: ($foreign_entity_name)
            labels: {reconcile: second}
            displayName: ($foreign_entity_name)
            enabled: Enabled
            formats:
              - type: openai
            capabilities:
              - generate
            config:
              route:
                paths:
                  - /ownership-model-foreign-cr
            targets:
              - name: ownership-target
                provider:
                  name: ownership-provider
                config:
                  type: openai
                  openai:
                    upstreamURL: http://model.example.invalid
    - name: foreign_body
      value: >-
        (join('', ['{type: "model", name: "', $foreign_entity_name, '", display_name: "', $foreign_entity_name, '", formats: [{type: "openai"}], capabilities: ["generate"], config: {route: {paths: ["/ownership-model-foreign"]}}, targets: [{name: "ownership-target", provider: "ownership-provider", config: {type: "openai", upstream_url: "http://model.example.invalid"}}]}']))
  steps:
    - name: Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: Create-model-provider
      try:
        - apply:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModelProvider
              metadata:
                name: ownership-provider
                namespace: ($namespace)
              spec:
                aiGatewayRef:
                  namespacedRef:
                    name: ($aigw_cp_name)
                apiSpec:
                  type: openai
                  openai:
                    name: ownership-provider
                    displayName: ownership-provider
                    config:
                      auth:
                        headers:
                          - name: apikey
                            value:
                              type: inline
                              value: ownership-provider-key
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModelProvider
              metadata:
                name: ownership-provider
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'

    - name: Create-entity
      use:
        template: ../../common/_step_templates/konnect-ownership-apply-assert-entity.yaml
    - name: Assert-labels
      bindings:
        - name: user_label_value
          value: chainsaw
      use:
        template: ../../common/_step_templates/konnect-ownership-assert-labels.yaml
    - name: Update-entity
      bindings:
        - name: cr_spec
          value: ($cr_spec_updated)
      use:
        template: ../../common/_step_templates/konnect-ownership-apply-assert-entity.yaml
    - name: Assert-labels-after-update
      bindings:
        - name: user_label_value
          value: chainsaw-updated
      use:
        template: ../../common/_step_templates/konnect-ownership-assert-labels.yaml
    - name: Recover-lost-Konnect-ID
      use:
        template: ../../common/_step_templates/konnect-ownership-recover-lost-id.yaml
    - name: Reject-entity-created-outside-the-operator
      use:
        template: ../../common/_step_templates/konnect-ownership-reject-foreign-entity.yaml
    - name: Reject-duplicate-CR
      bindings:
        - name: cr_spec
          value: ($cr_spec_updated)
        - name: duplicate_cr_spec_bumped
          value: ($cr_spec)
      use:
        template: ../../common/_step_templates/konnect-ownership-reject-duplicate-cr.yaml
    - name: Delete-leaves-no-orphan-after-lost-Konnect-ID
      use:
        template: ../../common/_step_templates/konnect-ownership-no-orphan-after-lost-id.yaml

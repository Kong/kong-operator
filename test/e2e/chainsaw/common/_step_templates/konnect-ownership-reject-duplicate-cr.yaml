# Template for verifying that a second CR with the same Konnect name as an
# existing one does not take over its Konnect entity: the duplicate's create
# gets a conflict and the conflict lookup must not match the first CR's entity
# (it carries the first CR's k8s-uid label). The duplicate must never be
# Programmed, must not change the entity, and deleting it must not delete it.
#
# Required bindings:
#   - cr_api_version, cr_kind, cr_resource: API version, kind and resource type of the CR.
#   - cr_name: Name of the existing, Programmed CR.
#   - cr_spec: Spec (an object) applied to the duplicate: the same as the
#     existing CR's, so it has the same Konnect name.
#   - duplicate_cr_name: Name of the duplicate CR.
#   - duplicate_cr_spec_bumped: cr_spec with a harmless change (e.g. a label
#     value), applied afterwards to trigger another reconciliation.
#   - collection_path_jq: jq expression, evaluated against the CR, yielding the
#     Konnect API path of the entity collection (see konnect_entity_of_resource.sh).
#   - konnect_token, konnect_url: Konnect API token and host.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: konnect-ownership-reject-duplicate-cr
spec:
  try:
    - description: Record the existing CR's Konnect entity.
      script:
        env:
          - name: RESOURCE_TYPE
            value: ($cr_resource)
          - name: RESOURCE_NAME
            value: ($cr_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: COLLECTION_PATH_JQ
            value: ($collection_path_jq)
        content: |
          bash ../../common/scripts/konnect_entity_of_resource.sh
        outputs:
          - name: primary
            value: (json_parse($stdout))
    - apply:
        resource:
          apiVersion: ($cr_api_version)
          kind: ($cr_kind)
          metadata:
            name: ($duplicate_cr_name)
            namespace: ($namespace)
          spec: ($cr_spec)
    - description: Once reconciled, the duplicate is not Programmed and has no status.id.
      script:
        env:
          - name: RESOURCE_TYPE
            value: ($cr_resource)
          - name: RESOURCE_NAME
            value: ($duplicate_cr_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: JQ_CONDITION
            # FailedToCreate proves the reconciliation attempted the create
            # (and declined the existing entity), rather than stopping earlier.
            value: &not_programmed >-
              .status | (.id // "") == ""
              and ([.conditions[]? | select(.type == "Programmed" and .status == "False" and .reason == "FailedToCreate")] | length) == 1
        content: |
          bash ../../common/scripts/wait_for_resource_reconciled.sh
    - description: |
        Change the duplicate's spec to trigger another reconciliation, so a
        late takeover (on a later reconciliation) would show.
      apply:
        resource:
          apiVersion: ($cr_api_version)
          kind: ($cr_kind)
          metadata:
            name: ($duplicate_cr_name)
            namespace: ($namespace)
          spec: ($duplicate_cr_spec_bumped)
    - description: Once reconciled again, the duplicate is still not Programmed and has no status.id.
      script:
        env:
          - name: RESOURCE_TYPE
            value: ($cr_resource)
          - name: RESOURCE_NAME
            value: ($duplicate_cr_name)
          - name: NAMESPACE
            value: ($namespace)
          - name: JQ_CONDITION
            value: *not_programmed
        content: |
          bash ../../common/scripts/wait_for_resource_reconciled.sh
    - description: The entity is still the existing CR's.
      script:
        env:
          - name: KONNECT_TOKEN
            value: ($konnect_token)
          - name: KONNECT_URL
            value: ($konnect_url)
          - name: API_PATH
            value: ($primary.entity_path)
          - name: WANT_ID
            value: ($primary.id)
          - name: WANT_UID
            value: ($primary.uid)
          - name: EXPECTED_JQ
            value: .id == $ENV.WANT_ID and .labels["k8s-uid"] == $ENV.WANT_UID
        content: |
          bash ../../common/scripts/konnect_api_request.sh
    - delete:
        ref:
          apiVersion: ($cr_api_version)
          kind: ($cr_kind)
          name: ($duplicate_cr_name)
          namespace: ($namespace)
    - error:
        resource:
          apiVersion: ($cr_api_version)
          kind: ($cr_kind)
          metadata:
            name: ($duplicate_cr_name)
            namespace: ($namespace)
    - description: Deleting the duplicate must leave the existing CR's entity in Konnect.
      script:
        env:
          - name: KONNECT_TOKEN
            value: ($konnect_token)
          - name: KONNECT_URL
            value: ($konnect_url)
          - name: API_PATH
            value: ($primary.entity_path)
          - name: WANT_ID
            value: ($primary.id)
          - name: WANT_UID
            value: ($primary.uid)
          - name: EXPECTED_JQ
            value: .id == $ENV.WANT_ID and .labels["k8s-uid"] == $ENV.WANT_UID
        content: |
          bash ../../common/scripts/konnect_api_request.sh
    - assert:
        resource:
          apiVersion: ($cr_api_version)
          kind: ($cr_kind)
          metadata:
            name: ($cr_name)
            namespace: ($namespace)
          status:
            id: ($primary.id)
            (conditions[?type == 'Programmed']):
              - status: 'True'

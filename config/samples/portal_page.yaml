kind: Portal
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: portal1
  namespace: default
spec:
  konnect:
    authRef:
      name: konnect-api-auth
  apiSpec:
    name: portal1
    authenticationEnabled: Enabled
---
kind: PortalPage
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: portal1-page
  namespace: default
spec:
  portalRef:
    type: namespacedRef
    namespacedRef:
      name: portal1
  apiSpec:
    title: Getting Started
    slug: getting-started
    description: Getting started guide for the developer portal
    content: |
      # Getting Started

      Welcome to the developer portal. This guide walks you through authenticating and making your first API call.

      ## Authentication

      All requests require a valid API key in the `Authorization` header.

      ## Quick Start

      ```bash
      curl -H "Authorization: Bearer <your-api-key>" https://api.example.com/v1/hello
      ```
    status: published
    visibility: public
---
kind: PortalPage
apiVersion: konnect.konghq.com/v1alpha1
metadata:
  name: portal1-page-child
  namespace: default
spec:
  portalRef:
    type: namespacedRef
    namespacedRef:
      name: portal1
  apiSpec:
    title: Authentication
    slug: authentication
    description: Authentication guide for the developer portal
    content: |
      # Authentication

      All API requests require a valid API key.

      ## Obtaining an API Key

      Register your application in the developer portal to receive an API key.

      ## Using the API Key

      Include the API key in the `Authorization` header of every request.
    # Reference another PortalPage in the cluster as the parent page.
    # The full path of this page becomes /getting-started/authentication.
    parentPageIDRef:
      type: namespacedRef
      namespacedRef:
        name: portal1-page
    status: published
    visibility: public

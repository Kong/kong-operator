                  rule: 'self.kind == ''OnPremAIGateway'' ? self.group == ''aigateway.konghq.com''
                    : self.group == ''konnect.konghq.com'''
                - message: repointing an entity between KonnectAIGateway and OnPremAIGateway
                    is forbidden
                  rule: '!has(oldSelf.kind) || self.kind == oldSelf.kind'
              apiSpec:
                description: APISpec defines the desired state of the resource's API

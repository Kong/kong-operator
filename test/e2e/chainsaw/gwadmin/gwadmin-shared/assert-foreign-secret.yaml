# The Secret secret_name, taken by someone else, was left alone by Kong
# Operator: not owned, not labeled as provisioned, its data untouched.
apiVersion: v1
kind: Secret
metadata:
  name: ($secret_name)
  (length(ownerReferences || `[]`)): 0
  (labels."gateway.konghq.com/secret-provisioning" == null): true
data:
  owner: (base64_encode('someone-else'))

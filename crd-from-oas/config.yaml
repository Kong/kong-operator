            interface: github.com/Kong/sdk-konnect-go.AIGatewaySNIsSDK
            fieldName: AIGatewaySNIs
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewaySNIRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewaySNIRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      # The backends whose credentials the OAS carries inline are sourced from
      # Kubernetes Secrets, like AIGatewayCertificate's cert/key and
      # AIGatewayAuthStrategy's clientSecret. The other backends carry no
      # inline secret: aws authenticates through an IAM role, gcp through
      # project_id, azure through client_id/tenant_id and env through prefix.
      # Path segments address the type union by its discriminator mapping keys
      # (conjur, hcv) and the nested HashiCorpVaultConfig auth_method union by
      # its own (token, cert, jwt, approle, gcp_iam, aws_iam) — a nested union's
      # variant segment is matched against the mapping key verbatim, unlike the
      # root union's, which also accepts the camelCase form.
      - path: /v1/ai-gateways/{gatewayId}/vaults
        name: AIGatewayVault
        dataSources:
          - path: spec.apiSpec.conjur.config.apiKey
            type: Secret
          - path: spec.apiSpec.hcv.config.token.token
            type: Secret
          - path: spec.apiSpec.hcv.config.cert.cert
            type: Secret
          - path: spec.apiSpec.hcv.config.cert.key
            type: Secret
          - path: spec.apiSpec.hcv.config.jwt.clientSecret
            type: Secret
          - path: spec.apiSpec.hcv.config.approle.secretID
            type: Secret
          - path: spec.apiSpec.hcv.config.gcp_iam.serviceAccount
            type: Secret
          - path: spec.apiSpec.hcv.config.aws_iam.accessKeyID
            type: Secret
          - path: spec.apiSpec.hcv.config.aws_iam.secretAccessKey
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayVaultsSDK
            fieldName: AIGatewayVaults
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayVaultRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayVaultRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      # Every writeOnly credential in the datastore configs is sourced from a
      # Secret, like AIGatewayModelProvider's cloud credentials. The token-vault
      # key is left alone: the OAS only accepts a {vault://...} reference there,
      # which is not a secret.
      - path: /v1/ai-gateways/{gatewayId}/datastores
        name: AIGatewayDatastore
        dataSources:
          - path: spec.apiSpec.redis-ce.config.password
            type: Secret
          - path: spec.apiSpec.redis-ce.config.cloudAuthentication.awsSecretAccessKey
            type: Secret
          - path: spec.apiSpec.redis-ce.config.cloudAuthentication.gcpServiceAccountJSON
            type: Secret
          - path: spec.apiSpec.redis-ce.config.cloudAuthentication.azureClientSecret
            type: Secret
          - path: spec.apiSpec.redis-ee.config.password
            type: Secret
          - path: spec.apiSpec.redis-ee.config.sentinelPassword
            type: Secret
          - path: spec.apiSpec.redis-ee.config.cloudAuthentication.awsSecretAccessKey
            type: Secret
          - path: spec.apiSpec.redis-ee.config.cloudAuthentication.gcpServiceAccountJSON
            type: Secret
          - path: spec.apiSpec.redis-ee.config.cloudAuthentication.azureClientSecret
            type: Secret
          - path: spec.apiSpec.vectordb.config.password
            type: Secret
          - path: spec.apiSpec.vectordb.config.sslCertKey
            type: Secret
        # Konnect rejects a change of name or type after creation. Both are
        # checked from the resource root where needed so that removing the
        # field cannot reset the value.
        cel:
          _validations:
            - "+kubebuilder:validation:XValidation:rule=\"!has(oldSelf.spec) || !has(oldSelf.spec.apiSpec) || !has(oldSelf.spec.apiSpec.type) || (has(self.spec) && has(self.spec.apiSpec) && has(self.spec.apiSpec.type) && self.spec.apiSpec.type == oldSelf.spec.apiSpec.type)\",message=\"type is immutable\",fieldPath=\".spec.apiSpec.type\""
          spec:
            apiSpec:
              redis-ce:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
              redis-ee:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
              vectordb:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
              token-vault:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayDatastoresSDK
            fieldName: AIGatewayDatastores
          # The list endpoint returns summaries that carry no labels, so
          # conflicts are recovered by matching the immutable name the API
          # echoes back. This mitigates
          # https://github.com/Kong/kong-operator/issues/3987.
          getForUID:
            rootUnion:
              unionField: Spec.APISpec.AIGatewayDatastoreConfig
              responseTypeField: Type
              cases:
                - typeValue: redis-ce
                  variantField: RedisCE
                  responseTypeValue: redis-ce
                  matchFields:
                    - objectField: Name
                      responseField: Name
                - typeValue: redis-ee
                  variantField: RedisEE
                  responseTypeValue: redis-ee
                  matchFields:
                    - objectField: Name
                      responseField: Name
                - typeValue: vectordb
                  variantField: VectorDB
                  responseTypeValue: vectordb
                  matchFields:
                    - objectField: Name
                      responseField: Name
                - typeValue: token-vault
                  variantField: TokenVault
                  responseTypeValue: token-vault
                  matchFields:
                    - objectField: Name
                      responseField: Name
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayDatastoreRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayDatastoreRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

  configuration.konghq.com/v1alpha1:
    categories:
      - kong
    # Don't generate groupversion_info.go for this API group — it is hand-written.
    # zz_generated_groupversion_info.go (addKnownTypesGenerated) is still emitted.
    generateGroupVersionInfo: false
    commonTypes:
      objectRef:
        import:
          path: github.com/kong/kong-operator/v2/api/common/v1alpha1
          alias: commonv1alpha1
    types:
      # Event Gateway APIs
      - path: /v1/event-gateways/{gatewayId}/data-plane-certificates
        name: EventGatewayDataPlaneCertificate
        dataSources:
          - path: spec.apiSpec.certificate
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayDataPlaneCertificatesSDK
            fieldName: EventGatewayDataPlaneCertificates
          requireClient: true
          # Konnect has no labels on Event Gateway data plane certificates, so
          # the lookup matches the certificate's content, which must be resolved
          # from its Secret: the generated lookup can't, see
          # controller/konnect/ops/ops_eventgatewaydataplanecertificate_lookup.go.
          skipGetForUID: true
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateEventGatewayDataPlaneCertificateRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateEventGatewayDataPlaneCertificateRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
          # Adds spec.parentRef, a reference to the gateway by group, kind and
          # name, next to the deprecated spec.gatewayRef.
          gatewayRef:
            fieldName: parentRef
            additionalKinds:
              - group: eventgateway.konghq.com
                version: v1alpha1
                kind: OnPremEventGateway
      - path: /v1/event-gateways/{gatewayId}/schema-registries
        name: EventGatewaySchemaRegistry
        dataSources:
          - path: spec.apiSpec.confluent.config.authentication.basic.password
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewaySchemaRegistriesSDK
            fieldName: EventGatewaySchemaRegistries
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.SchemaRegistryCreate
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewaySchemaRegistryRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
          # Adds spec.parentRef, a reference to the gateway by group, kind and
          # name, next to the deprecated spec.gatewayRef.
          gatewayRef:
            fieldName: parentRef
            additionalKinds:
              - group: eventgateway.konghq.com
                version: v1alpha1
                kind: OnPremEventGateway
      - path: /v1/event-gateways/{gatewayId}/tls-trust-bundles
        name: EventGatewayTLSTrustBundle
        dataSources:
          - path: spec.apiSpec.config.trustedCa
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayTLSTrustBundlesSDK
            fieldName: EventGatewayTLSTrustBundles
          create:

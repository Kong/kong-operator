# The main consumer enrolled in the consumer group, with its api-key
# credential sourced from a Secret.
#
# The Secret and the credential are listed BEFORE the consumer: the consumer's
# own create/update event is what drives a re-render, so the credential is
# (best-effort) already in the cache when that render happens. Once the
# AIGatewayConsumerCredential watch lands, the credential's own events make
# this ordering guarantee unnecessary rather than merely helpful.
#
# Re-applying this file restores the consumer's group membership after it has
# been removed (see the restore-group-membership step in chainsaw-test.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ($credential_secret_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: ($api_key_value)
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerCredential
metadata:
  name: ($credential_name)
  namespace: ($namespace)
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ($consumer_name)
  apiSpec:
    name: ($credential_name)
    displayName: ($credential_name)
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ($credential_secret_name)
        key: key
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumer
metadata:
  name: ($consumer_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  consumerGroups:
    - name: ($consumer_group_name)
  apiSpec:
    name: ($consumer_name)
    displayName: ($consumer_name)
    type: api-key

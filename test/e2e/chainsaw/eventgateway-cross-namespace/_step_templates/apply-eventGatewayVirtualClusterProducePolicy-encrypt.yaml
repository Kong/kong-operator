# Template for creating an encrypt EventGatewayVirtualClusterProducePolicy
# encrypting record values with a static key.
#
# Required bindings:
#   - policy_name, policy_namespace: The policy.
#   - virtual_cluster_name, virtual_cluster_namespace: Its virtual cluster.
#   - static_key_name, static_key_namespace: The static key.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-event-gateway-virtual-cluster-produce-policy-encrypt
spec:
  try:
    - apply:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayVirtualClusterProducePolicy
          metadata:
            name: ($policy_name)
            namespace: ($policy_namespace)
          spec:
            eventGatewayVirtualClusterRef:
              type: namespacedRef
              namespacedRef:
                name: ($virtual_cluster_name)
                namespace: ($virtual_cluster_namespace)
            apiSpec:
              type: encrypt
              encrypt:
                name: ($policy_name)
                config:
                  failureMode: error
                  partOfRecord:
                    - value
                  encryptionKey:
                    type: static
                    static:
                      key:
                        name: ($static_key_name)
                        namespace: ($static_key_namespace)

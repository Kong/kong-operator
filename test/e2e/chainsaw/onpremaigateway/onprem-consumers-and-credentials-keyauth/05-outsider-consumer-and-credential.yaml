# The outsider consumer: a valid api-key credential of its own, but never
# enrolled in the allowed consumer group. Secret first, credential second,
# consumer last (same ordering rationale as 03-consumer-and-credential.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: ($outsider_credential_secret_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: ($outsider_api_key_value)
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerCredential
metadata:
  name: ($outsider_credential_name)
  namespace: ($namespace)
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ($outsider_consumer_name)
  apiSpec:
    name: ($outsider_credential_name)
    displayName: ($outsider_credential_name)
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ($outsider_credential_secret_name)
        key: key
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumer
metadata:
  name: ($outsider_consumer_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($outsider_consumer_name)
    displayName: ($outsider_consumer_name)
    type: api-key

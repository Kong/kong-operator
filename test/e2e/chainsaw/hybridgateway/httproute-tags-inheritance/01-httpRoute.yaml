apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ($http_route_name)
  namespace: ($namespace)
  annotations:
    # The route's own tags. The Gateway's and GatewayClass's tags are added by
    # later patch steps, so the test can also check the re-reconcile paths.
    konghq.com/tags: route-tag
spec:
  parentRefs:
    - name: ($gateway_name)
      namespace: ($gateway_namespace)
  hostnames:
    - ($fqdn)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: ($echo_deployment_name)
          port: 1027

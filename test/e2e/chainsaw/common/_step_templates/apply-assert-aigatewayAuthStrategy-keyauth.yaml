# Template for creating and asserting an AIGatewayAuthStrategy of type key-auth.
#
# Required bindings:
#   - auth_strategy_name: Name of the AIGatewayAuthStrategy to create (also used as apiSpec name).
#   - namespace: Namespace where the AIGatewayAuthStrategy will be created.
#   - aigw_cp_name: Name of the KonnectAIGateway it attaches to (same namespace).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-aigateway-authstrategy-keyauth
spec:
  try:
    - apply:
        resource:
          apiVersion: aiconfiguration.konghq.com/v1alpha1
          kind: AIGatewayAuthStrategy
          metadata:
            name: ($auth_strategy_name)
            namespace: ($namespace)
          spec:
            aiGatewayRef:
              type: namespacedRef
              namespacedRef:
                name: ($aigw_cp_name)
            apiSpec:
              type: key-auth
              key-auth:
                name: ($auth_strategy_name)
                displayName: ($auth_strategy_name)
                config:
                  hideCredentials: Enabled
    - assert:
        resource:
          apiVersion: aiconfiguration.konghq.com/v1alpha1
          kind: AIGatewayAuthStrategy
          metadata:
            name: ($auth_strategy_name)
            namespace: ($namespace)
          status:
            (conditions[?type == 'Programmed']):
              - status: 'True'
            (id != null): true

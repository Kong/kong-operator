# request-termination answers 418 only when the condition matches the request path.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ($plugin_name)
  namespace: ($namespace)
plugin: request-termination
config:
  status_code: 418
condition: 'http.path.startsWith("/anything/blocked")'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ($http_route_name)
  namespace: ($namespace)
  annotations:
    konghq.com/strip-path: "false"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ($gateway_name)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything
      filters:
        - type: ExtensionRef
          extensionRef:
            group: configuration.konghq.com
            kind: KongPlugin
            name: ($plugin_name)
      backendRefs:
        - name: ($httpbin_deployment_name)
          port: 80

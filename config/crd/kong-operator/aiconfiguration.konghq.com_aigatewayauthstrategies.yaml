                        maxLength: 256
                        minLength: 1
                        pattern: ^[A-Za-z0-9._:@-]{1,256}$
                        type: string
                    required:
                    - displayName
                    - name
                    type: object
                  openid-connect:
                    description: OpenIDConnect configuration.

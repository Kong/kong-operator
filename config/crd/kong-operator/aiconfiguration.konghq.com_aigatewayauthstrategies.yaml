                                    maxLength: 253
                                    type: string
                                  azureClientID:
                                    description: |-
                                      Azure Client ID to be used for authentication when `auth_provider` is set to
                                      `azure`.
                                    maxLength: 253
                                    type: string
                                  azureClientSecret:
                                    description: |-
                                      Azure Client Secret to be used for authentication when `auth_provider` is

name: ack CRD breaking change

on:
  pull_request:
    types:
      - labeled
      # The check reads the label while it runs, so removing the label must re-run it as well:
      # otherwise an acknowledged check stays green after the acknowledgement is gone.
      - unlabeled

permissions:
  contents: read

jobs:
  rerun-failed-tests:
    if: ${{ github.event.label.name == 'ack_crd_breaking_change' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The rerun endpoint needs "Actions: write", which GITHUB_TOKEN is not granted here: the call
      # goes through the App, so the App must hold that permission.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
          permission-actions: write
      - name: Rerun CRD breaking-change check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Any completed conclusion, not only failure: the label was just added or removed, so a
          # green check can be the stale result of the opposite label state.
          run_ids="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow tests.yaml \
            --limit 50 \
            --json conclusion,createdAt,databaseId,event,headSha,status \
            --jq '[.[] | select(.headSha == env.HEAD_SHA and .event == "pull_request" and .status == "completed")] | sort_by(.createdAt) | reverse | .[].databaseId')"

          crd_job_id=""
          for candidate_run_id in ${run_ids}; do
            crd_job_id="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "verify / crd-breaking-changes" and (.conclusion == "success" or .conclusion == "failure")) | .id' | head -n 1)"

            if [[ -n "${crd_job_id}" ]]; then
              break
            fi
          done

          if [[ -z "${crd_job_id}" ]]; then
            echo "No completed CRD breaking-change check found for ${HEAD_SHA}."
            exit 0
          fi

          # Re-running a job also re-runs dependent jobs, so the aggregate required
          # `passed` job is recalculated after crd-breaking-changes finishes.
          echo "Rerunning CRD breaking-change job ${crd_job_id}."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${crd_job_id}/rerun"

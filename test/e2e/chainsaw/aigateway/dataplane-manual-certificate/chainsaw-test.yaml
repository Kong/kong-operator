apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-dataplane-manual-certificate
spec:
  description: |
    Stands up a Konnect AIGateway control plane, generates a self-signed TLS
    certificate/key pair, stores it in a Secret, and attaches it to the control
    plane via a manually-provided AIGatewayDataPlaneCertificate (instead of relying
    on the operator's auto-provisioned certificate). Verifies the certificate
    reaches Programmed=True and that an AIGatewayDataPlane still provisions
    successfully (Ready=True) against the control plane using the custom certificate.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: cert_secret_name
      value: (join('-', [($test_name), 'dp-cert']))
    - name: cert_secret_namespace
      value: ($namespace)
    - name: dp_cert_name
      value: (join('-', [($test_name), 'dp-cert']))
  steps:
    - name: 1-Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: 2-Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: 3-Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: 4-Generate-and-create-tls-secret
      bindings:
        - name: sni_hostname
          value: (join('', [($test_name), '.example.com']))
      use:
        template: ../../common/_step_templates/apply-assert-tlsSecret.yaml
    - name: 5-Create-aigateway-dataplane-certificate
      try:
        - apply:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayDataPlaneCertificate
              metadata:
                name: ($dp_cert_name)
                namespace: ($namespace)
              spec:
                aiGatewayRef:
                  type: namespacedRef
                  namespacedRef:
                    name: ($aigw_cp_name)
                apiSpec:
                  title: ($dp_cert_name)
                  description: Manually-provided AI Gateway Data Plane Certificate (chainsaw e2e)
                  cert:
                    type: secretRef
                    secretRef:
                      name: ($cert_secret_name)
                      key: tls.crt
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayDataPlaneCertificate
              metadata:
                name: ($dp_cert_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (id != null): true
    - name: 6-Create-aigateway-dataplane
      bindings:
        - name: namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: aigateway-dataplane-manual-certificate
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

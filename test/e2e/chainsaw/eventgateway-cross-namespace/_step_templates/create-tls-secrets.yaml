# Template for creating, in a namespace, the Secrets of the TLS entities, each
# of certificates of its own: the certificate authorities client-ca and
# data-plane-ca, and server-tls, a server certificate for keg-kafka issued by
# another certificate authority. Each is a kubernetes.io/tls Secret, labeled
# to be read by the operator.
#
# The certificates come from common/scripts/generate_mtls_certificate_chain.sh,
# run once per certificate authority: client-ca and data-plane-ca are the
# certificate authorities of a run, server-tls the server certificate of
# another. Not common/apply-assert-mtlsCertChainSecrets.yaml: it finds its
# script relative to a test two directories below the suites, while the tests
# of this suite are three, and keeps the key of no certificate authority.
#
# Required bindings:
#   - secret_namespace: Namespace of the Secrets.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: create-tls-secrets
spec:
  try:
    - description: The certificate authority of the Secret client-ca.
      script:
        env:
          - name: CA_COMMON_NAME
            value: client-ca
          - name: SERVER_COMMON_NAME
            value: unused-server
          - name: CLIENT_COMMON_NAME
            value: unused-client
        content: |
          bash ../../../common/scripts/generate_mtls_certificate_chain.sh
        outputs:
          - name: client_ca
            value: (json_parse($stdout))
        check:
          (json_parse($stdout).ca_cert != null): true
          (json_parse($stdout).ca_key != null): true
    - description: The certificate authority of the Secret data-plane-ca.
      script:
        env:
          - name: CA_COMMON_NAME
            value: data-plane-ca
          - name: SERVER_COMMON_NAME
            value: unused-server
          - name: CLIENT_COMMON_NAME
            value: unused-client
        content: |
          bash ../../../common/scripts/generate_mtls_certificate_chain.sh
        outputs:
          - name: data_plane_ca
            value: (json_parse($stdout))
        check:
          (json_parse($stdout).ca_cert != null): true
          (json_parse($stdout).ca_key != null): true
    - description: The server certificate of the Secret server-tls, issued by a certificate authority of its own.
      script:
        env:
          - name: CA_COMMON_NAME
            value: server-ca
          - name: SERVER_COMMON_NAME
            value: keg-kafka
          - name: CLIENT_COMMON_NAME
            value: unused-client
        content: |
          bash ../../../common/scripts/generate_mtls_certificate_chain.sh
        outputs:
          - name: server
            value: (json_parse($stdout))
        check:
          (json_parse($stdout).server_cert != null): true
          (json_parse($stdout).server_key != null): true
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: client-ca
            namespace: ($secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: kubernetes.io/tls
          stringData:
            tls.crt: ($client_ca.ca_cert)
            tls.key: ($client_ca.ca_key)
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: data-plane-ca
            namespace: ($secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: kubernetes.io/tls
          stringData:
            tls.crt: ($data_plane_ca.ca_cert)
            tls.key: ($data_plane_ca.ca_key)
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: server-tls
            namespace: ($secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: kubernetes.io/tls
          stringData:
            tls.crt: ($server.server_cert)
            tls.key: ($server.server_key)

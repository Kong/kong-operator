                        maxProperties: 50
                        type: object
                      managedBy:
                        additionalProperties:
                          description: ManagedByValue is the value type for ManagedBy.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$
                          type: string
                        description: |-
                          Stores information about what manages this entity, such as the tool or

apiVersion: v1
kind: Secret
metadata:
  name: ($aigw_policy_secretref_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  config: |
    add:
      headers:
        - "Modified-By-Policy-Secretref:Kong-Operator-Chainsaw-Test"
---
# An AIGatewayPolicy whose config is sourced from a Secret (secretRef).
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata:
  name: ($aigw_policy_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: response-transformer
    displayName: "AIGateway Policy Response Transformer"
    enabled: "Enabled"
    global: "Disabled"
    name: ($aigw_policy_name)
    config:
      type: secretRef
      secretRef:
        name: ($aigw_policy_secretref_name)
        key: config

# A TLS listener policy requiring client certificates signed by the CAs of the
# EventGatewayTLSTrustBundle above, referenced through namespacedRef (resolved
# to its Konnect ID). While the policy references it, deleting the trust
# bundle is blocked.
kind: EventGatewayListenerPolicy
apiVersion: configuration.konghq.com/v1alpha1
metadata:
  name: cp-event-1-mtls-listener
  namespace: default
spec:
  apiSpec:
    type: tlsServer
    tlsServer:
      name: cp-event-1-mtls-listener-policy
      config:
        certificates:
          - certificate:
              type: secretRef
              secretRef:
                name: cp-event-1-mtls-listener-tls
                key: tls.crt
            key:
              type: secretRef
              secretRef:
                name: cp-event-1-mtls-listener-tls
                key: tls.key
        clientAuthentication:
          mode: required
          tlsTrustBundles:
            # An EventGatewayTLSTrustBundle in the same namespace. A trust
            # bundle created outside the cluster can be referenced by its
            # Konnect id or name instead.
            - namespacedRef:
                name: cp-event-1-client-ca
  eventGatewayListenerRef:
    type: namespacedRef
    namespacedRef:
      name: cp-event-1-mtls-listener

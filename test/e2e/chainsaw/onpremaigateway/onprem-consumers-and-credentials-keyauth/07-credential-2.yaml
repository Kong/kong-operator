# A second api-key credential for the main consumer (credential rotation).
# The AIGatewayConsumerCredential watch already exists: the consumer
# reconciler maps credential create events to consumer re-renders
# (credentialwatch), so the gateway is re-rendered with the new key and the
# Accept-request-with-second-credential step passes on current code.
apiVersion: v1
kind: Secret
metadata:
  name: ($credential_secret_name_2)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  key: ($api_key_value_2)
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayConsumerCredential
metadata:
  name: ($credential_name_2)
  namespace: ($namespace)
spec:
  aiGatewayConsumerRef:
    type: namespacedRef
    namespacedRef:
      name: ($consumer_name)
  apiSpec:
    name: ($credential_name_2)
    displayName: ($credential_name_2)
    type: api-key
    apiKey:
      type: secretRef
      secretRef:
        name: ($credential_secret_name_2)
        key: key

# Template for creating an encryptFields EventGatewayVirtualClusterProducePolicy, child of a
# schemaValidation one, encrypting a field with a static key.
#
# Required bindings:
#   - policy_name, policy_namespace: The policy.
#   - virtual_cluster_name, virtual_cluster_namespace: Its virtual cluster.
#   - parent_policy_name, parent_policy_namespace: Its parent, a schemaValidation
#     policy of the same virtual cluster.
#   - static_key_name, static_key_namespace: The static key.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-event-gateway-virtual-cluster-produce-policy-encrypt-fields
spec:
  try:
    - apply:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayVirtualClusterProducePolicy
          metadata:
            name: ($policy_name)
            namespace: ($policy_namespace)
          spec:
            eventGatewayVirtualClusterRef:
              type: namespacedRef
              namespacedRef:
                name: ($virtual_cluster_name)
                namespace: ($virtual_cluster_namespace)
            apiSpec:
              type: encryptFields
              parentPolicyRef:
                kind: EventGatewayVirtualClusterProducePolicy
                name: ($parent_policy_name)
                namespace: ($parent_policy_namespace)
              encryptFields:
                name: ($policy_name)
                config:
                  failureMode: reject
                  encryptFields:
                    - paths:
                        type: array
                        array:
                          - match: card
                      encryptionKey:
                        type: static
                        static:
                          key:
                            name: ($static_key_name)
                            namespace: ($static_key_namespace)

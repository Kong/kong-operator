name: Reusable release
run-name: "Release ${{ format('{0} (type: {1}) (branch: {2})', inputs.tag, inputs.release-type, inputs.base) }} "

on:
  workflow_call:
    secrets:
      dockerhub-push-token:
        required: true
        description: "The token to push images to Docker Hub"
      gpg-private-key:
        required: true
        description: "The GPG private key to sign the commits"
      gpg-passphrase:
        required: true
        description: "The GPG passphrase to sign the commits"
      gh-app-private-key:
        required: true
        description: "The GitHub App private key to create the release PR"
      konnect-pat:
        required: true
        description: "The Konnect PAT to use in the tests"
      op-service-account-token:
        required: false
        description: "The 1Password service account token to fetch the Kong Enterprise License. If left empty, no license will be fetched"
      kong-license-data:
        required: false
        description: "The cached Kong Enterprise License, used in preference to fetching it from 1Password. Refreshed by the kong-license-refresh workflow"
    inputs:
      dockerhub-push-username:
        description: "The username to push images to Docker Hub"
        type: string
        required: true
      tag:
        description: The version to release (e.g. v1.2.3)
        type: string
        required: true
      base:
        description: The base branch from which to release and against which to create a release PR.
        type: string
        default: 'main'
        required: false
      latest:
        description: |
          Whether to mark this release latest.
          Only set to true if this release is the current maximum version.
          If a newer major or minor version has been released (e.g., 2.2 is released),
          do NOT set this to true when releasing an older branch (e.g., 2.1.1),
          otherwise the docs will be overwritten.
        type: boolean
        default: false
      release-type:
        description: Whether to make a created release a pre-release
        required: true
        # Reusable workflows do not support choice type, so we use string instead.
        # Allowed values: prerelease, release.
        type: string
      image-name:
        description: "The name of the image to push to Docker Hub"
        type: string
        required: true
      registry:
        description: |
          Registry to use for image naming, signing and provenance.
          When using docker hub set it to 'docker.io'.
        type: string
        required: true
      additional-build-contexts:
        description: >
          Additional build context to include in the build (format name=path),
          it's used for EE build to additionaly include path to OSS repo.
        required: false
        type: string
      verify-image-script:
        description: Path to the script that will be used to verify the built image.
        required: false
        type: string
        default: ./scripts/verify-version.sh
      regenerate-bundle:
        description: "Whether to regenerate the bundle before creating the release PR"
        type: boolean
        default: false
      regenerate-manifests:
        description: "Whether to regenerate the manifests before creating the release PR"
        type: boolean
        default: false
      release-issue-number:
        description: "The release issue number to comment on with the docs PR link (e.g. 3622)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  github-app-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
            developer.konghq.com

  semver:
    outputs:
      fullversion: ${{ steps.semver_parser.outputs.fullversion }}
      major: ${{ steps.semver_parser.outputs.major }}
      minor: ${{ steps.semver_parser.outputs.minor }}
      patch: ${{ steps.semver_parser.outputs.patch }}
      prerelease: ${{ steps.semver_parser.outputs.prerelease }}
      # NOTE: true for N.M.P with P != 0 and for rapid patches (e.g. 2.4.0-rapid.2.1).
      # The first release of a rapid line (e.g. 2.4.0-rapid.2.0) is not a patch.
      is-patch: ${{ steps.release-kind.outputs.is-patch }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint a short-lived token in the job that uses it.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
            developer.konghq.com
      - uses: mukunku/tag-exists-action@5c39604fe8aef7e65acb6fbcf96ec580f7680313 # v1.7.0
        id: check-tag
        name: Check if tag already exists
        with:
          tag: ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Fail if tag already exists
        if: ${{ steps.check-tag.outputs.exists == 'true' }}
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@7784200024d6b3fc01253e617ec0168daf603de3 # v1.4.7
        with:
          input_string: ${{ inputs.tag }}
          version_extractor_regex: 'v(.*)$'

      # NOTE: rapid releases must use the N.M.0-rapid.K.P form: rapid.K.0 starts
      # the rapid line K, rapid.K.P with P > 0 patches it. rapid.K is rejected so
      # that each rapid line has a single spelling. The rapid prefix is matched
      # case-insensitively so that e.g. Rapid.2 is rejected rather than released
      # as a plain prerelease.
      - name: Validate rapid release version format
        env:
          TAG: ${{ inputs.tag }}
          PATCH: ${{ steps.semver_parser.outputs.patch }}
          PRERELEASE: ${{ steps.semver_parser.outputs.prerelease }}
        run: |
          if [[ "${PRERELEASE,,}" == rapid* ]] && [[ "$PATCH" != "0" || ! "$PRERELEASE" =~ ^rapid\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid rapid release version: $TAG"
            echo "Rapid releases must use the N.M.0-rapid.K.P form, e.g. v2.4.0-rapid.2.0 or v2.4.0-rapid.2.1"
            exit 1
          fi

      - name: Determine whether this is a patch release
        id: release-kind
        env:
          PATCH: ${{ steps.semver_parser.outputs.patch }}
          PRERELEASE: ${{ steps.semver_parser.outputs.prerelease }}
        run: |
          if [[ "$PATCH" != "0" || "$PRERELEASE" =~ ^rapid\.[0-9]+\.[1-9][0-9]*$ ]]; then
            echo "is-patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-patch=false" >> "$GITHUB_OUTPUT"
          fi

  build-push-images:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/__build-workflow.yaml
    secrets:
      dockerhub-token: ${{ secrets.dockerhub-push-token }}
      gh-pat: ${{ needs.github-app-token.outputs.token }}
    # NOTE: needs semver so that a tag rejected there (e.g. a malformed rapid
    # version) does not get images pushed.
    needs:
    - github-app-token
    - semver
    with:
      registry: ${{ inputs.registry }}
      username: ${{ inputs.dockerhub-push-username }}
      image-name: ${{ inputs.image-name }}
      additional-build-contexts: ${{ inputs.additional-build-contexts }}
      push: true
      slack-send: true
      latest: ${{ inputs.latest }}
      tag: ${{ inputs.tag }}
      verify-image-script: ${{ inputs.verify-image-script }}

  # Kept out of __build-workflow.yaml: a reusable workflow requesting id-token fails validation
  # on callers that cannot grant it, and fork PRs always get none.
  sign-image:
    needs: [build-push-images]
    if: ${{ needs.build-push-images.outputs.index_digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing via the GitHub OIDC token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.dockerhub-push-username }}
          password: ${{ secrets.dockerhub-push-token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: cosign trades this job's OIDC token for a Fulcio certificate; no key in the repo.
      # Bundle format publishes the signature as an OCI 1.1 referrer in the image's own repository,
      # so `cosign verify <image>` finds it with no extra configuration.
      # Subject is the index digest, never the per-arch digests.
      - name: Sign the image index
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          DIGEST: ${{ needs.build-push-images.outputs.index_digest }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive --new-bundle-format=true \
            -a "sha=${COMMIT}" \
            -a "workflow=${WORKFLOW}" \
            -a "repo=${REPO}" \
            "${IMAGE}@${DIGEST}"

      # Fails the run if the signature just published cannot be verified.
      - name: Verify the image index signature
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          DIGEST: ${{ needs.build-push-images.outputs.index_digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  # By tag, not SHA, on purpose: the generator's detect-workflow step needs a tag ref
  # (slsa-github-generator#3498).
  image-provenance:
    needs: [build-push-images]
    if: ${{ needs.build-push-images.outputs.index_digest != '' }}
    permissions:
      contents: read
      actions: read # the generator reads workflow run info to build provenance
      packages: write # required for publishing provenance, see the generator's known issues
      id-token: write # keyless signing of the provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      # Must carry neither a tag nor a digest.
      image: ${{ inputs.registry }}/${{ inputs.image-name }}
      digest: ${{ needs.build-push-images.outputs.index_digest }}
      registry-username: ${{ inputs.dockerhub-push-username }}
    secrets:
      registry-password: ${{ secrets.dockerhub-push-token }}

  # The scans produced by __build-workflow.yaml are workflow artifacts, which expire. Collecting
  # them here is what lets the attest job publish them on the image itself.
  create-security-report-artifact:
    needs: [build-push-images]
    if: ${{ needs.build-push-images.outputs.index_digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The run context travels with the reports so a consumer can tell where the image came from.
      # `event` and `token` are dropped: they carry the triggering payload and the run token.
      - name: Create the run metadata report
        env:
          GITHUB_CONTEXT_JSON: ${{ toJson(github) }}
          RUNNER_CONTEXT_JSON: ${{ toJson(runner) }}
        run: |
          mkdir -p security-reports
          jq -n --argjson github "$GITHUB_CONTEXT_JSON" --argjson runner "$RUNNER_CONTEXT_JSON" \
            '$github + {"runner": $runner} | del(.event, .token)' > security-reports/run-info.json

      - name: Download the source scans
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: source-*
          path: security-reports/
          merge-multiple: true
      - name: Download the image scans
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-linux-*
          path: security-reports/
          merge-multiple: true

      - name: Upload the security report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: security-reports
          name: security-reports
          retention-days: 1

  attest-security-artifacts:
    needs: [build-push-images, create-security-report-artifact]
    if: ${{ needs.build-push-images.outputs.index_digest != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless attestation via the GitHub OIDC token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.dockerhub-push-username }}
          password: ${{ secrets.dockerhub-push-token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the security report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-reports
          path: security-reports

      # One attestation per report, keyed by predicate type: that is what a consumer asks for with
      # `cosign verify-attestation --type <predicate>`. A missing report fails the loop.
      - name: Attest the security reports
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          DIGEST: ${{ needs.build-push-images.outputs.index_digest }}
        run: |
          set -euo pipefail
          missing=""
          while IFS=, read -r predicate type; do
            if [ ! -f "security-reports/${predicate}" ]; then
              missing="${missing} ${predicate}"
              continue
            fi
            echo "Attesting ${predicate} as ${type}"
            cosign attest --yes --new-bundle-format=true \
              --predicate "security-reports/${predicate}" \
              --type "${type}" \
              "${IMAGE}@${DIGEST}"
          done <<'EOF'
          source-sbom.cyclonedx.json,cyclonedx
          source-sbom.spdx.json,spdxjson
          source-sbom.cyclonedx.json,https://cyclonedx.org/source
          source-sbom.spdx.json,https://spdx.dev/Document/source
          image-linux-amd64-sbom.cyclonedx.json,https://cyclonedx.org/bom/image/amd64
          image-linux-amd64-sbom.spdx.json,https://spdx.dev/Document/image/amd64
          image-linux-arm64-sbom.cyclonedx.json,https://cyclonedx.org/bom/image/arm64
          image-linux-arm64-sbom.spdx.json,https://spdx.dev/Document/image/arm64
          source-cve-report.sarif,https://cosign.sigstore.dev/sarif/vuln/source
          image-linux-amd64-cve-report.sarif,https://cosign.sigstore.dev/sarif/vuln/image/amd64
          image-linux-arm64-cve-report.sarif,https://cosign.sigstore.dev/sarif/vuln/image/arm64
          image-linux-amd64-cis-report.json,https://cisecurity.org/docker/amd64
          image-linux-arm64-cis-report.json,https://cisecurity.org/docker/arm64
          run-info.json,https://konghq.com/build-metadata
          EOF
          if [ -n "${missing}" ]; then
            echo "::error::reports missing, nothing to attest for:${missing}"
            exit 1
          fi
          cosign tree "${IMAGE}@${DIGEST}"

      # Refuses to release an unattested image: checks what is published on the image itself,
      # not that the steps above ran.
      - name: Verify the image carries the attestations
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}
          DIGEST: ${{ needs.build-push-images.outputs.index_digest }}
        run: |
          set -euo pipefail
          types=$(cosign download attestation "${IMAGE}@${DIGEST}" \
            | jq -r '(.dsseEnvelope.payload // .payload) | @base64d | fromjson | .predicateType' | sort -u)
          if [ -z "${types}" ]; then
            echo "::error::no attestations found on ${IMAGE}@${DIGEST}: refusing to release an unattested image."
            exit 1
          fi
          # The provenance is signed by the generator and lives in the legacy .att tag that cosign's
          # verify path does not read; its job gates this one and consumers use slsa-verifier.
          for type in ${types}; do
            case "${type}" in
              https://sigstore.dev/cosign/sign/v1) continue ;;
              https://slsa.dev/*) continue ;;
            esac
            echo "Verifying attestation of type: ${type}"
            cosign verify-attestation --type "${type}" \
              --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${IMAGE}@${DIGEST}" > /dev/null
          done

  test-integration-current-kubernetes:
    runs-on: ubuntu-latest
    name: "test-integration-current-kubernetes"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
            developer.konghq.com
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git for private repositories (this is needed by repositories that include this workflow and have other private dependencies)
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com".insteadOf "https://github.com"

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-mise
        with:
          install: false

      # This step is required to check whether either license credential is available and export a
      # boolean output to be used in the next step. It's because we cannot use a secret in a step's
      # condition. See: https://github.com/actions/runner/issues/520
      - name: Check Kong license credentials available
        id: check-license-creds
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          CACHED_LICENSE: ${{ secrets.kong-license-data }}
        run: |
          # If either the cached license or the 1Password token is set, return true.
          if [ -n "$CACHED_LICENSE" ] || [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
              echo "provided=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Kong Enterprise License
        if: steps.check-license-creds.outputs.provided == 'true'
        id: get-license
        uses: ./.github/actions/kong-license
        with:
          cached-license: ${{ secrets.kong-license-data }}
          # OP (1Password) token is used to fetch the Kong Enterprise License from 1Password
          # when the cached license is missing or expired.
          op-token: ${{ secrets.op-service-account-token }}
          # This workflow tolerates running without a license at all.
          allow-empty: "true"

      - name: integration tests
        run: make test.integration-ko
        env:
          KONG_LICENSE_DATA: ${{ steps.get-license.outputs.license || '' }}
          KONG_TEST_KONNECT_ACCESS_TOKEN: ${{ secrets.konnect-pat }}
          KONG_TEST_KONNECT_SERVER_URL: us.api.konghq.tech

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-integration
          path: /tmp/ktf-diag*
          if-no-files-found: ignore

  test-e2e-current-kubernetes:
    permissions:
      contents: read
      actions: read
    needs:
      - semver
      - build-push-images
    uses: ./.github/workflows/falco-analyzed-e2e.yaml
    with:
      test-image: ${{ needs.build-push-images.outputs.full_tag }}
    secrets:
      konnect-pat: ${{ secrets.konnect-pat }}
      op-service-account-token: ${{ secrets.op-service-account-token }}
      kong-license-data: ${{ secrets.kong-license-data }}

  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - semver
      - build-push-images
      # An unsigned or unattested index must not open a release PR. Safe only because these jobs
      # are never skipped while `push: true` below stays hardcoded: `needs:` propagates a skip.
      - sign-image
      - image-provenance
      - attest-security-artifacts
      - test-integration-current-kubernetes
      - test-e2e-current-kubernetes
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
            developer.konghq.com
      - name: Check if we're not trying to trigger a major/minor release from non main
        if: ${{ inputs.base != 'main' && needs.semver.outputs.is-patch != 'true' }}
        env:
          FULLVERSION: ${{ needs.semver.outputs.fullversion }}
          BASE: ${{ inputs.base }}
        run: |
          echo "Trying to release: $FULLVERSION from $BASE"
          echo "Major/minor releases can only be triggered from main branch"
          exit 1

      - name: Check if we're not trying to trigger a patch release from main
        if: ${{ inputs.base == 'main' && needs.semver.outputs.is-patch == 'true' }}
        env:
          FULLVERSION: ${{ needs.semver.outputs.fullversion }}
          BASE: ${{ inputs.base }}
        run: |
          echo "Trying to release: $FULLVERSION from $BASE"
          echo "Patch releases can only be triggered from non main, release branch"
          exit 1

      # Use the branch set via inputs as a base for the release.
      # If anything needs to be fixed before the release, it should be done on the base branch
      # before the release workflow is triggered.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base }}

      - name: Configure Git for private repositories (this is needed by repositories that include this workflow and have other private dependencies)
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com".insteadOf "https://github.com"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ensure bumped version is set in VERSION file
        env:
          VERSION: ${{ needs.semver.outputs.fullversion }}
        run: |
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo ${VERSION} > VERSION

      - uses: ./.github/actions/setup-mise
        with:
          install: false

      - name: Run make generate
        if: ${{ inputs.regenerate-manifests }}
        run: |
          make \
            generate.api \
            generate.api-from-oas \
            generate.crds \
            generate.crd-kustomize \
            generate.docs \
            generate.cli-arguments-docs

      # Generated manifests are part of the release PR.
      - name: Generate manifests
        if: ${{ inputs.regenerate-manifests }}
        run: make manifests

      # Chart and golden tests for it includes information about current KO version.
      - name: Update version in chart and its tests
        run: make test.charts.golden.update

      # The generated bundle is part of the release PR.
      # This is done locally in this job, to avoid including unintended changes.
      # If anything needs to be fixed before the release, it should be done on the base branch
      # before the release workflow is triggered.
      - name: Generate bundle
        if: ${{ inputs.regenerate-bundle }}
        run: make bundle

      - name: GPG sign the commits
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit message
        env:
          MSG: "${{ inputs.latest && format('chore({0}): [bot] {1}, [latest]', inputs.release-type, env.VERSION) || format('chore({0}): [bot] {1}', inputs.release-type, env.VERSION)}}"
        run: |
          echo "MSG=${MSG}" >> $GITHUB_ENV

      # PRs will update the version file and manifests
      - name: Create a release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: .
          branch: release/${{ needs.semver.outputs.fullversion }}/pr-${{ inputs.base }}
          base: ${{ inputs.base }}
          add-paths: |
            VERSION
            config
            charts
          commit-message: "${{ env.MSG }}"
          committer: Kong's Team k8s bot <team-k8s+github-bot@konghq.com>
          author: Kong's Team k8s bot <team-k8s+github-bot@konghq.com>
          signoff: true
          delete-branch: true
          title: "${{ env.MSG }}"
          body: "${{ env.MSG }}"

  create-docs-pr:
    runs-on: ubuntu-latest
    if: ${{ inputs.latest }}
    env:
      DOCS_REPO: developer.konghq.com
      DOCS_REPO_PATH_CLI_ARGS_DOC: app/operator/reference/configuration-options.md
      DOCS_REPO_PATH_CRD_DOC: app/operator/reference/custom-resources.md
      DOCS_REPO_PATH_CHANGELOG: app/operator/changelog.md
    needs:
      - semver
      - create-release-pr
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
            developer.konghq.com

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.DOCS_REPO }}
          path: ${{ env.DOCS_REPO }}

      - name: update cli argument docs
        run: |
          cp ./docs/cli-arguments-for-developer-konghq-com.md "$DOCS_REPO/$DOCS_REPO_PATH_CLI_ARGS_DOC"

      - name: update CRD reference docs
        run: |
          mkdir -p "$(dirname "$DOCS_REPO/$DOCS_REPO_PATH_CRD_DOC")"
          ./scripts/apidocs-gen/post-process-for-konghq.sh \
            ./docs/all-api-reference.md \
            "$DOCS_REPO/$DOCS_REPO_PATH_CRD_DOC" \
            "$DOCS_REPO"

      - name: update changelog
        run: |
          mkdir -p "$(dirname "$DOCS_REPO/$DOCS_REPO_PATH_CHANGELOG")"
          ./scripts/post-process-changelog-for-konghq.sh \
            ./CHANGELOG.md \
            "$DOCS_REPO/$DOCS_REPO_PATH_CHANGELOG"

      - name: Detect changes
        id: detect-changes
        run: |
          if [[ $(cd $DOCS_REPO && git status --porcelain) ]]; then
            echo "Changes detected in $DOCS_REPO repo"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in $DOCS_REPO repo"
          fi

      - name: Create Pull Request
        id: create-docs-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.detect-changes.outputs.has_changes
        with:
          path: ${{ env.DOCS_REPO }}
          commit-message: "chore(deps): update ${{github.repository}} docs from repo source"
          signoff: true
          branch: chore/docs-sync-${{github.repository}}
          body: |
            Syncing docs from source code .

            Generated by [action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          delete-branch: true
          title: "docs(${{github.repository}}): update ${{github.repository}} docs"
          draft: false
          token: ${{ steps.app-token.outputs.token }}
          committer: Kong's Team k8s bot <team-k8s+github-bot@konghq.com>
          author: Kong's Team k8s bot <team-k8s+github-bot@konghq.com>
          labels: team-k8s, product-kgo

      - name: Comment on release issue with docs PR link
        if: steps.create-docs-pr.outputs.pull-request-url && inputs.release-issue-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.release-issue-number }}
          REPOSITORY: ${{ github.repository }}
          PR_URL: ${{ steps.create-docs-pr.outputs.pull-request-url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "🤖 Docs PR created: $PR_URL

          Please review and merge it to update the official documentation (CLI args, CRD reference, changelog)."

name: Sync charts to charts repo
concurrency:
  # Run only for most recent commit in PRs but for all tags and commits on main
  # Ref: https://docs.github.com/en/actions/using-jobs/using-concurrency
  group: ${{ github.workflow }}-${{ github.head_ref || ( github.ref_type == 'tag' && github.ref_name || github.sha ) }}
  cancel-in-progress: true
on:
  push:
    paths:
      - charts/**
      - .github/workflows/charts-sync.yaml
    branches:
      - release/2.4.x
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mint the token in the same job that uses it: app tokens do not survive
      # being passed between jobs or through reusable-workflow boundaries.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            charts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kong/charts
          path: charts-repo
          token: ${{ steps.app-token.outputs.token }}
      - name: Sync charts/kong-operator
        # --delete removes files from the charts repo that no longer exist here.
        run: rsync -a --delete charts/kong-operator/ charts-repo/charts/kong-operator/
      # NOTE: sign-commits makes the action create the commit through the GitHub API,
      # so it is verified and attributed to the App, without a force push.
      # It replaces BetaHuhn/repo-file-sync-action, which read every changed file
      # into a 4 MiB stdout buffer and failed once the chart golden snapshots
      # (charts/kong-operator/ci/__snapshots__) outgrew it.
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: charts-repo
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: main
          branch: repo-sync/kong-operator/default
          delete-branch: true
          commit-message: "chore(kong-operator): sync charts/kong-operator from Kong/kong-operator"
          title: "chore(kong-operator): sync charts/kong-operator from Kong/kong-operator"
          labels: sync
          body: |
            ### Sync charts from ${{ github.repository }}

            This PR was automatically generated by the `sync-charts` workflow.
            It syncs the charts/ directory from the ${{ github.repository }} repository.

            Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))

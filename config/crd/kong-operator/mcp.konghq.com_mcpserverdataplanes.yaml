  annotations:
    kubernetes-configuration.konghq.com/channels: kong-operator
    kubernetes-configuration.konghq.com/version: v2.3.0-rc.3
  name: mcpserverdataplanes.mcp.konghq.com
spec:
  group: mcp.konghq.com
  names:
    categories:
    - kong
    kind: MCPServerDataPlane
    listKind: MCPServerDataPlaneList
    plural: mcpserverdataplanes
    shortNames:
    - mcpdp
    singular: mcpserverdataplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The Resource is ready
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServerDataPlane is the Schema for the MCP Server data planes API.
          It manages a MCP Server Deployment that uses Konnect control plane configuration
          via a referenced MCPServer resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of MCPServerDataPlane.
            properties:
              deployment:
                description: |-
                  Deployment configures the Deployment: image, replicas, resources,
                  extra env vars, volume mounts, etc.
                properties:
                  replicas:
                    description: Replicas describes the number of desired pods.
                    format: int32
                    type: integer
                type: object
              mcpServerRef:
                description: |-
                  MCPServerRef references the control plane this MCPServerDataPlane connects to.
                  The type field identifies which kind of MCPServer is being referenced.
                  Currently only konnectNamespacedRef is supported, which references a
                  MCPServer resource in the same namespace.
                properties:
                  konnectNamespacedRef:
                    description: |-
                      KonnectNamespacedRef references a MCPServer resource in the same namespace.
                      Must be set when type is konnectNamespacedRef; validated by CEL rules on this struct.
                    properties:
                      name:
                        description: Name is the name of the MCPServer resource.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    description: |-
                      Type indicates the type of the control plane being referenced.
                      Currently only konnectNamespacedRef is supported.
                    enum:
                    - konnectNamespacedRef
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: konnectNamespacedRef must be set when type is konnectNamespacedRef
                  rule: 'self.type == ''konnectNamespacedRef'' ? has(self.konnectNamespacedRef)
                    : true'
            required:
            - mcpServerRef
            type: object
          status:

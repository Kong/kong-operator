# Template for creating and asserting an HTTP AIGatewayAgent route to the shared
# go-echo backend, referencing a KonnectAIGateway control plane.
#
# Required bindings:
#   - namespace: Namespace where the AIGatewayAgent will be created.
#   - http_agent_name: Name of the AIGatewayAgent to create.
#   - aigw_cp_name: Name of the KonnectAIGateway (control plane) to reference.
#   - echo_deployment_name: Name of the go-echo backend Service to route to.
#   - http_agent_route_path: HTTP path the agent route matches.
#
# Optional bindings:
#   - agent_access: Access-control block restricting the route, in the shape of
#     `AIGatewayAgent.spec.apiSpec.access` (e.g. an `acls` allow-list and/or an
#     `identityProviders` list of identity-provider names to require authentication
#     via). Defaults to unrestricted access (field omitted) when not set.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-aigatewayagent-http
spec:
  try:
    - apply:
        resource:
          apiVersion: konnect.konghq.com/v1alpha1
          kind: AIGatewayAgent
          metadata:
            name: ($http_agent_name)
            namespace: ($namespace)
          spec:
            aiGatewayRef:
              type: namespacedRef
              namespacedRef:
                name: ($aigw_cp_name)
            apiSpec:
              name: ($http_agent_name)
              displayName: ($http_agent_name)
              type: http
              enabled: Enabled
              config:
                url: (join('', ['http://', ($echo_deployment_name), '.', ($namespace), '.svc.cluster.local:1027']))
                route:
                  paths:
                    - ($http_agent_route_path)
                  methods:
                    - GET
                    - POST
                  protocols:
                    - http
                    - https
                  stripPath: Enabled
              access: ($agent_access || null)
    - assert:
        resource:
          apiVersion: konnect.konghq.com/v1alpha1
          kind: AIGatewayAgent
          metadata:
            name: ($http_agent_name)
            namespace: ($namespace)
          status:
            (conditions[?type == 'Programmed']):
              - status: 'True'
            (id != null): true
            (gatewayID.id != null): true

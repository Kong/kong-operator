apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-mock-config
  namespace: kong-aigateway-mock
data:
  # Two mock LLM providers, both backed by the same Ollama, isolated by api key.
  # Both use the same route pattern: /provider-<x> (strip_path), forwarding to
  # Ollama's /v1/chat/completions.
  #   Provider A: route /provider-a, key test-ai-gateway-key   (ACL group provider-a)
  #   Provider B: route /provider-b, key test-ai-gateway-key-b (ACL group provider-b)
  # The ACL plugin ensures each key only works on its own provider's route.
  #
  # A mock Headroom compressor for the ai-prompt-compressor policy's headroom
  # provider: route /headroom/v1/compress, token test-headroom-token. A
  # pre-function answers in place of a real Headroom, following the contract
  # the AI Gateway plugin speaks: 401 unless X-Headroom-Proxy-Token carries
  # the token, 400 unless the body carries messages, model, config.session_id
  # and the gateway block, and otherwise 200 with the request body handed back
  # uncompressed (minus the plugin's control keys) plus a session block.
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: ollama-a
        url: http://ollama.kong-aigateway-mock.svc.cluster.local:11434/v1/chat/completions
        routes:
          - name: chat-a
            paths:
              - /provider-a
            strip_path: true
            plugins:
              - name: key-auth
                config:
                  key_names:
                    - apikey
              - name: acl
                config:
                  allow:
                    - provider-a
      - name: ollama-b
        url: http://ollama.kong-aigateway-mock.svc.cluster.local:11434/v1/chat/completions
        routes:
          - name: chat-b
            paths:
              - /provider-b
            strip_path: true
            plugins:
              - name: key-auth
                config:
                  key_names:
                    - apikey
              - name: acl
                config:
                  allow:
                    - provider-b
      # Never reached: the pre-function answers every request on the route.
      - name: headroom
        url: http://127.0.0.1:8100
        routes:
          - name: headroom-compress
            paths:
              - /headroom/v1/compress
            methods:
              - POST
            plugins:
              - name: pre-function
                config:
                  access:
                    - |
                      if kong.request.get_header("X-Headroom-Proxy-Token") ~= "test-headroom-token" then
                        return kong.response.exit(401, { error = { type = "unauthorized" } })
                      end
                      local body = kong.request.get_body("application/json")
                      if type(body) ~= "table" or type(body.messages) ~= "table" or #body.messages == 0
                        or type(body.model) ~= "string"
                        or type(body.config) ~= "table" or type(body.config.session_id) ~= "string"
                        or type(body.gateway) ~= "table" then
                        return kong.response.exit(400, { error = { type = "invalid_request" } })
                      end
                      body.config = nil
                      body.gateway = nil
                      return kong.response.exit(200, {
                        body = body,
                        session = { frozen_message_count = 0, cached_prefix_replayed = false },
                        tokens_before = 10,
                        tokens_after = 10,
                        tokens_saved = 0,
                        transforms_applied = { "mock" },
                      })
    consumers:
      - username: ai-gateway-a
        keyauth_credentials:
          - key: test-ai-gateway-key
        acls:
          - group: provider-a
      - username: ai-gateway-b
        keyauth_credentials:
          - key: test-ai-gateway-key-b
        acls:
          - group: provider-b

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-dataplane-hpa
spec:
  description: |
    Verifies HorizontalPodAutoscaler lifecycle for AIGatewayDataPlane.
    1. Creates an AIGatewayDataPlane with spec.deployment.scaling.horizontal configured.
    2. Asserts the operator reconciles an HPA that targets the owned Deployment.
    3. Removes horizontal scaling (switches the DataPlane back to a static replica count).
    4. Asserts the HPA is deleted so it no longer conflicts with the static replica count.
    5. Asserts the DataPlane remains Ready throughout.

    Mirrors the Konnect suite's `aigatewaydataplane-hpa` test. On-prem note: the
    data-plane manifest is inline because the shared
    apply-assert-aigatewayDataPlane-hpa template hardcodes a konnectNamespacedRef.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-aigatewaydataplane-with-hpa
      try:
        - apply:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                controlPlaneRef:
                  type: onpremNamespacedRef
                  onpremNamespacedRef:
                    name: ($aigw_cp_name)
                deployment:
                  scaling:
                    horizontal:
                      minReplicas: 1
                      maxReplicas: 3
                  podTemplateSpec:
                    spec:
                      containers:
                        - name: aigw
                          image: ($aigw_dp_image)
                network:
                  services:
                    ingress:
                      type: LoadBalancer
                      ports:
                        - name: ingress
                          port: 443
                          targetPort: 8443
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'ServiceReady']):
                  - status: 'True'
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (readyReplicas > `0`): true
                (addresses[0].value != null): true
                (addresses[0].value != ''): true
    - name: Assert-HPA-created
      description: |
        The operator must have reconciled an HPA pointing at the owned Deployment
        with the min/maxReplicas from spec.deployment.scaling.horizontal.
      use:
        template: ../../common/_step_templates/assert-aigatewaydataplane-hpa.yaml
    - name: Remove-scaling-switch-to-static-replica
      description: |
        Patch the DataPlane to remove horizontal scaling and restore a static
        replica count. Setting scaling:null in the merge patch removes the field;
        the XValidation rule allows replicas and scaling to coexist only when
        both are absent, so the two must be changed atomically.
      try:
        - patch:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                deployment:
                  scaling: null
                  replicas: 1
    - name: Assert-HPA-deleted
      description: |
        Wait until the HPA is gone (the operator deletes it when scaling is removed).
      bindings:
        - name: resource_type
          value: hpa
        - name: resource_name
          value: ($aigw_dp_name)
        - name: resource_namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/wait-for-resource-deleted.yaml
    - name: Assert-dataplane-still-ready
      try:
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                readyReplicas: 1
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-dataplane-hpa
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

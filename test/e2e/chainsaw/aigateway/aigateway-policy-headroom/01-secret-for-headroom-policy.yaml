# The Secret holding the config of the headroom ai-prompt-compressor policy
# (created in chainsaw-test.yaml through apply-assert-aigatewayPolicy.yaml).
# The config holds `provider: headroom` next to a nested `headroom: {...}`
# block, which requires a 2.2 control plane. compressor_url points at
# the mock Headroom on the shared kong-mock, which only accepts the token
# test-headroom-token; stop_on_error makes a failed compression call fail the
# client's request, so a wrong token is visible end to end. The config is JSON
# (valid YAML) so that the token can be templated in a single expression.
# Required bindings:
#   - namespace: The namespace where the Secret will be created.
#   - aigw_policy_secretref_name: The name of the Secret.
#   - headroom_proxy_token: The proxy_token the data plane sends to Headroom.
apiVersion: v1
kind: Secret
metadata:
  name: ($aigw_policy_secretref_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  config: >-
    (join('', [
    '{"provider":"headroom",',
    '"compressor_url":"http://kong-mock.kong-aigateway-mock.svc.cluster.local:8000/headroom/v1/compress",',
    '"stop_on_error":true,',
    '"headroom":{"proxy_token":"', $headroom_proxy_token, '",',
    '"ssl_verify":false,"session_id_headers":["x-session-id"]}}'
    ]))

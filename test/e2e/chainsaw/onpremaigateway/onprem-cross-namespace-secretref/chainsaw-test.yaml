apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-cross-namespace-secretref
spec:
  description: |
    Cross-namespace secretRefs of on-prem AI Gateway configuration entities,
    guarded by KongReferenceGrant. An AIGatewayModelProvider and an
    AIGatewayPolicy reference Secrets in another namespace, which the
    OnPremAIGateway watches through a WatchNamespaceGrant. The policy adds a
    response header whose value comes from the cross-namespace Secret, so the
    traffic steps prove that the Secret was read.

    Covers, in order:
    1. without a KongReferenceGrant, the provider and the policy report
       Programmed=False with the reason and ResolvedRefs=False, and the model
       that references them is left out too. These failures only affect their
       entities: the OnPremAIGateway stays Ready and a data plane deploys;
    2. creating the KongReferenceGrant renders them again without other
       changes: they become Programmed with ResolvedRefs=True, and the header
       reaches the data plane;
    3. updating the cross-namespace Secret changes the header;
    4. deleting the KongReferenceGrant revokes the access: the provider and
       the policy report Programmed=False and ResolvedRefs=False again, and the
       OnPremAIGateway stays Ready.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: secrets_namespace
      value: (join('-', [($namespace), 'secrets']))
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: model_name
      value: (join('-', [($test_name), 'model']))
    - name: provider_name
      value: (join('-', [($test_name), 'provider']))
    - name: provider_credentials_name
      value: (join('-', [($provider_name), 'credentials']))
    - name: aigw_policy_name
      value: (join('-', [($test_name), 'policy']))
    - name: policy_secret_name
      value: (join('-', [($aigw_policy_name), 'config']))
    - name: kong_reference_grant_name
      value: allow-aigateway-secrets
  steps:
    - name: Create-secrets-namespace
      use:
        template: ../../common/_step_templates/apply-assert-namespace.yaml
        with:
          bindings:
            - name: namespace_name
              value: ($secrets_namespace)
    - name: Create-secrets-and-watch-namespace-grant
      try:
        - apply:
            file: 01-secrets-namespace.yaml
    - name: Create-onprem-aigateway
      try:
        - apply:
            file: 02-onprem-aigateway.yaml
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: OnPremAIGateway
              metadata:
                name: ($aigw_cp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
    - name: Create-provider-policy-and-model
      try:
        - apply:
            file: 03-provider-policy-model.yaml
    - name: Assert-not-programmed-without-kong-reference-grant
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModelProvider
              metadata:
                name: ($provider_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    (contains(message, 'KongReferenceGrant')): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayPolicy
              metadata:
                name: ($aigw_policy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    (contains(message, 'KongReferenceGrant')): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
    - name: Assert-model-not-programmed-without-kong-reference-grant
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    (contains(message, 'was excluded from the document')): true
    - name: Assert-onprem-aigateway-ready-without-kong-reference-grant
      description: |
        A reference that no KongReferenceGrant allows only fails its entity
        (and the entities that reference it): the gateway stays Ready, so the
        data plane created next can deploy.
      try:
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: OnPremAIGateway
              metadata:
                name: ($aigw_cp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ConfigurationTranslated']):
                  - status: 'True'
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Create-kong-reference-grant
      try:
        - apply:
            file: 04-kongreferencegrant.yaml
    - name: Assert-programmed-with-kong-reference-grant
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModelProvider
              metadata:
                name: ($provider_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'True'
                    reason: ResolvedRefs
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayPolicy
              metadata:
                name: ($aigw_policy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'True'
                    reason: ResolvedRefs
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModel
              metadata:
                name: ($model_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
                # The model has no secretRef: it has no ResolvedRefs condition.
                (length(conditions[?type == 'ResolvedRefs'])): 0
    - name: Verify-cross-namespace-secret-policy-is-applied
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /cross-ns/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Cross-Namespace-Secret"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Update-the-cross-namespace-secret
      try:
        - apply:
            file: 05-policy-secret-updated.yaml
    - name: Verify-policy-after-cross-namespace-secret-update
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /cross-ns/chat
              - name: MODEL_ALIAS
                value: ($model_name)
              - name: INCLUDE_HEADER
                value: "false"
              - name: EXPECT_HEADER
                value: "Modified-By-Cross-Namespace-Secret-Updated"
              - name: EXPECT_HEADER_VALUE
                value: "Kong-Operator-Chainsaw-Test"
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: Delete-kong-reference-grant
      try:
        - delete:
            ref:
              apiVersion: configuration.konghq.com/v1alpha1
              kind: KongReferenceGrant
              name: ($kong_reference_grant_name)
              namespace: ($secrets_namespace)
    - name: Assert-not-programmed-after-kong-reference-grant-deletion
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayModelProvider
              metadata:
                name: ($provider_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    (contains(message, 'KongReferenceGrant')): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayPolicy
              metadata:
                name: ($aigw_policy_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'False'
                    (contains(message, 'KongReferenceGrant')): true
                (conditions[?type == 'ResolvedRefs']):
                  - status: 'False'
                    reason: RefNotPermitted
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: OnPremAIGateway
              metadata:
                name: ($aigw_cp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'ConfigurationTranslated']):
                  - status: 'True'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-cross-namespace-secretref
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

apiVersion: v1
kind: Secret
metadata:
  name: openai-provider-credentials
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  apikey: test-ai-gateway-key
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModelProvider
metadata:
  name: openai-provider
  namespace: ($namespace)
spec:
  aiGatewayRef:
    type: namespacedRef
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: openai
    openai:
      name: openai-provider
      displayName: OpenAI (mock)
      config:
        auth:
          headers:
            - name: apikey
              value:
                type: secretRef
                secretRef:
                  name: openai-provider-credentials
                  key: apikey
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayModel
metadata:
  name: tls-sni-chat-model
  namespace: ($namespace)
spec:
  aiGatewayRef:
    type: namespacedRef
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: model
    model:
      name: tls-sni-chat-model
      displayName: TLS SNI chat model
      enabled: Enabled
      formats:
        - type: openai
      capabilities:
        - generate
      config:
        model:
          nameHeader: Enabled
        route:
          model:
            headerParam: X-Kong-LLM-Model
            values:
              - qwen2.5:0.5b
          paths:
            - /v1/chat
      targets:
        - name: qwen2.5:0.5b
          provider:
            name: openai-provider
          config:
            type: openai
            openai:
              upstreamURL: http://kong-mock.kong-aigateway-mock.svc.cluster.local:8000/provider-a

# KegDataPlane using a user-owned mTLS client certificate (Manual provisioning)
# instead of one generated by the operator. The operator never creates,
# modifies or deletes the referenced Secret; editing it in place rolls the
# Deployment onto the new certificate.
#
# The Secret must live in the KegDataPlane's namespace and carry the operator's
# secret label selector (default "konghq.com/secret: \"true\""), otherwise the
# operator can't see it. In practice it is usually issued by cert-manager or an
# external PKI; replace the placeholder data below with a real keypair.
apiVersion: v1
kind: Secret
metadata:
  name: my-event-gateway-dp-cert
  namespace: default
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <PEM-encoded certificate>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    <PEM-encoded private key>
    -----END PRIVATE KEY-----
---
apiVersion: eventgateway.konghq.com/v1alpha1
kind: KegDataPlane
metadata:
  name: my-event-gateway-dp-manual-cert
  namespace: default
spec:
  controlPlaneRef:
    type: konnectNamespacedRef
    konnectNamespacedRef:
      name: my-event-gateway
  certificateSecret:
    provisioning: Manual
    secretRef:
      name: my-event-gateway-dp-cert
  network:
    services:
      kafka:
        type: LoadBalancer
        ports:
          - name: kafka
            port: 9092
            targetPort: 9092

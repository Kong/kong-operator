apiVersion: apps/v1
kind: Deployment
metadata:
  name: ($gwadmin_name)
spec:
  template:
    metadata:
      (annotations."konghq.com/gw-admin-tls-checksum" != null): true
      (annotations."konghq.com/gw-admin-trust-checksum" != null): true
    spec:
      # gw-admin never talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: gw-admin
          image: ($gw_admin_image)
          args:
            - server
          (env[?name == 'GW_ADMIN_ONPREM_CP_TLS_CLIENT_CA_FILE']):
            - value: /etc/gw-admin/cp-tls/ca.crt
          (env[?name == 'GW_ADMIN_ONPREM_API_TLS_CLIENT_CA_FILE']):
            - value: /etc/gw-admin/api-tls/ca.crt
      # Each listener verifies its clients with the bundle of its own trust
      # domain.
      (volumes[?name == 'cp-tls']):
        - projected:
            sources:
              - secret:
                  name: (join('-', [($gwadmin_name), 'cp-tls']))
              - secret:
                  name: (join('-', [($gwadmin_name), 'cp-client-ca-bundle']))
      (volumes[?name == 'api-tls']):
        - projected:
            sources:
              - secret:
                  name: (join('-', [($gwadmin_name), 'api-tls']))
              - secret:
                  name: (join('-', [($gwadmin_name), 'api-ca-bundle']))

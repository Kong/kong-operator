apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: kong-aigateway-mock
  labels: { app: ollama }
spec:
  replicas: 1
  # Well above the rollout timeout in prereq.sh: the models are downloaded at
  # container start, and the transfer has been seen to drop to a few hundred
  # KB/s. The default 600s progress deadline made `kubectl rollout status` fail
  # before the script's timeout could decide, so raise it above 900s.
  progressDeadlineSeconds: 1200
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.34.2
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              until ollama ls >/dev/null 2>&1; do sleep 1; done
              # Retry until each pull succeeds: ollama resumes the partial blob
              # it keeps in its model store, so a dropped transfer does not
              # start over.
              for model in qwen2.5:0.5b gemma3:270m; do
                until ollama pull "$model"; do
                  echo "ollama pull $model failed; retrying in 5s" >&2
                  sleep 5
                done
              done
              # llama-server can crash during CPU model load (e.g. the ollama
              # <0.32.7 GCC-11/AMX backend bug); retry until a real
              # completion succeeds, then gate readiness on it.
              for model in qwen2.5:0.5b gemma3:270m; do
                until ollama run "$model" "hi" >/dev/null 2>&1; do
                  echo "ollama run $model failed; retrying in 5s" >&2
                  sleep 5
                done
              done
              touch /tmp/ready
              wait $pid
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: 2h
          ports:
            - containerPort: 11434
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/ready
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 90
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: kong-aigateway-mock
spec:
  selector: { app: ollama }
  ports:
    - name: http
      port: 11434
      targetPort: 11434

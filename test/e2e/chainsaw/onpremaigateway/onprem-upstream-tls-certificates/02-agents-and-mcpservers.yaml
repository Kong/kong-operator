apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayAgent
metadata:
  name: ($http_agent_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($http_agent_name)
    displayName: ($http_agent_name)
    type: http
    enabled: Enabled
    config:
      url: https://agent.upstream-tls.example
      caCertificates:
        - ($ca_cert_name)
      certificates:
        - ($client_cert_name)
      route:
        paths:
          - /agents/upstream-tls-http
        methods:
          - GET
          - POST
        protocols:
          - http
          - https
        stripPath: Enabled
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayAgent
metadata:
  name: ($a2a_agent_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    name: ($a2a_agent_name)
    displayName: ($a2a_agent_name)
    type: a2a
    enabled: Enabled
    config:
      url: https://agent.upstream-tls.example/a2a
      caCertificates:
        - ($ca_cert_name)
      certificates:
        - ($client_cert_name)
      route:
        paths:
          - /agents/upstream-tls-a2a
        methods:
          - GET
          - POST
        protocols:
          - http
          - https
        stripPath: Enabled
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayMCPServer
metadata:
  name: ($mcp_conversion_only_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: conversion-only
    conversion-only:
      name: ($mcp_conversion_only_name)
      displayName: ($mcp_conversion_only_name)
      enabled: Enabled
      config:
        url: https://flights-api.upstream-tls.example/openapi.json
        caCertificates:
          - ($ca_cert_name)
        certificates:
          - ($client_cert_name)
        route:
          paths:
            - /mcp/upstream-tls-conversion-only
      tools:
        - name: search_flights
          description: Search available flights
          method: GET
          path: /flights
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayMCPServer
metadata:
  name: ($mcp_conversion_listener_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: conversion-listener
    conversion-listener:
      name: ($mcp_conversion_listener_name)
      displayName: ($mcp_conversion_listener_name)
      enabled: Enabled
      access:
        aclAttributeType: consumer
      config:
        url: https://flights-api.upstream-tls.example/openapi.json
        caCertificates:
          - ($ca_cert_name)
        certificates:
          - ($client_cert_name)
        route:
          paths:
            - /mcp/upstream-tls-conversion-listener
      tools:
        - name: search_flights
          description: Search available flights
          method: GET
          path: /flights
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayMCPServer
metadata:
  name: ($mcp_upstream_server_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: upstream-server
    upstream-server:
      name: ($mcp_upstream_server_name)
      displayName: ($mcp_upstream_server_name)
      enabled: Enabled
      config:
        url: https://flights-mcp.upstream-tls.example
        caCertificates:
          - ($ca_cert_name)
        certificates:
          - ($client_cert_name)
        route:
          paths:
            - /mcp/upstream-tls-upstream-server
        toolsCacheTtlSeconds: 300
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayMCPServer
metadata:
  name: ($mcp_passthrough_listener_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: passthrough-listener
    passthrough-listener:
      name: ($mcp_passthrough_listener_name)
      displayName: ($mcp_passthrough_listener_name)
      enabled: Enabled
      access:
        aclAttributeType: oauthAccessToken
        oauthAccessToken:
          accessTokenClaimField: .user.email
      config:
        url: https://flights-mcp.upstream-tls.example
        caCertificates:
          - ($ca_cert_name)
        certificates:
          - ($client_cert_name)
        route:
          hosts:
            - upstream-tls-passthrough.mcp.example.com

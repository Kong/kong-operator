# Template for creating and asserting an EventGatewayBackendCluster pointing
# at the shared Kafka cluster of the Event Gateway suites (namespace
# kafka-shared, see fixtures/onpremeventgateway/prereq.sh), with
# anonymous/no-TLS authentication.
#
# Required bindings:
#   - backend_cluster_name: Name of the EventGatewayBackendCluster to create.
#   - namespace: Namespace where the EventGatewayBackendCluster will be
#     created.
#   - keg_cp_name: Name of the KonnectEventGateway it attaches to (same
#     namespace).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-assert-event-gateway-backend-cluster
spec:
  try:
    - apply:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayBackendCluster
          metadata:
            name: ($backend_cluster_name)
            namespace: ($namespace)
          spec:
            gatewayRef:
              type: namespacedRef
              namespacedRef:
                name: ($keg_cp_name)
            apiSpec:
              name: ($backend_cluster_name)
              description: chainsaw e2e backend cluster (shared Kafka)
              bootstrapServers:
                - kafka-bootstrap.kafka-shared.svc:9092
              authentication:
                type: anonymous
                anonymous: {}
              insecureAllowAnonymousVirtualClusterAuth: Enabled
              tls:
                enabled: Disabled
    - assert:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayBackendCluster
          metadata:
            name: ($backend_cluster_name)
            namespace: ($namespace)
          status:
            (conditions[?type == 'Programmed']):
              - status: 'True'

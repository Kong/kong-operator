apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-mcpserver-request-body
spec:
  description: |
    Guards https://github.com/Kong/kong-operator/issues/6252: an
    AIGatewayMCPServer tool's requestBody (and responses) must accept the
    OpenAPI object with `content` keyed by media type. The CRD used to type
    these fields map[string]string, so the nested object was rejected by
    strict decoding at apply time; the apply below fails on that schema.

    Programmed=True then proves the object survives translation into the
    rendered on-prem configuration and is accepted when pushed to the data
    plane.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: mcp_name
      value: (join('-', [($test_name), 'mcp-request-body']))
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Create-aigateway-mcpserver
      try:
        - apply:
            file: 01-aigatewaymcpserver.yaml
    - name: Create-aigateway-dataplane
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-mcpserver-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayMCPServer
              metadata:
                name: ($mcp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-mcpserver-request-body
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

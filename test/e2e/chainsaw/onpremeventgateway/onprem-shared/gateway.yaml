# A GWAdmin with Automatic certificate authorities, and the OnPremEventGateway
# gateway_name it serves, in the namespace of the test.
apiVersion: gateway-operator.konghq.com/v1alpha1
kind: GWAdmin
metadata:
  name: ($gwadmin_name)
spec:
  # Readiness probed every second, so the pod turns Ready without waiting for
  # the default 10s period, and unready after 30s of failures, as by default.
  deployment:
    podTemplateSpec:
      spec:
        containers:
          - name: gw-admin
            readinessProbe:
              periodSeconds: 1
              failureThreshold: 30
---
apiVersion: eventgateway.konghq.com/v1alpha1
kind: OnPremEventGateway
metadata:
  name: ($gateway_name)
spec:
  gwAdminRef:
    name: ($gwadmin_name)

# A virtual cluster of the OnPremEventGateway gateway_name with a root
# schemaValidation produce policy, two sibling children and a separate root
# policy. No data plane uses them: the test only checks what gw-admin holds.
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayBackendCluster
metadata:
  name: backend
spec:
  parentRef:
    group: eventgateway.konghq.com
    kind: OnPremEventGateway
    name: ($gateway_name)
  apiSpec:
    name: backend
    bootstrapServers:
      - kafka-bootstrap.kafka-shared.svc:9092
    authentication:
      type: anonymous
      anonymous: {}
    insecureAllowAnonymousVirtualClusterAuth: Enabled
    tls:
      enabled: Disabled
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualCluster
metadata:
  name: vcluster
spec:
  eventGatewayBackendClusterRef:
    type: namespacedRef
    namespacedRef:
      name: backend
  apiSpec:
    name: vcluster
    dnsLabel: vcluster
    aclMode: passthrough
    authentication:
      - type: anonymous
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterProducePolicy
metadata:
  name: parse
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: schemaValidation
    schemaValidation:
      name: parse
      config:
        type: json
        json:
          valueValidationAction: reject
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterProducePolicy
metadata:
  name: first
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: modifyHeaders
    parentPolicyRef:
      name: parse
    modifyHeaders:
      name: first
      config:
        actions:
          - op: set
            set:
              key: x-produce-stage
              value: first
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterProducePolicy
metadata:
  name: second
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: modifyHeaders
    parentPolicyRef:
      name: parse
    modifyHeaders:
      name: second
      config:
        actions:
          - op: set
            set:
              key: x-produce-stage
              value: second
---
apiVersion: configuration.konghq.com/v1alpha1
kind: EventGatewayVirtualClusterProducePolicy
metadata:
  name: root
spec:
  eventGatewayVirtualClusterRef:
    type: namespacedRef
    namespacedRef:
      name: vcluster
  apiSpec:
    type: modifyHeaders
    modifyHeaders:
      name: root
      config:
        actions:
          - op: set
            set:
              key: x-produce-root
              value: example

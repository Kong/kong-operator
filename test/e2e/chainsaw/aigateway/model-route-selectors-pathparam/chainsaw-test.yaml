apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aigateway-model-route-selectors-pathparam
spec:
  # Skipped: the path-selector case fails Konnect server-side, in every
  # encoding the Konnect API accepts (verified 2026-10-07 against the dev
  # environment and CI):
  #
  #   - Konnect's model API hard-requires `config.route.model.path_param` to
  #     match `^~.+$` (400 "string doesn't match the regular expression
  #     \"^~.+$\"" otherwise), so the capture group in the route-path regex
  #     keeps its plain name.
  #   - The data plane's ai-model-selector plugin, though, uses
  #     `pcre_capture_name` as-is to look the named capture up
  #     (goks-private ai-gateway ai-model-selector handler.lua
  #     extract_from_pcre_path), and its config schema rejects a capture
  #     name absent from the pattern at config time. No such rejection
  #     appears in the DP logs, and every path-selector request logs
  #     "no model string found in any configured source": Konnect renders no
  #     working path source at all and falls back to the default (body)
  #     source, which this test deliberately does not feed.
  #   - Unresolved model => the request goes to the placeholder
  #     `ai-gateway.upstream.local` service => DNS failure => 500, forever.
  #   - Encodings driven in CI: `~/path/(?<model_name>...)` (500), Go-style
  #     `~/path/(?P<model_name>...)` (500), `/path/(?<model_name>...)` with no
  #     "~" prefix (404: without the "~" marker the route path is a literal,
  #     so the route never matches at all). The Konnect API accepts and stores
  #     all of them verbatim - the API validates nothing about the capture
  #     group.
  #
  # The "~" prefix cannot be dropped (API 400) and the capture group cannot
  # carry it (invalid PCRE group name), so no operator-side encoding can make
  # Konnect render a working path source. Un-skip when Konnect reconciles the
  # ~-prefixed path_param with the plain capture-group name
  # (KOKO-4314 / KOKO-4312).
  # TODO: https://github.com/Kong/kong-operator/issues/6001
  skip: true
  description: |
    AIGatewayModel path (`pathParam`) route selector. Stands up a Konnect
    AIGateway control plane, an OpenAI-compatible provider, and one
    AIGatewayModel whose `config.route.model` selector reads the model alias
    from a named capture group in the route's path regex, then drives real
    chat-completions traffic to verify that a matching path segment routes to
    the model and that a non-matching one is consistently rejected.
  bindings:
    - name: test_name
      value: ($namespace)
    - name: konnect_token
      value: (env('KONNECT_TOKEN'))
    - name: konnect_url
      value: (env('KONNECT_SERVER_URL') || 'eu.api.konghq.tech')
    - name: auth_secret_name
      value: (join('-', [($test_name), 'konnect-auth-secret']))
    - name: auth_secret_namespace
      value: ($namespace)
    - name: konnect_auth_name
      value: (join('-', [($test_name), 'konnect-api-auth']))
    - name: konnect_auth_namespace
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'cp']))
    - name: aigw_cp_namespace
      value: ($namespace)
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
  steps:
    - name: 1-Create-auth-secret
      use:
        template: ../../common/_step_templates/apply-assert-konnectAuthSecret.yaml
    - name: 2-Create-konnect-api-auth
      use:
        template: ../../common/_step_templates/apply-assert-konnectAPIAuthConfiguration-secretref.yaml
    - name: 3-Create-konnect-aigateway
      bindings:
        - name: auth_name
          value: ($konnect_auth_name)
      use:
        template: ../../common/_step_templates/apply-assert-konnectAIGateway.yaml
    - name: 4-Create-provider-and-model
      try:
        - apply:
            file: 01-provider-and-models.yaml
        - assert:
            file: 01-assert-programmed.yaml
    - name: 5-Create-aigateway-dataplane
      bindings:
        - name: namespace
          value: ($namespace)
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            # Debug level so the failure snapshot's DP logs show the
            # ai-model-selector's per-source errors ("source 'path' did not
            # yield a model: ...") when this test is un-skipped; the
            # warn-level final message alone cannot tell a misrendered source
            # from a missing one.
            - name: aigw_dp_env
              value: >-
                ([{name: 'KONG_LOG_LEVEL', value: 'debug'}])
    - name: 6-Verify-path-selector-routes-matching-alias
      description: |
        A request whose path segment matches the selector's `values` is
        routed to the model. Both the X-Kong-LLM-Model header and the body
        `model` field are deliberately omitted (INCLUDE_HEADER,
        INCLUDE_BODY_MODEL: 'false') so this exercises `pathParam` alone —
        AI Gateway resolves the model alias from whichever of header, body,
        or path carries it, so leaving either of the other two enabled would
        let this step pass even if the path-based capture were broken.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /model-route/path/qwen2.5:0.5b/chat
              - name: MODEL_ALIAS
                value: qwen2.5:0.5b
              - name: INCLUDE_HEADER
                value: 'false'
              - name: INCLUDE_BODY_MODEL
                value: 'false'
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
    - name: 7-Verify-path-selector-rejects-non-matching-alias
      description: |
        A request whose path segment is absent from the selector's `values`
        never resolves to the model. Header and body `model` field omitted
        for the same reason as step 6.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
              - name: ADDRESS
                value: (join('', [($aigw_dp_name), '-ingress.', ($namespace), '.svc']))
              - name: ROUTE_PATH
                value: /model-route/path/path-alias-wrong/chat
              - name: MODEL_ALIAS
                value: path-alias-wrong
              - name: EXPECTED_SUCCESS
                value: 'false'
              - name: INCLUDE_HEADER
                value: 'false'
              - name: INCLUDE_BODY_MODEL
                value: 'false'
            content: |
              bash ../../common/scripts/run_script_in_pod.sh ../../common/scripts/aigw_chat_completion.sh
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: aigateway-model-route-selectors-pathparam
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kong-system
namePrefix: gateway-operator-

resources:
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../certmanager
- ./validating_policies/
- ./validating_webhook/

patches:
- path: manager_metrics_access_filter_rbac_patch.yaml
- path: manager_webhook_patch.yaml

replacements:
- source:
    kind: Service
    version: v1
    name: gateway-operator-webhook-service
    fieldPath: metadata.name
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
    reject:
    - kind: Certificate
      group: cert-manager.io
      version: v1
      name: kong-operator-ca
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: '.'
      index: 0
- source:
    kind: Service
    version: v1
    name: gateway-operator-webhook-service
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Certificate
      group: cert-manager.io
      version: v1
    reject:
    - kind: Certificate
      group: cert-manager.io
      version: v1
      name: kong-operator-ca
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: '.'
      index: 1

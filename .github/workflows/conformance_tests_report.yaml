name: Generate Kubernetes Gateway API conformance tests report
run-name: "Generate Kubernetes Gateway API conformance tests report ${{ format('ref:{0}', github.event.inputs.tag) }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The version of code to checkout (e.g. v1.2.3 or commit hash)
        required: false
        default: main

permissions:
  contents: read

jobs:
  conformance-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: ${{ format('{0} {1}', matrix.gateway-type, matrix.router-flavor) }}
    strategy:
      fail-fast: false
      matrix:
        router-flavor:
          - traditional_compatible
          - expressions
        gateway-type:
          - standard
          - hybrid
        exclude:
          - router-flavor: expressions
            gateway-type: hybrid
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ github.event.inputs.tag }}

      # NOTE: other places use .github/actions/setup-mise but this workflow
      # can be run to generate reports for refs which do not have that action yet.
      # This will be able to be updated when we stop producing reports for older versions.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false

      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: Kong/kong-license@ddccb487a0b319cef85f348b16a1ad2b6d9c1df7 # master @ 20260529
        id: license
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run conformance tests
        env:
          TEST_KONG_ROUTER_FLAVOR: ${{ matrix.router-flavor }}
          KONG_TEST_CONFORMANCE_GATEWAY_TYPE: ${{ matrix.gateway-type }}
          KONG_TEST_KONNECT_ACCESS_TOKEN: ${{ matrix.gateway-type == 'hybrid' && secrets.KONG_TEST_KONNECT_ACCESS_TOKEN || '' }}
          KONG_TEST_KONNECT_SERVER_URL: ${{ matrix.gateway-type == 'hybrid' && 'us.api.konghq.tech' || '' }}
          KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}
          # Add GITHUB_TOKEN env so that mise plugins can can access GitHub's API
          # authenticated and thus not get rate-limited (which causes failures).
          # Source ref: https://github.com/pirackr/asdf-telepresence/blob/c9eeab4d28b9851bb904c4c67239a118c8dd384d/bin/list-all#L7-L9
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make test.conformance

      # Generated report should be submitted to
      # https://github.com/kubernetes-sigs/gateway-api/tree/main/conformance/reports
      # in future automate creating PR (add to release workflow).
      # TODO: https://github.com/Kong/kong-operator/issues/131
      - name: Collect conformance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report-${{ matrix.router-flavor }}-${{ matrix.gateway-type }}
          path: "*report.yaml"

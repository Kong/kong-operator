        template: ../../../common/_step_templates/apply-assert-kongreferencegrant.yaml
      bindings:
        - name: kong_reference_grant_name
          value: mtls-lst-n-to-secrets
        - name: kong_reference_grant_namespace
          value: ($namespace)
        - name: from
          value:
            - group: configuration.konghq.com
              kind: EventGatewayListenerPolicy
              namespace: ($referrer_namespace)
        - name: to
          value:
            - group: core
              kind: Secret
    - name: 161-grant-mtls-lst-n-to-tls-trust-bundle
      description: "[N, its name] Let the EventGatewayListenerPolicy mtls-lst-n reference the EventGatewayTLSTrustBundle client-ca-lst-n in another namespace."
      use:
        template: ../../../common/_step_templates/apply-assert-kongreferencegrant.yaml
      bindings:
        - name: kong_reference_grant_name
          value: mtls-lst-n-to-tls-trust-bundle
        - name: kong_reference_grant_namespace
          value: ($namespace)
        - name: from
          value:
            - group: configuration.konghq.com
              kind: EventGatewayListenerPolicy
              namespace: ($referrer_namespace)
        - name: to
          value:
            - group: configuration.konghq.com
              kind: EventGatewayTLSTrustBundle
    - name: 162-create-listener-policy-mtls-lst-n
      description: "[N, its name] Create the EventGatewayListenerPolicy mtls-lst-n."
      use:
        template: ../../_step_templates/apply-eventGatewayListenerPolicy-tlsServer.yaml
      bindings:
        - name: policy_name
          value: mtls-lst-n
        - name: policy_namespace
          value: ($referrer_namespace)
        - name: listener_name
          value: listener-lst-n
        - name: listener_namespace
          value: ($namespace)
        - name: server_tls_secret_namespace
          value: ($namespace)
        - name: tls_trust_bundle_name
          value: client-ca-lst-n
        - name: tls_trust_bundle_namespace
          value: ($namespace)
    - name: 163-assert-lst-n-conflicting
      description: "[N, its name] The EventGatewayListenerPolicy of another namespace named the same can't take the name."
      use:
        template: ../../_step_templates/assert-condition-message.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayListenerPolicy
        - name: object_name
          value: mtls-lst-n
        - name: object_namespace
          value: ($referrer_namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "False"
        - name: condition_reason
          value: Invalid
        - name: message_part
          value: "\"mtls-lst-n\""
    - name: 164-assert-lst-n-gateway-held-back
      description: "[N, its name] The conflicting EventGatewayListenerPolicy can't be sent: the gateway doesn't push its configuration."
      use:
        template: ../../_step_templates/assert-condition.yaml
      bindings:
        - name: object_api_version
          value: eventgateway.konghq.com/v1alpha1
        - name: object_kind
          value: OnPremEventGateway
        - name: object_name
          value: ($gateway_name)
        - name: object_namespace
          value: ($namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "False"
        - name: condition_reason
          value: InvalidEntities
    - name: 165-assert-lst-n-first-kept
      description: "[N, its name] The first EventGatewayListenerPolicy keeps its name. It stays in the configuration, which isn't pushed."
      use:
        template: ../../_step_templates/assert-condition.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayListenerPolicy
        - name: object_name
          value: mtls-lst-n
        - name: object_namespace
          value: ($namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "False"
        - name: condition_reason
          value: GatewayNotProgrammed
    - name: 166-delete-lst-n-conflicting
      description: "[N, its name] Delete the conflicting EventGatewayListenerPolicy."
      use:
        template: ../../_step_templates/delete-and-wait.yaml
      bindings:
        - name: object_api_version
          value: configuration.konghq.com/v1alpha1
        - name: object_kind
          value: EventGatewayListenerPolicy
        - name: object_name
          value: mtls-lst-n
        - name: object_namespace
          value: ($referrer_namespace)
    - name: 167-assert-lst-n-gateway-pushes
      description: "[N, its name] The gateway pushes its configuration again."
      use:
        template: ../../_step_templates/assert-condition.yaml
      bindings:
        - name: object_api_version
          value: eventgateway.konghq.com/v1alpha1
        - name: object_kind
          value: OnPremEventGateway
        - name: object_name
          value: ($gateway_name)
        - name: object_namespace
          value: ($namespace)
        - name: condition_type
          value: Programmed
        - name: condition_status
          value: "True"
        - name: condition_reason
          value: Programmed

  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: ($test.metadata.name)
          - name: NAMESPACE
            value: ($namespace)
          - name: ADDITIONAL_NAMESPACES
            value: (join(',', [$referrer_namespace, $target_namespace, $third_namespace]))
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../../common/scripts/debug_snapshot.sh

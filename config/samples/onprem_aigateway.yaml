# Minimal sample for the on-prem AIGateway control plane CRD.
#
# The reconciler for OnPremAIGateway is opt in via --enable-controller-onpremaigateway.
apiVersion: aigateway.konghq.com/v1alpha1
kind: OnPremAIGateway
metadata:
  name: ai-gw-cp-onprem-1
  namespace: default
spec:
  # Optional namespaces the gateway watches for configuration entities and the
  # Secrets they reference. Defaults to the gateway's own namespace ("own").
  # "list" also watches the listed namespaces and needs a WatchNamespaceGrant
  # in each of them. "all" watches every namespace and needs an operator that
  # runs with an empty --watch-namespaces.
  watchNamespaces:
    type: own
  dataplaneSync:
    intervalSeconds: 5
    timeoutSeconds: 3
  # Optional filters limiting the Secrets the gateway's instance watches.
  # Secrets must carry ALL of these labels (ANDed with the operator's secret
  # label selector) to be reconciled.
  objectFilters:
    secrets:
      matchLabels:
        konghq.com/ingestable: "true"
---
apiVersion: aigateway.konghq.com/v1alpha1
kind: AIGatewayDataPlane
metadata:
  name: ai-gw-dp-onprem-1
  namespace: default
spec:
  controlPlaneRef:
    type: onpremNamespacedRef
    onpremNamespacedRef:
      name: ai-gw-cp-onprem-1

# Template for creating an EventGatewayStaticKey attached to the gateway, and
# the Secret, named after it, holding its value.
#
# Required bindings:
#   - static_key_name, static_key_namespace: The static key.
#   - api_name: Its name in the API of the gateway, which keeps it unique.
#   - secret_namespace: Namespace of the Secret holding its value.
#   - secret_ref_namespace: The same, or null to leave it to default to the
#     namespace of the object.
#   - gateway_group, gateway_kind, gateway_name: The gateway.
#   - gateway_ref_namespace: The namespace of the gateway, or null to leave
#     it to default to the namespace of the object.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-event-gateway-static-key
spec:
  try:
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ($static_key_name)
            namespace: ($secret_namespace)
            labels:
              konghq.com/secret: "true"
          type: Opaque
          stringData:
            key: Y2hhaW5zYXctc3RhdGljLWtleS0zMi1ieXRlcy1vayE=
    - apply:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayStaticKey
          metadata:
            name: ($static_key_name)
            namespace: ($static_key_namespace)
          spec:
            parentRef:
              group: ($gateway_group)
              kind: ($gateway_kind)
              name: ($gateway_name)
              namespace: ($gateway_ref_namespace)
            apiSpec:
              name: ($api_name)
              value:
                type: secretRef
                secretRef:
                  name: ($static_key_name)
                  namespace: ($secret_ref_namespace)
                  key: key

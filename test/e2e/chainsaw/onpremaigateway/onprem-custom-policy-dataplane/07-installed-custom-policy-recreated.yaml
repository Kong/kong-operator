# The installed AIGatewayCustomPolicy re-created after deletion: the watch on
# the custom-policy kind re-renders the referencing policy, whose
# customPolicyRef resolves again.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayCustomPolicy
metadata:
  name: ($installed_custom_policy_name)
  namespace: ($namespace)
spec:
  aiGatewayRef:
    group: aigateway.konghq.com
    kind: OnPremAIGateway
    namespacedRef:
      name: ($aigw_cp_name)
  apiSpec:
    type: installed
    installed:
      name: ($installed_plugin_name)
      displayName: On-prem installed custom policy
      schema:
        type: inline
        value: (join('', [$plugin_schema_prefix, $installed_plugin_name, $plugin_schema_suffix]))

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    kubernetes-configuration.konghq.com/channels: kong-operator
    kubernetes-configuration.konghq.com/version: v2.4.0-rapid.1
  name: konnectconfigstoresyncs.konnect.konghq.com
spec:
  group: konnect.konghq.com
  names:
    categories:
    - kong
    - konnect
    kind: KonnectConfigStoreSync
    listKind: KonnectConfigStoreSyncList
    plural: konnectconfigstoresyncs
    singular: konnectconfigstoresync
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Name of the referenced KonnectConfigStore
      jsonPath: .spec.configStoreRef.name
      name: Store
      type: string
    - description: Name of the referenced Secret
      jsonPath: .spec.secretRef.name
      name: Secret
      type: string
    - description: Sync mode (Combined or Split)
      jsonPath: .spec.mode
      name: Mode
      type: string
    - description: Number of entries currently synced to the Config Store
      jsonPath: .status.entriesSynced
      name: Entries
      type: integer
    - description: The entries are synced to the Config Store
      jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: Synced
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KonnectConfigStoreSync is the Schema for the KonnectConfigStoreSync API.

          A KonnectConfigStoreSync declares a one-way mapping from one Kubernetes
          Secret to one Konnect Config Store: the operator keeps the store entry (or
          entries) in step with the Secret so that certificate rotation is a pure
          data event. Private key material is written only to the Config Store and
          never lands in Konnect configuration entities.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the specification of the KonnectConfigStoreSync resource.
            properties:
              combined:
                description: |-
                  Combined configures the single-entry mapping. It must be set if and only
                  if mode is Combined.
                properties:
                  certificateField:
                    default: tls.crt
                    description: |-
                      CertificateField is the key of the Secret data entry holding the
                      certificate PEM (chain included, if any). It maps to the JSON subfield
                      "certificate" in the stored value.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  keyField:
                    default: tls.key
                    description: |-
                      KeyField is the key of the Secret data entry holding the private key
                      PEM. It maps to the JSON subfield "key" in the stored value.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  storeKey:
                    description: |-
                      StoreKey is the key of the Config Store entry holding the pair. When
                      unset, the controller derives it from the sync's identity using the
                      length-prefixed format k8s-<len(namespace)>-<namespace>-<len(name)>-<name>.
                      Set it explicitly only for topologies that require identical reference
                      strings across Control Planes (e.g. multi-CP fan-out).

                      It is immutable once set.
                    maxLength: 512
                    minLength: 1
                    pattern: ^[A-Za-z0-9._-]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: spec.combined.certificateField and spec.combined.keyField
                    must be different
                  rule: self.certificateField != self.keyField
                - message: spec.combined.storeKey is immutable once set
                  rule: '!has(oldSelf.storeKey) || (has(self.storeKey) && self.storeKey
                    == oldSelf.storeKey)'
              configStoreRef:
                description: |-
                  ConfigStoreRef is a reference to the KonnectConfigStore this sync writes
                  to. The sync reads the store's Konnect ID and Control Plane ID from the
                  referenced store's status and never resolves a Control Plane itself.

                  The reference is immutable. Moving synchronization to another store
                  requires creating a new KonnectConfigStoreSync and explicitly migrating
                  consumers before removing this one. Referencing a store in another
                  namespace requires a KongReferenceGrant in the referenced namespace
                  allowing it; that is enforced by the controller, not by CRD validation.
                properties:
                  name:
                    description: Name is the name of the referred resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referred resource.

                      For namespace-scoped resources if no Namespace is provided then the
                      namespace of the parent object MUST be used.

                      This field MUST not be set when referring to cluster-scoped resources.
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Orphan
                description: |-
                  DeletionPolicy determines what happens to the Config Store entries owned
                  by this sync when the sync is deleted. It is mutable, including during
                  deletion - that is the intended escape hatch.
                enum:
                - Orphan
                - Delete
                type: string
              mode:
                default: Combined
                description: |-
                  Mode selects how Secret data is mapped to Config Store entries.
                  It is immutable: re-keying is an explicit create-new-sync-and-migrate
                  procedure because the reference string itself changes with the key.
                enum:
                - Combined
                - Split
                type: string
              secretRef:
                description: |-
                  SecretRef is a reference to the Secret whose data is synced to the
                  Config Store. It is mutable: repointing at another Secret changes only
                  the synced value, not the entry key.

                  Referencing a Secret in another namespace requires a KongReferenceGrant
                  in the referenced namespace allowing it; that is enforced by the
                  controller, not by CRD validation.
                properties:
                  name:
                    description: Name is the name of the referred resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referred resource.

                      For namespace-scoped resources if no Namespace is provided then the
                      namespace of the parent object MUST be used.

                      This field MUST not be set when referring to cluster-scoped resources.
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              split:
                description: |-
                  Split configures the per-field mapping. It must be set if and only if
                  mode is Split.
                properties:
                  entries:
                    description: |-
                      Entries lists the Secret data fields to sync. Fields may be added or
                      removed freely; the storeKey of an existing entry (identified by its
                      field) is immutable. To replace a key safely, first sync its replacement
                      (in this sync if capacity permits, otherwise in another sync), migrate
                      consumers, then remove the old entry. A removed entry still in use is
                      preserved in the store but no longer updated from the Secret.
                    items:
                      description: |-
                        KonnectConfigStoreSyncSplitEntry maps one Secret data field to one Config
                        Store entry.
                      properties:
                        field:
                          description: |-
                            Field is the key of the Secret data entry to sync. Any Secret data key
                            may be mapped; it is validated as a Secret key name, not whitelisted.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[-._a-zA-Z0-9]+$
                          type: string
                        storeKey:
                          description: |-
                            StoreKey is the key of the Config Store entry holding this field's
                            value. When unset, the controller derives it as <derived sync key>-<field>.

                            It is immutable once set (per entry, identified by its field).
                          maxLength: 512
                          minLength: 1
                          pattern: ^[A-Za-z0-9._-]+$
                          type: string
                      required:
                      - field
                      type: object
                    maxItems: 64
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - field
                    x-kubernetes-list-type: map
                required:
                - entries
                type: object
                x-kubernetes-validations:
                - message: spec.split.entries storeKeys must be unique
                  rule: self.entries.all(e, self.entries.filter(o, has(o.storeKey)
                    && has(e.storeKey) && o.storeKey == e.storeKey).size() <= 1)
                - message: spec.split.entries storeKey is immutable for entries that
                    keep their field
                  rule: self.entries.all(n, !oldSelf.entries.exists(o, o.field ==
                    n.field && has(o.storeKey)) || (has(n.storeKey) && oldSelf.entries.exists(o,
                    o.field == n.field && has(o.storeKey) && o.storeKey == n.storeKey)))
            required:
            - configStoreRef
            - secretRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of spec.combined or spec.split must be set, matching
                spec.mode
              rule: has(self.combined) == (self.mode == 'Combined') && has(self.split)
                == (self.mode == 'Split')
          status:
            description: Status is the status of the KonnectConfigStoreSync resource.
            properties:
              conditions:
                default:
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: ConfigStoreRefValid
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: SecretRefValid
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: PairValid
                - lastTransitionTime: "1970-01-01T00:00:00Z"
                  message: Waiting for controller
                  reason: Pending
                  status: Unknown
                  type: Synced
                description: |-
                  Conditions describe the status of the KonnectConfigStoreSync.
                  All four condition types (ConfigStoreRefValid, SecretRefValid, PairValid,
                  Synced) are always present so that kubectl wait never hangs.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                minItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneID:
                description: |-
                  ControlPlaneID is the Konnect ID of the Control Plane the referenced
                  Config Store belongs to, observed from the store's status. A sync never
                  resolves a Control Plane itself.
                maxLength: 256
                type: string
              entries:
                description: |-
                  Entries reports durable state for desired Config Store entries this sync
                  has written, including entries currently lost in per-key conflict
                  election, plus entries retained while cleanup is blocked. Removed entries
                  awaiting cleanup are not published in References. The limit accommodates
                  one full desired set and one full set awaiting cleanup.
                items:
                  description: |-
                    KonnectConfigStoreSyncEntryStatus reports durable state for one Config Store
                    entry written by the sync.
                  properties:
                    hash:
                      description: |-
                        Hash is the SHA-256 hash ("sha256:<hex>") of the value written to the
                        store. The value itself is never exposed: status, logs and events must
                        never contain Secret plaintext.
                      maxLength: 71
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    keyBytes:
                      description: |-
                        KeyBytes is the size in bytes of the resolved store key, measured
                        against the 512-byte key cap.
                      format: int64
                      type: integer
                    lastPushTime:
                      description: LastPushTime is the time the entry was last pushed
                        to the Config Store.
                      format: date-time
                      type: string
                    notAfter:
                      description: |-
                        NotAfter is the expiry time of the certificate last written. It is only
                        set when the entry holds a certificate.
                      format: date-time
                      type: string
                    observedUpdatedAt:
                      description: |-
                        ObservedUpdatedAt is the store-side updated_at timestamp of the entry,
                        observed from the Config Store API. It is a drift signal: a value
                        advancing without a corresponding push means the entry was modified
                        outside this sync.
                      format: date-time
                      type: string
                    sourceFields:
                      description: SourceFields are the Secret data keys whose values
                        produced this entry.
                      items:
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    storeKey:
                      description: StoreKey is the resolved key of the Config Store
                        entry.
                      maxLength: 512
                      minLength: 1
                      type: string
                    valueBytes:
                      description: |-
                        ValueBytes is the size in bytes of the decoded value last written,
                        measured against the 5120-byte entry value cap.
                      format: int64
                      type: integer
                  required:
                  - sourceFields
                  - storeKey
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - storeKey
                x-kubernetes-list-type: map
              entriesSynced:
                description: |-
                  EntriesSynced is the number of desired entries this sync currently wins
                  and has synced to the Config Store.
                format: int32
                type: integer
              entriesTotal:
                description: EntriesTotal is the total number of entries this sync
                  manages.
                format: int32
                type: integer
              observedSecretResourceVersion:
                description: |-
                  ObservedSecretResourceVersion is the resourceVersion of the Secret at
                  the last successful sync. It is an observation aid only and is never an
                  input to a push decision.
                maxLength: 64
                type: string
              references:
                description: |-
                  References advertises suffixes for entries still declared in the spec
                  that this sync has successfully synced. Consumers can build a full
                  reference as {vault://<KongVault prefix>/<suffix>}. A later failed update
                  can leave the previous value serving; check Synced and EntriesSynced for
                  current freshness. This is not an inventory of all remote entries: a
                  spec-removed entry may still serve existing consumers while awaiting
                  cleanup, but is no longer updated or advertised here. Such entries remain
                  recorded in Entries.
                items:
                  description: |-
                    KonnectConfigStoreSyncReference publishes the reference suffix for one
                    desired, synced entry (or one JSON subfield of it), so consumers can assemble a
                    vault reference string as {vault://<KongVault prefix>/<suffix>} without
                    hand-assembling the store key and subfield fragments.
                  properties:
                    subfield:
                      description: |-
                        SubField is the JSON subfield of the Config Store entry value. It is
                        set for Combined mode entries ("certificate" or "key") and omitted for
                        Split mode entries, whose raw values are referenced by store key alone.
                      maxLength: 64
                      minLength: 1
                      type: string
                    suffix:
                      description: |-
                        Suffix is the suffix of the vault reference: "<storeKey>/<subfield>"
                        for Combined mode entries (e.g. "mytls/certificate"), or "<storeKey>"
                        for Split mode entries.
                      maxLength: 577
                      minLength: 1
                      type: string
                  required:
                  - suffix
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - suffix
                x-kubernetes-list-type: map
              storeID:
                description: |-
                  StoreID is the Konnect ID of the referenced Config Store, observed from
                  the store's status.
                maxLength: 256
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.mode is immutable
          rule: self.spec.mode == oldSelf.spec.mode
        - message: spec.configStoreRef is immutable
          rule: self.spec.configStoreRef == oldSelf.spec.configStoreRef
    served: true
    storage: true
    subresources:
      status: {}

name: nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  github-app-token:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kong-operator
  build-push-images:
    needs:
    - github-app-token
    uses: ./.github/workflows/__build-workflow.yaml
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_PUSH_TOKEN_KO_NIGHTLY }}
      gh-pat: ${{ needs.github-app-token.outputs.token }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
      slack-team-id: ${{ secrets.SLACK_TEAM_ID }}
    with:
      username: ${{ vars.DOCKERHUB_PUSH_USERNAME_NIGHTLY }}
      registry: docker.io
      image-name: ${{ vars.DOCKERHUB_IMAGE_NAME_KO_NIGHTLY }}
      push: true
      slack-send: true
      # Ensure manual workflow_dispatch runs produce the same 'nightly' and YYYYMMDD
      # tags as scheduled runs, so the nightly Helm chart can consume the image.
      nightly-tags: true

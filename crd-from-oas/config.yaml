apiGroupVersions:
  aiconfiguration.konghq.com/v1alpha1:
    categories:
      - kong
    # Don't generate groupversion_info.go for this API group — it is hand-written.
    # zz_generated_groupversion_info.go (addKnownTypesGenerated) is still emitted.
    generateGroupVersionInfo: false
    commonTypes:
      objectRef:
        import:
          path: github.com/kong/kong-operator/v2/api/common/v1alpha1
          alias: commonv1alpha1
    types:
      # AI Gateway APIs
      - path: /v1/ai-gateways/{gatewayId}/data-plane-certificates
        name: AIGatewayDataPlaneCertificate
        dataSources:
          - path: spec.apiSpec.cert
            type: Secret
        ops:
          sdk:
          # AIGatewayDataPlaneClientCertificate is named struct in SDK
            interface: github.com/Kong/sdk-konnect-go.AIGatewayDataPlaneCertificatesSDK
            fieldName: AIGatewayDataPlaneCertificates
          requireClient: true
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayDataPlaneCertificateRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/auth-strategies
        name: AIGatewayAuthStrategy
        dataSources:
          - path: spec.apiSpec.openid-connect.config.clientSecret
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayAuthStrategiesSDK
            fieldName: AIGatewayAuthStrategies
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayAuthStrategyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayAuthStrategyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/models
        name: AIGatewayModel
        # AIGatewayModelRouteConfig's "model" field is an inline oneOf whose
        # variants have no OAS discriminator/$ref, so they'd otherwise generate
        # as generic Variant1/Variant2/Variant3. Name them from their OAS
        # titles (matching the SDK's AIGatewayModelRouteConfigBody/Headers/
        # PathAliases) instead. Each variant also has exactly one nested
        # property, so it's flattened onto the wrapper field directly (e.g.
        # Body apiextensionsv1.JSON, PathAliases []string) instead of a
        # single-field wrapper struct, avoiding a doubled JSON key like
        # route.model.pathAliases.pathAliases. Opt-in only: unlisted unions
        # elsewhere are unaffected.
        oneOfVariantNamesFromTitle:
          - AIGatewayModelRouteConfigModel
        references:
          - path: spec.apiSpec.api.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.model.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.api.access.acls.allow.allow
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.api.access.acls.deny.deny
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.model.access.acls.allow.allow
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.model.access.acls.deny.deny
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.api.targets.provider
            kinds: [AIGatewayModelProvider]
            refTypeName: AIGatewayModelProviderRef
            resolvesTo: name
          - path: spec.apiSpec.model.targets.provider
            kinds: [AIGatewayModelProvider]
            refTypeName: AIGatewayModelProviderRef
            resolvesTo: name
          - path: spec.apiSpec.api.access.authStrategies
            kinds: [AIGatewayAuthStrategy]
            refTypeName: AIGatewayAuthStrategyRef
            resolvesTo: name
          - path: spec.apiSpec.model.access.authStrategies
            kinds: [AIGatewayAuthStrategy]
            refTypeName: AIGatewayAuthStrategyRef
            resolvesTo: name
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayModelsSDK
            fieldName: AIGatewayModels
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayModelRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayModelRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/model-providers
        name: AIGatewayModelProvider
        dataSources:
          # Basic-auth token: matches the 15 providers whose auth is a direct
          # (non-union) basic config; skipped for the 4 cloud providers below,
          # whose auth is itself a discriminated union.
          - path: spec.apiSpec.*.config.auth.headers[].value
            type: Secret
          - path: spec.apiSpec.*.config.auth.params[].value
            type: Secret
          # Cloud providers' basic-auth arm: matches when their union-typed
          # auth field is configured with the "basic" variant.
          - path: spec.apiSpec.*.config.auth.basic.headers[].value
            type: Secret
          - path: spec.apiSpec.*.config.auth.basic.params[].value
            type: Secret
          # Cloud-native credentials, one path per provider since each names
          # its secret field differently.
          - path: spec.apiSpec.bedrock.config.auth.aws.secretAccessKey
            type: Secret
          - path: spec.apiSpec.azure.config.auth.azure.clientSecret
            type: Secret
          - path: spec.apiSpec.gemini.config.auth.gcp.serviceAccountJSON
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayModelProvidersSDK
            fieldName: AIGatewayModelProviders
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayModelProviderRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayModelProviderRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/agents
        name: AIGatewayAgent
        references:
          - path: spec.apiSpec.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.access.acls.allow.allow
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.access.acls.deny.deny
            kinds: [AIGatewayConsumerGroup]
            refTypeName: AIGatewayACLRef
            resolvesTo: name
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.access.authStrategies
            kinds: [AIGatewayAuthStrategy]
            refTypeName: AIGatewayAuthStrategyRef
            resolvesTo: name
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayAgentsSDK
            fieldName: AIGatewayAgents
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayAgentRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayAgentRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/consumers
        name: AIGatewayConsumer
        # consumerGroups is a top-level spec field (sibling of apiSpec) listing the
        # AIGatewayConsumerGroups this consumer belongs to. Membership is enforced
        # in Konnect by the hand-written enforceAIGatewayConsumerConsumerGroups
        # helper via UpdateAiGatewayConsumerGroupsForConsumer.
        associations:
          - name: consumerGroups
            kinds: [AIGatewayConsumerGroup]
            sdkMethod: UpdateAiGatewayConsumerGroupsForConsumer
        references:
          - path: spec.apiSpec.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayConsumersSDK
            fieldName: AIGatewayConsumers
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayConsumerRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayConsumerRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/consumer-groups
        name: AIGatewayConsumerGroup
        references:
          - path: spec.apiSpec.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayConsumerGroupsSDK
            fieldName: AIGatewayConsumerGroups
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayConsumerGroupRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayConsumerGroupRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/mcp-servers
        name: AIGatewayMCPServer
        references:
          - path: spec.apiSpec.conversion-listener.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.conversion-only.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          # sources lists other MCP Servers (by metadata.name) whose tools this
          # listener exposes; the operator resolves each entry to the referenced
          # CR's Konnect name (its immutable arm name).
          - path: spec.apiSpec.listener.sources
            kinds: [AIGatewayMCPServer]
            resolvesTo: name
          - path: spec.apiSpec.listener.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.passthrough-listener.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          - path: spec.apiSpec.upstream-server.policies
            kinds: [AIGatewayPolicy]
            resolvesTo: name
          # Auth strategies referenced by the access union's consumer and
          # oauthAccessToken arms (by metadata.name, resolved to the auth
          # strategy's Konnect name).
          - path: spec.apiSpec.listener.access.consumer.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          - path: spec.apiSpec.listener.access.oauthAccessToken.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          - path: spec.apiSpec.conversion-listener.access.consumer.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          - path: spec.apiSpec.conversion-listener.access.oauthAccessToken.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          - path: spec.apiSpec.passthrough-listener.access.consumer.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          - path: spec.apiSpec.passthrough-listener.access.oauthAccessToken.authStrategies
            kinds: [AIGatewayAuthStrategy]
            resolvesTo: name
          # Consumer group ACLs (by metadata.name, resolved to the consumer
          # group's Konnect name). acls/defaultToolAcls are plain objects with
          # allow/deny arrays; tool-level access.acls lives inside the tools
          # array elements.
          - path: spec.apiSpec.listener.access.consumer.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.consumer.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.consumer.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.consumer.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.oauthAccessToken.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.oauthAccessToken.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.oauthAccessToken.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.listener.access.oauthAccessToken.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.consumer.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.consumer.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.consumer.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.consumer.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.oauthAccessToken.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.oauthAccessToken.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.oauthAccessToken.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.access.oauthAccessToken.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.consumer.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.consumer.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.consumer.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.consumer.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.oauthAccessToken.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.oauthAccessToken.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.oauthAccessToken.defaultToolAcls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.access.oauthAccessToken.defaultToolAcls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.tools.access.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-listener.tools.access.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-only.tools.access.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.conversion-only.tools.access.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.tools.access.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.passthrough-listener.tools.access.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.upstream-server.tools.access.acls.allow
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
          - path: spec.apiSpec.upstream-server.tools.access.acls.deny
            kinds: [AIGatewayConsumerGroup]
            resolvesTo: name
            refTypeName: AIGatewayMCPACLRef
            supportCrossNamespaceReference: true
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayMCPServersSDK
            fieldName: AIGatewayMCPServers
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayMCPServerRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayMCPServerRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      # AIGatewayConsumerCredential is a child of AIGatewayConsumer. Credentials
      # only obtain a Konnect ID once associated with a consumer, so they are
      # modelled as a separate resource that references the consumer (analogous to
      # KongPluginBinding), matching the OpenAPI resource hierarchy.
      # Credentials support create/delete only (no update). The api_key value is
      # write-only and sourced from a Secret; it is never echoed back in status.
      - path: /v1/ai-gateways/{gatewayId}/consumers/{consumerId}/credentials
        name: AIGatewayConsumerCredential
        dataSources:
          - path: spec.apiSpec.apiKey
            type: Secret
        ops:
          sdk:
          # AIGatewayConsumerCredential shares the AIGatewayConsumersSDK interface
          # with AIGatewayConsumer; the SDK exposes credential ops on it directly.
            interface: github.com/Kong/sdk-konnect-go.AIGatewayConsumersSDK
            fieldName: AIGatewayConsumers
          requireClient: true
          create:
          # Two-level-deep nested resource: the SDK create method takes the
          # operations request wrapper (path params + body), not the components body.
            path: github.com/Kong/sdk-konnect-go/models/operations.CreateAiGatewayConsumerCredentialRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: AIGatewayConsumer
            group: aiconfiguration.konghq.com
          ancestorEntityGVKs:
            - kind: KonnectAIGateway
              group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayConsumerRef

      - path: /v1/ai-gateways/{gatewayId}/policies
        name: AIGatewayPolicy
        dataSources:
          - path: spec.apiSpec.config
            type: Secret
        references:
          # `type` takes a plugin name: a built-in plugin, or a custom policy's
          # Konnect name. customPolicyRef lets a policy use an
          # AIGatewayCustomPolicy declared in the cluster instead of copying
          # its Konnect name into `type`; exactly one of the two is set.
          - path: spec.apiSpec.customPolicyRef
            kinds: [AIGatewayCustomPolicy]
            resolvesTo: name
            injectInto: type
            # Konnect refuses to delete a custom policy while policies use it;
            # the AIGatewayCustomPolicy controller watches the policies so a
            # blocked deletion resumes as soon as the last one using it is gone.
            reverseWatch: true
            description: >-
              CustomPolicyRef references the AIGatewayCustomPolicy this policy
              uses, as an alternative to setting type to the custom policy's
              Konnect name. The referenced custom policy must be programmed in
              the same AI Gateway; its Konnect name is sent as the policy type.
              Exactly one of type and customPolicyRef must be set.
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayPoliciesSDK
            fieldName: AIGatewayPolicies
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayPolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayPolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/custom-policies
        name: AIGatewayCustomPolicy
        # The Lua schema/handler sources can be provided inline or sourced from
        # a ConfigMap key. The shared ConfigMapDataSource type bounds the inline
        # value to 256KiB, since the OAS declares no maxLength for these fields
        # and the generator's default string limit (253) would reject any
        # realistic plugin.
        dataSources:
          - path: spec.apiSpec.installed.schema
            type: ConfigMap
          - path: spec.apiSpec.streaming.schema
            type: ConfigMap
          - path: spec.apiSpec.streaming.handler
            type: ConfigMap
        # The name is documented as immutable after creation, and so is the
        # type: Konnect rejects an update switching between installed and
        # streaming, so a type change requires recreating the object.
        cel:
          spec:
            apiSpec:
              _validations:
                - "+kubebuilder:validation:XValidation:rule=\"!has(oldSelf.type) || self.type == oldSelf.type\",message=\"type is immutable\""
              installed:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
              streaming:
                name:
                  _validations:
                    - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayCustomPoliciesSDK
            fieldName: AIGatewayCustomPolicies
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayCustomPolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayCustomPolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef
            # Custom policies support both KonnectAIGateway and OnPremAIGateway
            # parents: the on-prem controllers and config translator now handle
            # this entity.
            allowedKinds:
              - KonnectAIGateway
              - OnPremAIGateway

      - path: /v1/ai-gateways/{gatewayId}/ca-certificates
        name: AIGatewayCACertificate
        dataSources:
          - path: spec.apiSpec.cert
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayCACertificatesSDK
            fieldName: AIGatewayCACertificates
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayCACertificateRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayCACertificateRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      - path: /v1/ai-gateways/{gatewayId}/certificates
        name: AIGatewayCertificate
        dataSources:
          - path: spec.apiSpec.cert
            type: Secret
          - path: spec.apiSpec.key
            type: Secret
          - path: spec.apiSpec.certAlt
            type: Secret
          - path: spec.apiSpec.keyAlt
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewayCertificatesSDK
            fieldName: AIGatewayCertificates
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayCertificateRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayCertificateRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

      # The nested /certificates/{certificateId}/snis path is not modelled as
      # a separate CRD: it's the same underlying SNI object as /snis (just
      # addressed via a different path param), and the OAS marks it
      # x-terraform-excluded for that reason — a second CRD here would let the
      # same Konnect object be managed two ways and drift.
      - path: /v1/ai-gateways/{gatewayId}/snis
        name: AIGatewaySNI
        references:
          - path: spec.apiSpec.certificate
            kinds: [AIGatewayCertificate]
            resolvesTo: name
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewaySNIsSDK
            fieldName: AIGatewaySNIs
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewaySNIRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewaySNIRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectAIGateway
            group: konnect.konghq.com
          parentRef:
            fieldName: aiGatewayRef
            typeName: AIGatewayRef

  configuration.konghq.com/v1alpha1:
    categories:
      - kong
    # Don't generate groupversion_info.go for this API group — it is hand-written.
    # zz_generated_groupversion_info.go (addKnownTypesGenerated) is still emitted.
    generateGroupVersionInfo: false
    commonTypes:
      objectRef:
        import:
          path: github.com/kong/kong-operator/v2/api/common/v1alpha1
          alias: commonv1alpha1
    types:
      # Event Gateway APIs
      - path: /v1/event-gateways/{gatewayId}/data-plane-certificates
        name: EventGatewayDataPlaneCertificate
        dataSources:
          - path: spec.apiSpec.certificate
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayDataPlaneCertificatesSDK
            fieldName: EventGatewayDataPlaneCertificates
          requireClient: true
          # Konnect has no labels on Event Gateway data plane certificates, so
          # the lookup matches the certificate's content, which must be resolved
          # from its Secret: the generated lookup can't, see
          # controller/konnect/ops/ops_eventgatewaydataplanecertificate_lookup.go.
          skipGetForUID: true
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateEventGatewayDataPlaneCertificateRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateEventGatewayDataPlaneCertificateRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
      - path: /v1/event-gateways/{gatewayId}/schema-registries
        name: EventGatewaySchemaRegistry
        dataSources:
          - path: spec.apiSpec.confluent.config.authentication.basic.password
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewaySchemaRegistriesSDK
            fieldName: EventGatewaySchemaRegistries
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.SchemaRegistryCreate
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewaySchemaRegistryRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
      - path: /v1/event-gateways/{gatewayId}/tls-trust-bundles
        name: EventGatewayTLSTrustBundle
        dataSources:
          - path: spec.apiSpec.config.trustedCa
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayTLSTrustBundlesSDK
            fieldName: EventGatewayTLSTrustBundles
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateTLSTrustBundleRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewayTLSTrustBundleRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
      - path: /v1/event-gateways/{gatewayId}/listeners
        name: EventGatewayListener
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayListenersSDK
            fieldName: EventGatewayListeners
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateEventGatewayListenerRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateEventGatewayListenerRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
      - path: /v1/event-gateways/{gatewayId}/listeners/{eventGatewayListenerId}/policies
        name: EventGatewayListenerPolicy
        references:
          # Additive: Konnect trust bundle IDs/names keep working; namespacedRef
          # references an EventGatewayTLSTrustBundle in the cluster instead. It
          # resolves to the Konnect ID, which is how Konnect binds the bundle, so
          # renaming a trust bundle can't rebind the policy to another bundle.
          - path: spec.apiSpec.tlsServer.config.clientAuthentication.tlsTrustBundles
            kinds: [EventGatewayTLSTrustBundle]
            resolvesTo: id
            unionMember: namespacedRef
            # Konnect allows deleting a trust bundle used by listener policies,
            # leaving them referencing a missing trust bundle (failing their
            # next update), so the operator blocks the deletion while Konnect
            # listener policies reference it (see
            # deleteEventGatewayTLSTrustBundleGuarded). The
            # EventGatewayTLSTrustBundle controller watches the policies so the
            # deletion is retried as soon as one referencing it through
            # namespacedRef is deleted (otherwise on the periodic retry of a
            # blocked deletion), and a trust bundle being deleted is not
            # resolved for policies not created in Konnect yet.
            reverseWatch: true
        dataSources:
          - path: spec.apiSpec.tlsServer.config.certificates[].certificate
            type: Secret
          - path: spec.apiSpec.tlsServer.config.certificates[].key
            type: Secret
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayListenerPoliciesSDK
            fieldName: EventGatewayListenerPolicies
          getForUID:
            listItemsSource: slice
          create:
            path: github.com/Kong/sdk-konnect-go/models/operations.CreateEventGatewayListenerPolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewayListenerPolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: EventGatewayListener
          ancestorEntityGVKs:
            - kind: KonnectEventGateway
              group: konnect.konghq.com
          # Speakeasy SDK uses "ListenerID" (not "EventGatewayListenerID") for the
          # eventGatewayListenerId path param when it appears as a parent (not entity ID).
          parentSDKFields:
            - GatewayID
            - ListenerID
      - path: /v1/event-gateways/{gatewayId}/backend-clusters
        name: EventGatewayBackendCluster
        cel:
          spec:
            apiSpec:
              tls:
                caBundle:
                  _validations:
                    - "+kubebuilder:validation:MaxLength=4096"
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayBackendClustersSDK
            fieldName: EventGatewayBackendClusters
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateBackendClusterRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateBackendClusterRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: KonnectEventGateway
            group: konnect.konghq.com
        dataSources:
          - path: spec.apiSpec.tls.clientIdentity.certificate
            type: Secret
          - path: spec.apiSpec.tls.clientIdentity.key
            type: Secret
      - path: /v1/event-gateways/{gatewayId}/virtual-clusters
        name: EventGatewayVirtualCluster
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayVirtualClustersSDK
            fieldName: EventGatewayVirtualClusters
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateVirtualClusterRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateVirtualClusterRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: EventGatewayBackendCluster
          ancestorEntityGVKs:
            - kind: KonnectEventGateway
              group: konnect.konghq.com
          parentRef:
            fieldName: eventGatewayBackendClusterRef
            replacesAPISpecField: destination
      - path: /v1/event-gateways/{gatewayId}/virtual-clusters/{virtualClusterId}/produce-policies
        name: EventGatewayVirtualClusterProducePolicy
        schemaFieldOmissions:
          EventGatewayModifyHeadersPolicyCreate:
            - parentPolicyID
          EventGatewayParsedRecordEncryptFieldsPolicyCreate:
            - parentPolicyID
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayVirtualClusterProducePoliciesSDK
            fieldName: EventGatewayVirtualClusterProducePolicies
          getForUID:
            listItemsSource: slice
          create:
            path: github.com/Kong/sdk-konnect-go/models/operations.CreateEventGatewayVirtualClusterProducePolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewayVirtualClusterProducePolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: EventGatewayVirtualCluster
          parentRef:
            fieldName: eventGatewayVirtualClusterRef
          ancestorEntityGVKs:
            - kind: KonnectEventGateway
              group: konnect.konghq.com
      - path: /v1/event-gateways/{gatewayId}/virtual-clusters/{virtualClusterId}/consume-policies
        name: EventGatewayVirtualClusterConsumePolicy
        references:
          - path: spec.apiSpec.schemaValidation.config.json.schemaRegistry
            kinds: [EventGatewaySchemaRegistry]
            resolvesTo: name
          - path: spec.apiSpec.schemaValidation.config.confluentSchemaRegistry.schemaRegistry
            kinds: [EventGatewaySchemaRegistry]
            resolvesTo: name
        schemaFieldOmissions:
          EventGatewayModifyHeadersPolicyCreate:
            - parentPolicyID
          EventGatewayParsedRecordDecryptFieldsPolicyCreate:
            - parentPolicyID
          EventGatewaySkipRecordPolicyCreate:
            - parentPolicyID
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayVirtualClusterConsumePoliciesSDK
            fieldName: EventGatewayVirtualClusterConsumePolicies
          getForUID:
            listItemsSource: slice
          create:
            path: github.com/Kong/sdk-konnect-go/models/operations.CreateEventGatewayVirtualClusterConsumePolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewayVirtualClusterConsumePolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind:  EventGatewayVirtualCluster
          ancestorEntityGVKs:
            - kind: KonnectEventGateway
              group: konnect.konghq.com
          parentRef:
            fieldName: eventGatewayVirtualClusterRef
      - path: /v1/event-gateways/{gatewayId}/virtual-clusters/{virtualClusterId}/cluster-policies
        name: EventGatewayVirtualClusterPolicy
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewayVirtualClusterPoliciesSDK
            fieldName: EventGatewayVirtualClusterPolicies
          getForUID:
            listItemsSource: slice
          create:
            path: github.com/Kong/sdk-konnect-go/models/operations.CreateEventGatewayVirtualClusterClusterLevelPolicyRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateEventGatewayVirtualClusterClusterLevelPolicyRequest
          delete: {}
        reconciler:
          parentEntityGVK:
            kind: EventGatewayVirtualCluster
          ancestorEntityGVKs:
            - kind: KonnectEventGateway
              group: konnect.konghq.com
          parentRef:
            fieldName: eventGatewayVirtualClusterRef

  konnect.konghq.com/v1alpha1:
    categories:
      - konnect
      - kong
    # Don't generate groupversion_info.go for this API group — it is hand-written.
    # zz_generated_groupversion_info.go (addKnownTypesGenerated) is still emitted.
    generateGroupVersionInfo: false
    commonTypes:
      objectRef:
        import:
          path: github.com/kong/kong-operator/v2/api/common/v1alpha1
          alias: commonv1alpha1
    types:
      # AI Gateway APIs
      - path: /v1/ai-gateways
        name: KonnectAIGateway
        source:
          supportsMirror: true
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.AIGatewaysSDK
            fieldName: AIGateways
          listCallStylePositional: true
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateAIGatewayRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateAIGatewayRequest
          delete: {}
          responseStatusFields:
            - statusField: Endpoints
              statusJSON: endpoints
              fields:
                - name: Configuration
                  json: configuration
                  respPath: Endpoints.Configuration
                - name: Telemetry
                  json: telemetry
                  respPath: Endpoints.Telemetry
            - statusField: ConfigVersion
              statusJSON: configVersion
              respPath: ConfigVersion
        reconciler: {}

      # Event Gateway APIs
      - path: /v1/event-gateways
        name: KonnectEventGateway
        source:
          supportsMirror: true
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.EventGatewaysSDK
            fieldName: EventGateways
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateGatewayRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdateGatewayRequest
          delete: {}
        reconciler: {}

      # Portal APIs
      - path: /v3/portals
        cel:
          spec:
            apiSpec:
              name:
                _validations:
                  - "+kubebuilder:validation:XValidation:rule=\"self == oldSelf\",message=\"name is immutable\""
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalsSDK
            fieldName: Portals
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreatePortal
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdatePortal
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/identity-providers
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalAuthSettingsSDK
            fieldName: PortalAuthSettings
          # The SDK list endpoint uses positional args and response items lack
          # labels/tags, so recover conflicts by matching the stable spec
          # fields of the selected identity-provider config variant that are
          # echoed back by the API. This mitigates
          # https://github.com/Kong/kong-operator/issues/3987.
          listCallStylePositional: true
          getForUID:
            listItemsSource: slice
            rootUnion:
              unionField: Spec.APISpec.Config
              responseTypePointer: true
              responseVariantContainer: GetConfig()
              cases:
                - typeValue: oIDC
                  variantField: OIDC
                  responseTypeValue: oidc
                  responseVariantField: OIDCIdentityProviderConfigOutput
                  matchFields:
                    - objectField: IssuerURL
                      responseField: GetIssuerURL()
                    - objectField: ClientID
                      responseField: GetClientID()
                - typeValue: portalSAML
                  variantField: PortalSAML
                  responseTypeValue: saml
                  responseVariantField: PortalSAMLIdentityProviderConfig
                  # Both SAML metadata fields are optional and only one is
                  # normally set (the field docs prefer idp_metadata_url), and
                  # Konnect may populate the other server-side. Requiring exact
                  # equality on an unset field would make conflict recovery fail
                  # for perfectly valid specs, so only compare what the spec
                  # actually sets.
                  matchFields:
                    - objectField: IdpMetadataURL
                      responseField: GetIdpMetadataURL()
                      skipWhenUnset: true
                    - objectField: IdpMetadataXML
                      responseField: GetIdpMetadataXML()
                      skipWhenUnset: true
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalCreateIdentityProvider
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalUpdateIdentityProvider
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/teams
        ops:
          getForUID:
            # Portal teams do not expose labels/tags in Konnect list responses,
            # so recover conflicts by matching the stable spec fields that are
            # echoed back by the API. Only the immutable identifier (name) is
            # used here; user-mutable fields like description are left to the
            # subsequent update reconciliation. This mitigates
            # https://github.com/Kong/kong-operator/issues/3987.
            matchFields:
              - objectField: Spec.APISpec.Name
                responseField: GetName()
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalTeamsSDK
            fieldName: PortalTeams
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalCreateTeamRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalUpdateTeamRequest
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/pages
        references:
          # Pages form a hierarchy within a portal: parentPageIDRef points at
          # the parent PortalPage (same type) whose Konnect ID is sent as
          # parent_page_id. https://github.com/Kong/kong-operator/issues/4008
          - path: spec.apiSpec.parentPageIDRef
            kinds: [PortalPage]
            resolvesTo: id
        ops:
          getForUID:
            # Portal pages do not expose labels/tags in Konnect list responses;
            # match on the immutable slug (unique within a portal) so user
            # edits to title/description don't break conflict recovery. This
            # mitigates https://github.com/Kong/kong-operator/issues/3987.
            matchFields:
              - objectField: Spec.APISpec.Slug
                responseField: GetSlug()
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalPagesSDK
            fieldName: PortalPages
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreatePortalPageRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdatePortalPageRequest
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/email-config
        name: PortalEmailConfig
        ops:
          # PortalEmailConfig is a singleton per portal; the generator emits a
          # singular GET that returns the only entry, so no matchFields config
          # is needed. Any spec drift is reconciled by the subsequent update.
          # This mitigates https://github.com/Kong/kong-operator/issues/3987.
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalEmailsSDK
            fieldName: PortalEmails
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.PostPortalEmailConfig
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.PatchPortalEmailConfig
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/ip-allow-list
        name: PortalIPAllowList
        ops:
          getForUID:
            # Designates the field on the object to compare when using a fallback
            # because this type in Konnect doesn't support tags or labels.
            matchFields:
              - objectField: Spec.APISpec.AllowedIps
                responseField: AllowedIps
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalsIPAllowListSDK
            fieldName: PortalsIPAllowList
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreatePortalSourceIPRestriction
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.PutPortalIPAllowListRequest
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/custom-domain
        name: PortalCustomDomain
        cel:
          spec:
            apiSpec:
              ssl:
                withCustomCertificate:
                  customCertificate:
                     _validations:
                      - "+kubebuilder:validation:MaxLength=4096"
                  customPrivateKey:
                     _validations:
                      - "+kubebuilder:validation:MaxLength=4096"
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalCustomDomainsSDK
            fieldName: PortalCustomDomains
          getForUID:
            matchFields:
              - objectField: Spec.APISpec.Hostname
                responseField: Hostname
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreatePortalCustomDomainRequest
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.UpdatePortalCustomDomainRequest
          delete: {}
        reconciler: {}
      - path: /v3/portals/{portalId}/customization
        name: PortalCustomization
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.PortalCustomizationSDK
            fieldName: PortalCustomization
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalCustomization
          update:
            path: github.com/Kong/sdk-konnect-go/models/components.PortalCustomization
          delete:
            asPUT: true
        reconciler: {}

      # Konnect Config Store containers. Secret entries are intentionally not
      # configured here; they are managed out-of-band and are not part of the
      # KonnectConfigStore CRD.
      - path: /v2/control-planes/{controlPlaneId}/config-stores
        name: KonnectConfigStore
        ops:
          sdk:
            interface: github.com/Kong/sdk-konnect-go.ConfigStoresSDK
            fieldName: ConfigStores
          getForUID:
            # TODO: the list response puts its cursor in top-level `next` and
            # `offset`, not in `meta.page.next` as the Konnect spec (and so the
            # SDK) says, so the generated lookup only sees the first page of
            # config stores (--konnect-list-page-size, 100 by default). Drop
            # this note once Konnect returns `meta.page.next` or the spec
            # models `next`/`offset` (the generator would then need to support
            # it).
            matchFields:
              - objectField: Spec.APISpec.Name
                responseField: GetName()
          create:
            path: github.com/Kong/sdk-konnect-go/models/components.CreateConfigStore
          update:
            path: github.com/Kong/sdk-konnect-go/models/operations.UpdateConfigStoreRequest
          delete:
            path: github.com/Kong/sdk-konnect-go/models/operations.DeleteConfigStoreRequest
            # NOTE: Force is deliberately unset: Konnect rejects deleting a
            # config store that still holds secret entries with a 400
            # ("can not delete config store with secrets"), and the controller
            # reports that as a DeletionBlocked condition, keeping the CR's
            # finalizer until the user removes the entries. This prevents an
            # accidental store deletion from silently cascade-deleting every
            # secret in the store (which would break every SNI referencing
            # them). See https://github.com/Kong/kong-operator/issues/5708.
        reconciler:
          parentEntityGVK:
            kind: KonnectGatewayControlPlane
            group: konnect.konghq.com
            version: v1alpha2

# The updated Secret content for the secretRef policy: changing it must
# re-render the policy's config and re-push it to the data planes.
apiVersion: v1
kind: Secret
metadata:
  name: ($aigw_policy_secretref_name)
  namespace: ($namespace)
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  config: |
    add:
      headers:
        - "Modified-By-Policy-Secretref-Updated:Kong-Operator-Chainsaw-Test"

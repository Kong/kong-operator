                            items:
                              type: string
                            type: array
                          audienceClaim:
                            description: |-
                              The claim that contains the audience.
                              If multiple values are set, it means the claim is inside a nested object of
                              the token payload.
                            items:
                              type: string
                            type: array
                          audienceRequired:
                            description: |-
                              The audiences (`audience_claim` claim) required to be present in the access

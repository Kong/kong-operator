# The push of the OnPremEventGateway gateway_name is stopped by the backend
# cluster second, sent and renamed into the name of another.
apiVersion: eventgateway.konghq.com/v1alpha1
kind: OnPremEventGateway
metadata:
  name: ($gateway_name)
status:
  (conditions[?type == 'Programmed']):
    - status: "False"
      reason: InvalidEntities
      (contains(message, 'EventGatewayBackendCluster')): true
      (contains(message, '/second')): true

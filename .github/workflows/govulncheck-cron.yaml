name: govulncheck schedule

concurrency:
  # Run only for most recent commit in PRs but for all tags and commits on main
  # Ref: https://docs.github.com/en/actions/using-jobs/using-concurrency
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '42 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  branches:
    # Single source of truth for the scanned branches: a matrix can only read the needs, github,
    # vars and inputs contexts, so the list is published here for the scan and upload jobs.
    runs-on: ubuntu-latest
    outputs:
      scans: ${{ steps.set.outputs.scans }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - id: set
      run: |
        {
          echo 'scans<<EOF'
          yq eval -o=json '.' .github/govulncheck_branches.yaml
          echo 'EOF'
        } >> "${GITHUB_OUTPUT}"

  scan:
    needs: branches
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.branches.outputs.scans) }}
    uses: ./.github/workflows/__govulncheck.yaml
    with:
      ref: ${{ matrix.branch }}
      artifact-name: ${{ matrix.artifact }}
      output-format: sarif
      output-file: results.sarif
    permissions:
      contents: read

  upload:
    # The upload stays in this file rather than in the reusable workflow: the SARIF-upload step and
    # the security-events: write it needs have to sit together for the permission to be exempt.
    #
    # Run even when one branch's scan failed: the branches are scanned and uploaded independently.
    if: ${{ !cancelled() }}
    needs:
    - branches
    - scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.branches.outputs.scans) }}
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit
    - name: Checkout repository
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ matrix.branch }}

    - name: Download scan results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ matrix.artifact }}

    - name: Drop excluded advisories
      env:
        SARIF_IN: results.sarif
        SARIF_OUT: results-filtered.sarif
        FILTER: ./hack/govulncheck-sarif-with-excludes.sh
      run: |
        set -euo pipefail
        # The workflow runs from the default branch while the matrix scans a release branch, where
        # hack/ may carry no filter yet: fall back to the unfiltered SARIF.
        if [[ -x "${FILTER}" ]]; then
          "${FILTER}" "${SARIF_IN}" "${SARIF_OUT}"
        else
          cp "${SARIF_IN}" "${SARIF_OUT}"
        fi

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: results-filtered.sarif
        ref: refs/heads/${{ matrix.branch }}
        sha: ${{ steps.checkout.outputs.commit }}
        category: govulncheck

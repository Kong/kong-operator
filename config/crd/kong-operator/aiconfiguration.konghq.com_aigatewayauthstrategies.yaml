                          cacheTtlNeg:
                            description: The negative cache ttl in seconds.
                            type: number
                          cacheTtlResurrect:
                            description: The resurrection ttl in seconds.
                            type: number
                          cacheUserInfo:
                            description: Cache the user info requests.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                          claimsForbidden:
                            description: If given, these claims are forbidden in the

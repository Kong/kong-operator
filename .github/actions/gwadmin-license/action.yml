name: GWAdmin enveloped license
description: >
  Acquire an enveloped JWS from an explicitly selected static secret or the
  authorized signing service. Missing/unknown sources fail, with no automatic
  fallback. Only a private file path is exposed as an output.

inputs:
  # Temporary static JWS: payload expiry 2026-11-12, team-confirmed 30-day grace.
  # Replace it or switch to configured signing before that window ends.
  # Exact enforcement belongs to gw-admin; acquisition never verifies expiry.
  source:
    description: Explicit source, static (temporary issued JWS) or signing (online acquisition).
    required: true
  static-license:
    description: Raw compact JWS from a dedicated secret. Required only for source=static; not decoded or expiry-validated here.
    required: false
  username:
    description: Basic authentication username. Required only for source=signing.
    required: false
  password:
    description: Basic authentication password. Required only for source=signing.
    required: false
  customer:
    description: Authorized customer value. Required only for source=signing.
    required: false
  license-key:
    description: Authorized license_key value. Required only for source=signing.
    required: false
  expiration-date:
    description: Explicit future UTC license_expiration_date (YYYY-MM-DD). Required only for source=signing.
    required: false

outputs:
  license-file:
    description: Private runner-local file containing the issued compact JWS, not the license itself.
    value: ${{ steps.issue.outputs.license-file }}

runs:
  using: composite
  steps:
    - name: Acquire a GWAdmin license
      id: issue
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GW_ADMIN_LICENSE_SOURCE: ${{ inputs.source }}
        GW_ADMIN_LICENSE_JWS: ${{ inputs.source == 'static' && inputs.static-license || '' }}
        GW_ADMIN_LICENSE_SIGNING_USERNAME: ${{ inputs.source == 'signing' && inputs.username || '' }}
        GW_ADMIN_LICENSE_SIGNING_PASSWORD: ${{ inputs.source == 'signing' && inputs.password || '' }}
        GW_ADMIN_LICENSE_CUSTOMER: ${{ inputs.source == 'signing' && inputs.customer || '' }}
        GW_ADMIN_LICENSE_KEY: ${{ inputs.source == 'signing' && inputs.license-key || '' }}
        GW_ADMIN_LICENSE_EXPIRATION_DATE: ${{ inputs.source == 'signing' && inputs.expiration-date || '' }}
      run: bash "$ACTION_PATH/issue-license.sh" issue

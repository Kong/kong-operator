apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: onprem-dataplane-scaling
spec:
  description: |
    Stands up an OnPremAIGateway, an AIGatewayAgent route to the shared go-echo
    backend, and a single-replica AIGatewayDataPlane. Verifies traffic succeeds at
    1 replica, scales the AIGatewayDataPlane to 2 replicas in place
    (spec.deployment.replicas), asserts status.readyReplicas reaches 2, and
    verifies traffic keeps succeeding after the scale-up. Mirrors the Konnect
    suite's `dataplane-scaling` test (from-cluster steps only).
  bindings:
    - name: test_name
      value: ($namespace)
    - name: aigw_cp_name
      value: (join('-', [($test_name), 'onprem-cp']))
    - name: aigw_dp_name
      value: (join('-', [($test_name), 'dp']))
    - name: aigw_dp_image
      value: (env('AIGW_DP_IMAGE'))
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    - name: http_agent_name
      value: (join('-', [($test_name), 'http-agent']))
    - name: http_agent_route_path
      value: /http-agent
    # Defaults for verify-aigw-agent-request-from-cluster optional bindings.
    # Steps below only need to override what differs from these.
    - name: request_headers
      value: ''
    - name: request_body
      value: ''
    - name: content_type
      value: application/json
    - name: expected_status
      value: "200"
    - name: expected_status_not
      value: ''
    - name: expected_body
      value: ''
    - name: unexpected_body
      value: ''
    - name: expected_jsonrpc
      value: ''
    - name: expected_json_id
      value: ''
    - name: expected_json_result_text
      value: ''
    - name: oidc_token_url
      value: ''
    - name: oidc_client_id
      value: ''
    - name: oidc_client_secret
      value: ''
    - name: oidc_scope
      value: ''
    - name: expected_success
      value: 'true'
  steps:
    - name: Create-onprem-aigateway
      use:
        template: ../../common/_step_templates/apply-assert-onpremAIGateway.yaml
    - name: Start-echo-agent-backend
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml
    - name: Create-aigateway-agent
      try:
        - apply:
            file: 01-agent.yaml
    - name: Create-aigateway-dataplane-single-replica
      use:
        template: ../../common/_step_templates/apply-assert-aigatewayDataPlane.yaml
        with:
          bindings:
            - name: control_plane_ref
              value: "({type: 'onpremNamespacedRef', onpremNamespacedRef: {name: ($aigw_cp_name)}})"
    - name: Assert-agent-programmed
      try:
        - assert:
            resource:
              apiVersion: aiconfiguration.konghq.com/v1alpha1
              kind: AIGatewayAgent
              metadata:
                name: ($http_agent_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Programmed']):
                  - status: 'True'
    - name: Drive-traffic-at-single-replica
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_body
          value: Running on Pod
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    - name: Scale-aigateway-dataplane-to-two-replicas
      try:
        - patch:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              spec:
                deployment:
                  replicas: 2
        - assert:
            resource:
              apiVersion: aigateway.konghq.com/v1alpha1
              kind: AIGatewayDataPlane
              metadata:
                name: ($aigw_dp_name)
                namespace: ($namespace)
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                readyReplicas: 2
    # Repeated 3x to help sample traffic across both replicas.
    - name: Drive-traffic-after-scale-up-1
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_body
          value: Running on Pod
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    - name: Drive-traffic-after-scale-up-2
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_body
          value: Running on Pod
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
    - name: Drive-traffic-after-scale-up-3
      bindings:
        - name: method
          value: GET
        - name: route_path
          value: ($http_agent_route_path)
        - name: expected_body
          value: Running on Pod
      use:
        template: ../../common/_step_templates/verify-aigw-agent-request-from-cluster.yaml
  catch:
    - description: Capture debug snapshot on test failure.
      script:
        env:
          - name: TEST_NAME
            value: onprem-dataplane-scaling
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

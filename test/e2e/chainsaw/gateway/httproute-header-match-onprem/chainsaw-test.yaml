apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: httproute-header-match-onprem
spec:
  description: |
    Validates that an operator-managed on-prem Gateway routes HTTP traffic
    based on HTTPRoute header matches:
    1. Creating an HTTPRoute whose only rule matches a single exact header.
    2. Verifying traffic with the matching header returns 200.
    3. Verifying traffic without the header, or with a wrong value, returns 404.

  bindings:
    - name: test_name
      value: ($namespace)
    - name: gateway_namespace
      value: ($namespace)
    - name: gateway_name
      value: (join('-', [($namespace), 'gateway']))
    - name: gateway_image
      value: (env('GATEWAY_IMAGE'))
    - name: http_route_name
      value: httproute-header-match-onprem
    - name: http_route_namespace
      value: ($namespace)
    - name: echo_deployment_name
      value: echo
    - name: echo_deployment_namespace
      value: ($namespace)
    - name: echo_deployment_replicas
      value: 1
    - name: http_method
      value: "GET"
    - name: host_header
      value: ""

  steps:
    - name: Create-gateway-configuration
      description: Create an on-prem GatewayConfiguration.
      try:
        - apply:
            file: 01-gatewayconfiguration.yaml
        - assert:
            file: 01-gatewayconfiguration.yaml

    - name: Create-gateway-class
      description: Create a GatewayClass pointing at the on-prem GatewayConfiguration.
      use:
        template: ../../common/_step_templates/apply-assert-gatewayClass.yaml

    - name: Create-echo-backend
      description: Create the echo Deployment and Service backend.
      use:
        template: ../../common/_step_templates/apply-assert-echoService.yaml

    - name: Create-gateway
      description: Create an operator-managed HTTP Gateway and verify it is programmed.
      # The default 300s is not enough when four DataPlane proxy pods start at
      # once on a slow CI node: the Kong pod alone then takes over 5 minutes.
      timeouts:
        assert: 15m
      try:
        - apply:
            file: 02-gateway.yaml
        - assert:
            file: 02-assert-gateway.yaml

    - name: Create-httproute
      description: Create an HTTPRoute whose rule matches a single exact header.
      try:
        - apply:
            file: 03-httproute.yaml
        - assert:
            file: 03-assert-httproute.yaml

    - name: Verify-traffic-with-matching-header
      description: Verify traffic with the matching header value returns 200.
      use:
        template: ../../common/_step_templates/verify-header-match-routing.yaml
      bindings:
        - name: route_path
          value: /
        - name: request_headers
          value: 'single-header-1:v1'
        - name: expected_status
          value: '200'
        - name: listener_http_port
          value: "80"

    - name: Verify-traffic-without-header
      description: Verify traffic without the header returns 404.
      use:
        template: ../../common/_step_templates/verify-header-match-routing.yaml
      bindings:
        - name: route_path
          value: /
        - name: request_headers
          value: ''
        - name: expected_status
          value: '404'
        - name: listener_http_port
          value: "80"

    - name: Verify-traffic-with-wrong-header-value
      description: Verify traffic with an unmatched header value returns 404.
      use:
        template: ../../common/_step_templates/verify-header-match-routing.yaml
      bindings:
        - name: route_path
          value: /
        - name: request_headers
          value: 'single-header-1:v2'
        - name: expected_status
          value: '404'
        - name: listener_http_port
          value: "80"

  catch:
    - description: Capture debug snapshot
      script:
        env:
          - name: TEST_NAME
            value: gateway-httproute-header-match-onprem
          - name: NAMESPACE
            value: ($namespace)
          - name: OPERATOR_NAMESPACE
            value: kong-system
        content: |
          bash ../../common/scripts/debug_snapshot.sh

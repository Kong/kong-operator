name: "validate AIGateway dataplane image (targeted)"
run-name: "validate AIGateway dataplane ${{ format('{0}:{1}',
  github.event.inputs.aigateway-image-repo, github.event.inputs.aigateway-image-tag) }}"

on:
  workflow_dispatch:
    inputs:
      aigateway-image-repo:
        description: AIGateway dataplane Docker image to test with (repository).
        type: string
        required: true
        default: "kong/kong-ai-gateway-dev"
      aigateway-image-tag:
        description: AIGateway dataplane Docker image to test with (tag).
        type: string
        required: true
        default: "latest"
      send-slack-notification:
        description: Whether to send the result of the validation tests to Slack.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  resolve-k8s-version:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-latest
        run: |
          (
            echo 'latest<<EOF'
            yq eval -r -o=json '. | sort | reverse | .[0]' .github/supported_k8s_node_versions.yaml
            echo 'EOF'
          ) >> "${GITHUB_OUTPUT}"

  build-e2e-image:
    runs-on: ubuntu-latest
    env:
      IMG: kong-operator
      TAG: e2e-${{ github.sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: build docker image
        run: make docker.build

      - name: save docker image as artifact
        run: docker save "$IMG:$TAG" -o kong-operator_e2e.tar

      - name: upload docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kong-operator-e2e-image-${{ github.run_id }}
          path: kong-operator_e2e.tar
          retention-days: 1
          if-no-files-found: error

  run-aigateway-chainsaw-tests:
    needs:
      - resolve-k8s-version
      - build-e2e-image
    uses: ./.github/workflows/__e2e_chainsaw_tests.yaml
    secrets: inherit
    with:
      node_image_version: ${{ needs.resolve-k8s-version.outputs.latest }}
      aigw-dp-image: ${{ format('{0}:{1}', github.event.inputs.aigateway-image-repo,
        github.event.inputs.aigateway-image-tag) }}
      suites: '[{"suite": "aigateway"}, {"suite": "onpremaigateway"}]'

  notify-on-slack:
    timeout-minutes: ${{ fromJSON(vars.GHA_DEFAULT_TIMEOUT) }}
    needs:
      - run-aigateway-chainsaw-tests
    if: ${{ !cancelled() && github.event.inputs.send-slack-notification == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Notify on Slack with the result of the validation tests
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE: ${{ format('{0}:{1}', github.event.inputs.aigateway-image-repo, github.event.inputs.aigateway-image-tag) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "${FAILED}" == "true" ]]; then
            text=":red_circle: Image validation tests for AIGateway dataplane image \`${IMAGE}\` failed: <${RUN_URL}|workflow run>"
          else
            text=":white_check_mark: Image validation tests for AIGateway dataplane image \`${IMAGE}\` passed: <${RUN_URL}|workflow run>"
          fi
          payload=$(jq -n --arg text "${text}" '{text: $text}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "${payload}" "${SLACK_WEBHOOK_URL}"

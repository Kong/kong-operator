# Template for creating a modifyHeaders EventGatewayVirtualClusterConsumePolicy child of a
# schemaValidation one of the same virtual cluster.
#
# Required bindings:
#   - policy_name, policy_namespace: The policy.
#   - virtual_cluster_name, virtual_cluster_namespace: Its virtual cluster.
#   - parent_policy_name, parent_policy_namespace: Its parent policy.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: apply-event-gateway-virtual-cluster-consume-policy-modify-headers-child
spec:
  try:
    - apply:
        resource:
          apiVersion: configuration.konghq.com/v1alpha1
          kind: EventGatewayVirtualClusterConsumePolicy
          metadata:
            name: ($policy_name)
            namespace: ($policy_namespace)
          spec:
            eventGatewayVirtualClusterRef:
              type: namespacedRef
              namespacedRef:
                name: ($virtual_cluster_name)
                namespace: ($virtual_cluster_namespace)
            apiSpec:
              type: modifyHeaders
              parentPolicyRef:
                kind: EventGatewayVirtualClusterConsumePolicy
                name: ($parent_policy_name)
                namespace: ($parent_policy_namespace)
              modifyHeaders:
                name: ($policy_name)
                config:
                  actions:
                    - op: set
                      set:
                        key: Validated
                        value: "true"
